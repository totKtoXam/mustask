<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>doc-016 prototype: teams under departments, cascading selectors, sight</title>
<style>
:root{--bg:#F8F8F8;--nav:#EBEBEB;--navh:#E2E2E2;--tx:#242424;--tx2:#616161;--lab:#707070;--acc:#0078D4;--accd:#0C5598;--div:#E0E0E0;--rule:#EAEAEA;--hov:#F0F0F0;--sel:#E5F0FA;--fh:#C8C8C8;--err:#C42B1C;--warn:#9D5D00;--glow:0 3px 7px rgba(0,0,0,.13),0 .6px 1.8px rgba(0,0,0,.11)}
*{box-sizing:border-box}html,body{max-width:100%}body{margin:0;font:14px/20px "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden}
.lnk{color:var(--accd);cursor:pointer;background:none;border:0;padding:0;min-height:0;font-weight:400}.lnk:hover{text-decoration:underline;background:none}
button,select,input{font:inherit}button{background:var(--nav);color:var(--tx);border:0;border-radius:4px;min-height:32px;padding:4px 12px;font-weight:600;cursor:pointer}button:hover{background:var(--navh)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,.o:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.p{background:var(--acc);color:#fff}button.p:hover{background:var(--accd)}button.sm{min-height:24px;padding:0 8px;font-weight:400;background:transparent;color:var(--accd)}button.sm:hover{background:var(--hov)}
input[type=text],select{min-height:32px;border:1px solid var(--fh);border-radius:4px;padding:4px 8px;background:#fff;color:var(--tx);width:100%}
.hint{background:#fff;border-bottom:1px solid var(--div);padding:6px 16px;font-size:12px;line-height:20px;color:var(--tx2)}.hint select{width:auto;min-height:24px;padding:0 4px}.hint button{min-height:24px;padding:0 8px;font-weight:400;font-size:12px;margin:2px 2px}
#bar{min-height:48px;background:#fff;border-bottom:1px solid var(--div);display:flex;align-items:center;gap:2px;padding:0 16px;position:relative;flex-wrap:wrap}

.chev{display:inline-block;width:6px;height:6px;border-right:1px solid var(--tx2);border-bottom:1px solid var(--tx2);transform:rotate(45deg);margin:0 2px 2px 6px}
#pop{display:none;position:absolute;top:44px;width:300px;max-width:calc(100% - 16px);background:#fff;border-radius:4px;box-shadow:var(--glow);z-index:5;max-height:420px;overflow-y:auto}
#pop input{margin:8px;width:calc(100% - 16px)}#pop .o{padding:0 12px;min-height:36px;line-height:36px;cursor:pointer;display:block}#pop .o:hover,#pop .o:focus{background:var(--hov)}#pop .o.cur{font-weight:600;background:var(--sel)}
#pop .o.create{color:var(--accd);border-bottom:1px solid var(--rule)}#pop .o.dis{color:var(--lab);cursor:default}#pop .o.mut{color:var(--tx2);cursor:default}
#pop h6{margin:0;padding:8px 12px 2px;color:var(--lab);font-size:12px;line-height:16px;font-weight:600}#pop h6.org{background:var(--bg);margin-top:4px;padding:4px 12px}
.sk{height:14px;margin:12px;background:linear-gradient(90deg,#eee,#f7f7f7,#eee);border-radius:3px}
.msg{padding:8px 12px;font-size:13px}.msg.err{border-left:3px solid var(--err);margin:8px}
#wrap{display:flex;min-height:calc(100vh - 150px)}
nav{width:220px;background:var(--nav);padding:8px 0;flex:none}nav a{display:block;height:36px;line-height:36px;padding:0 16px 0 13px;cursor:pointer;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}nav a:hover{background:var(--navh)}nav a.cur{background:#DCDCDC;border-left-color:var(--acc);font-weight:600}nav h5{margin:12px 16px 4px;color:var(--lab);font-size:12px;font-weight:600}
main{flex:1;padding:16px 24px;min-width:0}h1{font-size:20px;line-height:28px;font-weight:600;margin:0 0 4px}h1:focus{outline:none}h3{margin:0 0 12px;font-size:16px}h4{font-size:14px;margin:8px 0 4px}
.card{background:#fff;border-radius:4px;box-shadow:var(--glow);padding:12px 16px;margin-bottom:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--lab);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--rule)}td{padding:0 8px;height:36px;border-bottom:1px solid var(--rule)}
.tag{background:var(--nav);border-radius:4px;padding:0 6px;font-size:12px;line-height:16px;margin-left:6px;display:inline-block;font-weight:400}.mut{color:var(--tx2)}
.cols{display:flex;gap:16px;flex-wrap:wrap}.cols>div{flex:1;min-width:220px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.bar .sp{flex:1}
.notice{background:#fff;box-shadow:var(--glow);border-left:3px solid var(--warn);border-radius:4px;padding:6px 12px;margin-bottom:8px;font-size:13px;display:flex;gap:8px}.notice .sp{flex:1}
.notice.err,.alert{border-left-color:var(--err)}.alert{background:#FDF3F2;border:1px solid #F1BBB7;border-left:3px solid var(--err);border-radius:4px;padding:8px 12px;margin:8px 0;font-size:13px}
.info{border-left-color:var(--acc)}
.empty{padding:24px;text-align:center;color:var(--tx2)}
#dlg{display:none;position:fixed;inset:0;background:#0005;z-index:9;align-items:center;justify-content:center}#dlg.open{display:flex}
#dlg .box{background:#fff;border-radius:4px;box-shadow:var(--glow);padding:20px;width:460px;max-width:92vw;max-height:90vh;overflow:auto}
#dlg label{display:block;margin:10px 0 2px;font-size:12px;color:var(--lab);font-weight:600}.err{color:var(--err);font-size:12px;min-height:16px}.helper{color:var(--tx2);font-size:12px}
#dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.chk{display:flex;gap:8px;align-items:center;min-height:32px}
#note{position:fixed;left:16px;bottom:16px;max-width:calc(100vw - 32px);background:#242424;color:#fff;padding:10px 16px;border-radius:4px;display:none;z-index:20}
@media(max-width:1023px){nav{width:150px}}
@media(max-width:640px){#wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto}nav h5{display:none}main{padding:12px}#pop{width:calc(100% - 16px);left:8px!important}}
</style></head><body>
<div class="hint" id="hint"></div>
<div id="bar"></div>
<div id="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div id="dlg"><div class="box" id="box" role="dialog" aria-modal="true"></div></div><div id="note" role="status"></div>
<script>
(function(){
'use strict';
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function seed(){return {
 depts:[{n:'Логистика',o:'Ромашка'},{n:'Финансы',o:'Ромашка'},{n:'Маркетинг',o:'Ромашка'},{n:'Команды без департамента',o:'Ромашка',fb:1},{n:'Проекты без департамента',o:'Ромашка',fb:1},{n:'Склад',o:'Другая'}],
 teams:[{n:'MARS',d:'Логистика'},{n:'VENUS',d:'Логистика'},{n:'SATURN',d:'Логистика'},{n:'JUPITER',d:'Финансы'},{n:'PLUTO',d:'Команды без департамента'},{n:'ORION',d:'Склад'}],
 projs:[{n:'A',k:'MSK',d:'Логистика',vis:0},{n:'B',k:'BET',d:'Логистика',vis:0},{n:'G',k:'GGG',d:'Логистика',vis:0},{n:'C',k:'FIN',d:'Финансы',vis:0},{n:'D',k:'DDD',d:'Финансы',vis:0},{n:'E',k:'EEE',d:'Проекты без департамента',vis:0},{n:'Z',k:'ZZZ',d:'Склад',vis:0}],
 links:[['MARS','A'],['MARS','B'],['VENUS','A'],['JUPITER','C'],['JUPITER','D'],['ORION','Z']]}}
var M=seed();
var USERS={
 ann:{name:'Ann',role:'Администратор «Ромашки»',admin:['Ромашка'],orgs:['Ромашка'],mem:[],grants:[]},
 olga:{name:'Olga',role:'Участник; в команде VENUS и ORION',admin:[],orgs:['Ромашка','Другая'],mem:['VENUS','ORION'],grants:[]},
 max:{name:'Max',role:'Участник; «Менеджер» департамента «Логистика»',admin:[],orgs:['Ромашка'],mem:[],grants:['Логистика']},
 pavel:{name:'Pavel',role:'Читатель, без доступов и команд',admin:[],orgs:['Ромашка'],mem:[],grants:[]}};
var S={u:'ann',sel:{org:'Ромашка',dept:null,team:null,proj:null},page:{t:'struct'},pop:null,q:'',sim:'ok',dlg:null,notice:null,banner:null,mem:{}};
var KIND={dept:'департамент',team:'команда',proj:'проект'};
function U(){return USERS[S.u]}
function by(a,k,n){return a.filter(function(x){return x[k]===n})[0]}
function D(n){return by(M.depts,'n',n)}function T(n){return by(M.teams,'n',n)}function P(n){return by(M.projs,'n',n)}
function dOrg(d){return D(d).o}function tOrg(t){return dOrg(T(t).d)}function pOrg(p){return dOrg(P(p).d)}
function isLinked(t,p){return M.links.some(function(l){return l[0]===t&&l[1]===p})}
function projsOf(t){return M.links.filter(function(l){return l[0]===t}).map(function(l){return l[1]})}
function teamsOf(p){return M.links.filter(function(l){return l[1]===p}).map(function(l){return l[0]})}
function isAdmin(o){return U().admin.indexOf(o)>=0}
function mgr(d){return U().grants.indexOf(d)>=0}
function canDept(d){return isAdmin(dOrg(d))||mgr(d)}
function isMember(t){return U().mem.indexOf(t)>=0}
// sight (BR-TD-12..-15)
function visP(p){var o=P(p);if(!o)return false;var g=dOrg(o.d);if(U().orgs.indexOf(g)<0)return false;if(isAdmin(g))return true;return mgr(o.d)||!!o.vis||teamsOf(p).some(isMember)}
function visT(t){var o=T(t);if(!o)return false;var g=dOrg(o.d);if(U().orgs.indexOf(g)<0)return false;if(isAdmin(g))return true;return isMember(t)||mgr(o.d)||projsOf(t).some(visP)}
function visD(d){var o=D(d);if(!o)return false;if(U().orgs.indexOf(o.o)<0)return false;if(isAdmin(o.o))return true;return mgr(d)||M.teams.some(function(t){return t.d===d&&visT(t.n)})||M.projs.some(function(p){return p.d===d&&visP(p.n)})}
function createOrgs(){return U().orgs.filter(function(o){return isAdmin(o)||M.depts.some(function(d){return d.o===o&&mgr(d.n)})})}
function createOrg(){return S.sel.org||(createOrgs().length===1?createOrgs()[0]:null)}
function createDepts(o){return M.depts.filter(function(d){return d.o===o&&canDept(d.n)}).map(function(d){return d.n})}
function srt(a){return a.slice().sort(function(x,y){return x.localeCompare(y,'ru')})}
function toast(t){var n=$('#note');n.textContent=t;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){n.style.display='none'},4500)}
// offers (BR-TD-8)
function offers(k){var s=S.sel,orgs=s.org?[s.org]:U().orgs,g=[];
 orgs.forEach(function(o){var items;
  if(k==='dept')items=M.depts.filter(function(d){return d.o===o&&visD(d.n)}).map(function(d){return d.n});
  else if(k==='team')items=M.teams.filter(function(t){return tOrg(t.n)===o&&visT(t.n)&&(!s.dept||t.d===s.dept)}).map(function(t){return t.n});
  else items=M.projs.filter(function(p){return pOrg(p.n)===o&&visP(p.n)&&(!s.dept||p.d===s.dept)&&(!s.team||isLinked(s.team,p.n))}).map(function(p){return p.n});
  if(items.length)g.push({h:s.org?null:o,items:srt(items)})});
 return g}
function label(sel){var r=[];if(sel.org)r.push(sel.org);['dept','team','proj'].forEach(function(k){if(sel[k])r.push(sel[k])});return r.join(' / ')}
function names(list){return list.map(function(x){return KIND[x[0]]+' '+x[1]}).join(', ')}
// choosing (BR-TD-9, -10)
function choose(k,v){var s=S.sel,lost=[];
 if(k==='org'){
  if(v===s.org)return;
  if(s.org)S.mem[s.org]={dept:s.dept,team:s.team,proj:s.proj};
  if(v===null){['dept','team','proj'].forEach(function(x){if(s[x])lost.push([x,s[x]])});S.sel={org:null,dept:null,team:null,proj:null}}
  else{S.sel={org:v,dept:null,team:null,proj:null};var r=S.mem[v];if(r){S.sel.dept=r.dept;S.sel.team=r.team;S.sel.proj=r.proj;var rep=repair(true);if(rep.reset.length)lost=rep.reset}}
 }else if(k==='dept'){
  if(v===null){if(s.team)lost.push(['team',s.team]);if(s.proj)lost.push(['proj',s.proj]);s.dept=null;s.team=null;s.proj=null}
  else{s.org=dOrg(v);s.dept=v;if(s.team&&T(s.team).d!==v){lost.push(['team',s.team]);s.team=null}if(s.proj&&P(s.proj).d!==v){lost.push(['proj',s.proj]);s.proj=null}}
 }else if(k==='team'){
  if(v===null)s.team=null;
  else{s.team=v;s.dept=T(v).d;s.org=dOrg(s.dept);if(s.proj&&!isLinked(v,s.proj)){lost.push(['proj',s.proj]);s.proj=null}}
 }else{
  if(v===null)s.proj=null;
  else{s.proj=v;s.dept=P(v).d;s.org=dOrg(s.dept);if(s.team&&!isLinked(s.team,v)){lost.push(['team',s.team]);s.team=null}}
 }
 S.notice=lost.length?'Выбор сброшен: '+names(lost)+'.':null;
 S.pop=null;S.q='';follow();draw()}
// repair (BR-TD-18); remembered: true = panel opened with a stored selection
function repair(remembered){var s=S.sel,reset=[],changed=false;
 if(s.org&&U().orgs.indexOf(s.org)<0){['dept','team','proj'].forEach(function(x){if(s[x])reset.push([x,s[x]])});S.sel={org:U().orgs[0]||null,dept:null,team:null,proj:null};return fin(remembered,reset,true)}
 var owner=s.team&&visT(s.team)?T(s.team).d:(s.proj&&visP(s.proj)?P(s.proj).d:null);
 if(owner&&s.dept!==owner){s.dept=owner;s.org=dOrg(owner);changed=true}
 if(s.dept&&(!visD(s.dept)||dOrg(s.dept)!==s.org)){reset.push(['dept',s.dept]);s.dept=null;if(s.team){reset.push(['team',s.team]);s.team=null}if(s.proj){reset.push(['proj',s.proj]);s.proj=null}}
 if(s.team&&(!visT(s.team)||T(s.team).d!==s.dept)){reset.push(['team',s.team]);s.team=null}
 if(s.proj&&(!visP(s.proj)||P(s.proj).d!==s.dept||(s.team&&!isLinked(s.team,s.proj)))){reset.push(['proj',s.proj]);s.proj=null}
 return fin(remembered,reset,changed||reset.length>0)}
function fin(remembered,reset,changed){var msg=null;
 if(remembered){if(changed)msg='Ранее выбранный контекст недоступен. Выбрано: '+label(S.sel)+'.'}
 else if(reset.length)msg='Выбор сброшен: '+names(reset)+'.';
 return {reset:reset,msg:msg}}
function liveRepair(){var r=repair(false);if(r.msg)S.notice=r.msg;follow()}
function follow(){var p=S.page;if(p.t==='proj'||p.t==='team'){
 if(p.t==='proj'&&!visP(p.n)||p.t==='team'&&!visT(p.n)){S.page={t:'struct'};return}
 if(S.sel.proj)S.page={t:'proj',n:S.sel.proj};else if(S.sel.team)S.page={t:'team',n:S.sel.team};else S.page={t:'struct'}}}
function openProj(n){choose('proj',n);S.page={t:'proj',n:n};draw()}
function openTeam(n){choose('team',n);S.page={t:'team',n:n};draw()}
function lk(act,a,b,t){return '<button class="lnk" data-act="'+act+'" data-a="'+esc(a||'')+'" data-b="'+esc(b||'')+'">'+esc(t)+'</button>'}
// ---------- chrome
function drawHint(){var h='Прототип doc-016. Пользователь: <select id="usr" aria-label="Пользователь">';
 Object.keys(USERS).forEach(function(u){h+='<option value="'+u+'"'+(u===S.u?' selected':'')+'>'+USERS[u].name+' — '+USERS[u].role+'</option>'});
 h+='</select> Состояние: <select id="sim" aria-label="Состояние данных">';
 [['ok','обычное'],['load','загрузка'],['err','ошибка']].forEach(function(o){h+='<option value="'+o[0]+'"'+(S.sim===o[0]?' selected':'')+'>'+o[1]+'</option>'});
 h+='</select> <button data-act="reset">Вернуть исходные данные</button><br>Сценарии: '+
 '<button data-act="scn" data-a="remembered">Запомнено «Финансы / VENUS»</button>'+
 '<button data-act="scn" data-a="live">Ann переносит VENUS (выбор: Логистика / VENUS / A)</button>'+
 '<button data-act="deep" data-a="proj" data-b="C">Адрес проекта C</button>'+
 '<button data-act="deep" data-a="team" data-b="JUPITER">Адрес команды JUPITER</button>'+
 '<button data-act="deep" data-a="dept" data-b="Финансы">Адрес департамента «Финансы»</button>'+
 '<button data-act="scn" data-a="race">Гонка: связать MARS с C</button>';
 $('#hint').innerHTML=h}
function triggerBtn(k){return document.querySelector('#bar [data-act="sel"][data-a="'+k+'"]')}
function drawBar(){var cap={org:'Организация',dept:'Департамент',team:'Команда',proj:'Проект'},h='<b>▣ MUSTASK</b>';
 ['org','dept','team','proj'].forEach(function(k,i){var v=k==='org'?(S.sel.org||'Все организации'):(S.sel[k]||'все');
  if(i)h+='<span class="sep">/</span>';
  h+='<button class="sel '+((k==='org'?S.sel.org:S.sel[k])?'on':'')+'" data-act="sel" data-a="'+k+'" aria-haspopup="listbox" aria-expanded="'+(S.pop===k)+'"><small>'+cap[k]+'</small>'+esc(v)+'<span class="chev"></span></button>'});
 h+='<span style="flex:1"></span><span>'+esc(U().name)+'</span><div id="pop" role="listbox"></div>';$('#bar').innerHTML=h;if(S.pop)drawPop()}
function opt(act,k,v,text,cls){return '<div class="o '+(cls||'')+'" role="option" tabindex="0" data-act="'+act+'" data-a="'+k+'" data-b="'+esc(v)+'">'+esc(text)+'</div>'}
function drawPop(){var k=S.pop,p=$('#pop'),f=(S.q||'').toLowerCase(),h='';p.style.display='block';
 var b=triggerBtn(k),bw=$('#bar').clientWidth,pw=Math.min(300,bw-16);p.style.left=Math.max(8,Math.min(b.offsetLeft,bw-pw-8))+'px';
 if(S.sim==='load'){p.innerHTML='<div role="status" aria-label="Загрузка">'+'<div class="sk"></div>'.repeat(4)+'</div>';return}
 if(S.sim==='err'){p.innerHTML='<div class="msg err" role="alert">Не удалось загрузить список. Попробуйте ещё раз.<br><button data-act="retry">Повторить</button></div>';return}
 if(k==='org'){h='<h6>Организации</h6>'+opt('pick','org','*','Все организации',S.sel.org?'':'cur');
  if(!U().orgs.length)h+='<div class="o mut">Нет доступных организаций</div>';
  U().orgs.forEach(function(o){h+=opt('pick','org',o,o,S.sel.org===o?'cur':'')});p.innerHTML=h;return}
 h='<input id="q" placeholder="Найти…" aria-label="Найти" value="'+esc(S.q||'')+'" type="text">';
 var co=createOrg();
 if(k==='dept'){if(co&&isAdmin(co))h+=opt('create','dept','','＋ Создать департамент','create')}
 else{var can=co?createDepts(co).length>0:createOrgs().length>0;
  if(can)h+=co?opt('create',k,'','＋ Создать '+(k==='team'?'команду':'проект'),'create'):'<div class="o create dis" aria-disabled="true">＋ Создать '+(k==='team'?'команду':'проект')+' — выберите организацию</div>'}
 h+=opt('pick',k,'','все',S.sel[k]?'':'cur');
 var gs=offers(k),shown=0,total=0;
 gs.forEach(function(g){total+=g.items.length;var it=g.items.filter(function(x){return x.toLowerCase().indexOf(f)>=0});if(!it.length)return;shown+=it.length;
  if(g.h)h+='<h6 class="org">'+esc(g.h)+'</h6>';
  function rows(l){return l.map(function(x){return opt('pick',k,x,x,S.sel[k]===x?'cur':'')}).join('')}
  if(k==='team'){var own=it.filter(isMember),oth=it.filter(function(x){return !isMember(x)});
   if(own.length)h+='<h6>Мои команды</h6>'+rows(own);if(oth.length)h+=(own.length?'<h6>Другие команды</h6>':'')+rows(oth)}
  else h+=rows(it)});

function nextColour(depts,org){return pick(depts.filter(function(d){return d.o===org&&d.c!==undefined}).map(function(d){return d.c}))}
function pick(used){
 if(!used.length)return 0;var free=[];PAL.forEach(function(p,i){if(used.indexOf(i)<0)free.push(i)});
 if(free.length){var best=-1,bd=-1;free.forEach(function(i){var m=Math.min.apply(null,used.map(function(u){return hd(PAL[i][2],PAL[u][2])}));if(m>bd){bd=m;best=i}});return best}
 var cnt=PAL.map(function(p,i){return used.filter(function(u){return u===i}).length});var mn=Math.min.apply(null,cnt);return cnt.indexOf(mn)}

 m.depts.forEach(function(d){m.teams.forEach(function(t){if(t.d===d.n&&t.c===undefined)t.c=childColour(m.teams,d.n,d.c)});m.projs.forEach(function(p){if(p.d===d.n&&p.c===undefined)p.c=childColour(m.projs,d.n,d.c)})})}

function teamsOf(p){return M.links.filter(function(l){return l[1]===p}).map(function(l){return l[0]})}

function visP(p){var o=P(p);if(!o)return false;var g=dOrg(o.d);if(U().orgs.indexOf(g)<0)return false;if(isAdmin(g))return true;return mgr(o.d)||!!o.vis||teamsOf(p).some(isMember)}
function visT(t){var o=T(t);if(!o)return false;var g=dOrg(o.d);if(U().orgs.indexOf(g)<0)return false;if(isAdmin(g))return true;return isMember(t)||mgr(o.d)||projsOf(t).some(visP)}
function visD(d){var o=D(d);if(!o)return false;if(U().orgs.indexOf(o.o)<0)return false;if(isAdmin(o.o))return true;return mgr(d)||M.teams.some(function(t){return t.d===d&&visT(t.n)})||M.projs.some(function(p){return p.d===d&&visP(p.n)})}

function okLink(){var d=S.dlg,sel=[].slice.call(document.querySelectorAll('.lt:checked')).map(function(x){return x.value});
 if(!sel.length){setE('#e-link','Выберите хотя бы одну команду');return}
 sel.forEach(function(t){M.links.push([t,d.n])});toast(sel.length===1?'Команда «'+sel[0]+'» добавлена.':'Команды добавлены: '+sel.length+'.');afterWrite()}
// ---------- events
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');
 if(S.pal&&e.target.id==='pal'){palClose();return}
 if(S.pop==='ctx'&&!(e.target.closest&&(e.target.closest('#cp')||e.target.closest('#cx')))){S.pop=null;drawBar()}
 if(!el)return
 var act=el.getAttribute('data-act'),a=el.getAttribute('data-a'),b=el.getAttribute('data-b');
 if(act==='vis')return;
 if(act==='spick'){spick(a,b);return}
 if(act==='switchview'){setView(view()==='tree'?'list':'tree');draw();return}
 if(act==='tog'){S.col[a]=!S.col[a];drawMain();return}
 if(act==='clearq'){S.pgq='';drawMain();var n=$('#pgq');if(n)n.focus();return}
 if(act==='colall'){var ns=buildNodes();var all=allCollapsed();ns.forEach(function(x){if(hasKids(ns,x.id))S.col[x.id]=!all});drawMain();return}
 if(act==='stub'){toast('Как сегодня (в прототипе не показано).');return}
 if(act==='deldept'){var dd=a;if(M.teams.some(function(t){return t.d===dd}))S.banner='Нельзя удалить департамент, в котором есть команды';else if(M.projs.some(function(p){return p.d===dd}))S.banner='Нельзя удалить департамент, в котором есть проекты';else{M.depts=M.depts.filter(function(x){return x.n!==dd});toast('Департамент «'+dd+'» удалён.');liveRepair()}draw();return} // handled by change
 if(act==='ctx'){S.pop=S.pop==='ctx'?null:'ctx';S.cq='';S.sact=0;drawBar();if(S.pop==='ctx'){var ci=$('#cq');if(ci)ci.focus()}return}
 if(act==='palopen'){palOpen();return}
 if(act==='recent'){recentPick(+a);return}
 if(act==='pick'){var val=b===''?null:b;S.fk=a;if(a==='org')choose('org',b==='*'?null:b);else choose(a,val);return}
 if(act==='retry'){S.sim='ok';draw();return}
 if(act==='create'){var tk=a;S.pop=null;drawBar();var o=createOrg();
  if(tk==='dept'){open({t:'newdept',o:o});return}
  open({t:tk==='team'?'newteam':'newproj',o:o,dept:presetDept(o)});return}
 if(act==='newdept'){open({t:'newdept',o:createOrg()});return}
 if(act==='newteam'||act==='newproj'){var o2=a?dOrg(a):createOrg();open({t:act,o:o2,dept:a||presetDept(o2)});return}
 if(act==='moveteam'||act==='moveproj'){open({t:act,n:a,dest:'',refused:false});return}
 if(act==='linkteams'){open({t:'link',n:a});return}
 if(act==='unlinkask'){var back=S.dlg&&(S.dlg.t==='moveteam'||S.dlg.t==='moveproj')?S.dlg:null;open({t:'unlink',t1:a,p1:b,back:back});return}
 if(act==='okNewTeam'){okCreate(true);return}if(act==='okNewProj'){okCreate(false);return}
 if(act==='okNewDept'){okNewDept();return}if(act==='okMove'){okMove();return}if(act==='okLink'){okLink();return}
 if(act==='okUnlink'){var d=S.dlg;M.links=M.links.filter(function(l){return !(l[0]===d.t1&&l[1]===d.p1)});toast('Команда «'+d.t1+'» отключена от проекта «'+d.p1+'».');
  liveRepair();if(d.back){S.dlg=d.back;draw();renderDlg()}else{closeDlg();draw()}return}
 if(act==='okVis'){P(S.dlg.n).vis=1;toast('Проект «'+S.dlg.n+'» виден всей организации.');afterWrite();return}
 if(act==='close'){var bk=S.dlg&&S.dlg.back;if(bk){S.dlg=bk;renderDlg()}else{closeDlg();draw()}return}
 if(act==='page'){S.page={t:a};draw();return}
 if(act==='openproj'){openProj(a);return}if(act==='openteam'){openTeam(a);return}
 if(act==='dept'){choose('dept',a);return}
 if(act==='closenotice'){S.notice=null;drawMain();return}if(act==='closebanner'){S.banner=null;drawMain();return}
 if(act==='reset'){M=seed();colourAll(M);S.mem={};S.sel={org:'Ромашка',dept:null,team:null,proj:null};S.page={t:'struct'};S.notice=null;S.banner=null;draw();return}
 if(act==='deep'){S.notice=null;var vis=a==='proj'?visP(b):a==='team'?visT(b):visD(b);
  if(vis){if(a==='proj')openProj(b);else if(a==='team')openTeam(b);else{S.page={t:'struct'};choose('dept',b)}}
  else S.page={t:'nf',msg:a==='proj'?'Проект не найден.':a==='team'?'Команда не найдена.':'Область не найдена.'};
  draw();return}
 if(act==='scn'){S.notice=null;S.banner=null;
  if(a==='remembered'){S.sel={org:'Ромашка',dept:'Финансы',team:'VENUS',proj:null};var r=repair(true);S.notice=r.msg;S.page={t:'struct'};}
  if(a==='live'){S.sel={org:'Ромашка',dept:'Логистика',team:'VENUS',proj:'A'};M.links=M.links.filter(function(l){return !(l[0]==='VENUS'&&l[1]==='A')});T('VENUS').d='Финансы';liveRepair();toast('Ann отключила VENUS от A и переместила её в «Финансы».')}
  if(a==='race')S.banner='Команду можно связать только с проектом своего департамента.';
  draw();return}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='usr'){S.u=t.value;S.pop=null;S.sact=0;var r=repair(false);S.notice=r.msg;if(S.u==='pavel'||U().orgs.indexOf(S.sel.org)<0)S.page={t:'struct'};follow();draw();return}
 if(t.id==='sim'){S.sim=t.value;draw();return}
 if(t.id==='vis'){var n=t.getAttribute('data-a');if(t.checked){t.checked=false;open({t:'vis',n:n})}else{P(n).vis=0;toast('Проект «'+n+'» виден только участвующим.');liveRepair();draw()}}});
document.addEventListener('input',function(e){var id=e.target.id;
 if(id==='pgq'){var p=e.target.selectionStart;S.pgq=e.target.value;drawMain();var n=$('#pgq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}return}
 if(id==='cq'){S.cq=e.target.value;S.sact=0;drawPanel();return}
 if(id==='pq'){S.pq=e.target.value;S.sact=0;drawPal();return}});
function colMove(t,key){var k=t.getAttribute('data-col'),i=+t.getAttribute('data-i');
 function go(c,j){var l=[].slice.call(document.querySelectorAll('#cbody [data-col="'+c+'"]'));if(!l.length)return;(l[Math.max(0,Math.min(j,l.length-1))]).focus()}
 if(key==='ArrowDown')go(k,i+1);else if(key==='ArrowUp'){if(i===0){var q=$('#cq');if(q)q.focus()}else go(k,i-1)}
 else if(key==='ArrowRight')go(COLS[Math.min(COLS.indexOf(k)+1,3)],i);else if(key==='ArrowLeft')go(COLS[Math.max(COLS.indexOf(k)-1,0)],i)}
document.addEventListener('keydown',function(e){var t=e.target;
 if((e.ctrlKey||e.metaKey)&&e.key&&e.key.toLowerCase()==='k'){if(e.preventDefault)e.preventDefault();palOpen();return}
 if(t.id==='pq'){var n=palItems().length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(e.preventDefault)e.preventDefault();if(n)S.sact=(S.sact+(e.key==='ArrowDown'?1:n-1))%n;drawPal();return}
  if(e.key==='Enter'){if(e.preventDefault)e.preventDefault();palEnter();return}
  if(e.key==='Escape'){palClose();return}return}
 if(t.id==='cq'){var q=(S.cq||'').trim(),all=q?flat(searchRes(q)):[];
  if(e.key==='ArrowDown'){if(e.preventDefault)e.preventDefault();if(q){if(all.length)S.sact=(S.sact+1)%all.length;drawPanel()}else{var f0=document.querySelector('#cbody [data-col="org"]');if(f0)f0.focus()}return}
  if(e.key==='ArrowUp'&&q){if(e.preventDefault)e.preventDefault();if(all.length)S.sact=(S.sact+all.length-1)%all.length;drawPanel();return}
  if(e.key==='Enter'&&all.length){if(e.preventDefault)e.preventDefault();var r=all[S.sact]||all[0];spick(r.k,r.n);return}}
 if(S.pop==='ctx'&&t.getAttribute&&t.getAttribute('data-col')&&['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].indexOf(e.key)>=0){if(e.preventDefault)e.preventDefault();colMove(t,e.key);return}
 if(e.key==='Escape'&&t.id==='pgq'&&S.pgq){S.pgq='';drawMain();var n=$('#pgq');if(n)n.focus();return}
 if(e.key==='Escape'){if(S.pal){palClose();return}if(S.dlg){closeDlg();draw()}else if(S.pop){S.pop=null;drawBar();var b=$('#cx');if(b)b.focus()}return}
 if(e.key==='Enter'&&t.classList&&(t.classList.contains('o')||t.tagName==='A'))t.click()});
draw();
})();
</script></body></html>

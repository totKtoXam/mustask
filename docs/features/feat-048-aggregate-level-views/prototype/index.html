 if(g==='project')r.forEach(function(q){q.its.sort(function(x,y){return RK[x[1]].indexOf(x[0])-RK[y[1]].indexOf(y[0])})});return r}
function vsw(g){var o=OFF[V.lvl];if(o.length<2)return'';var h='<span style="position:relative"><button class="t" data-v="sw" aria-haspopup="menu" aria-expanded="'+V.menu+'">Группировка: '+GN[g]+' ▾</button>';
 if(V.menu){h+='<div class="menu" role="menu" aria-label="Группировка" style="top:32px;left:0">';o.forEach(function(x){h+='<div role="menuitemradio" aria-checked="'+(x===g)+'" data-v="pick" data-g="'+x+'">'+(x===g?'✓ ':'&nbsp;&nbsp;&nbsp;')+GN[x]+'</div>'});h+='</div>'}return h+'</span>'}
function vrow(x,g,mv){var tm=g==='team'?'':'<span class="tag">'+(x[2]||'Без команды')+'</span>';
 return '<div class="row"><span class="g" aria-hidden="true">'+(mv?'⋮⋮':'')+'</span><span class="id">'+x[0]+'</span><span class="ti">'+esc(x[4])+'</span>'+tm+(mv?'<span class="mn"><button class="t" data-v="rm" data-i="'+x[0]+'" aria-label="Ещё действия: '+x[0]+'">⋮</button>'+(V.rm===x[0]?'<div class="menu" role="menu"><div data-v="mv">В начало</div><div data-v="mv">Выше</div><div data-v="mv">Ниже</div><div data-v="mv">В конец</div></div>':'')+'</span>':'')+'</div>'}
function vcs(x){return V.cs[x[0]]!==undefined?V.cs[x[0]]:x[3]}
function vcard(x){var cs=vcs(x);return '<div class="card">'+x[0]+' '+esc(x[4])+' <button class="t" data-v="cm" data-i="'+x[0]+'" aria-label="Ещё действия: '+x[0]+'">⋮</button>'+(V.rm===x[0]?'<div class="menu" role="menu">'+COLS.map(function(c,j){return j===cs?'':'<div data-v="cmv" data-i="'+x[0]+'" data-c="'+j+'">Переместить в колонку «'+c+'»</div>'}).join('')+'</div>':'')+'</div>'}
function vtab(rows){return '<table><thead><tr><th>Номер</th><th>Название</th><th>Проект</th><th>Команда</th></tr></thead><tbody>'+rows.map(function(x){return'<tr><td>'+x[0]+'</td><td>'+esc(x[4])+'</td><td><a href="#">'+x[1]+'</a></td><td>'+(x[2]||'Без команды')+'</td></tr>'}).join('')+'</tbody></table>'}
function vbody(vw,gr,g,mv,key){var its=gr.its,sh=V.shown[key]||PAGE,part=its.slice(0,sh),more=its.length>sh,h='';
 if(vw==='b')h=part.map(function(x){return vrow(x,g,mv)}).join('');
 else if(vw==='w')h=vtab(part);
 else h='<div class="lane">'+COLS.map(function(c,j){return '<div class="cell"><h3>'+c+' ('+its.filter(function(x){return vcs(x)===j}).length+')</h3>'+part.filter(function(x){return vcs(x)===j}).map(vcard).join('')+'</div>'}).join('')+'</div>';
 return h+(more?'<div class="cap"><button class="t" data-v="more" data-k="'+key+'">Показать ещё</button></div>':'')}
function vdraw(){var vw=VK[cur],g=vgrp(),its=vscope(),gs=vgroups(g,its),l=V.lvl,nar=l==='team'||l==='teamd'||l==='projt';
 var mv=vw==='b'&&((g==='project'&&!nar&&(l==='org'||l==='dept'))||(l==='proj'&&g==='none'));
 var hint='';if(vw==='b'){if(g==='project'&&nar)hint='Пока выбор сужает список, порядок не меняется. Выберите «все», чтобы менять его.';
  else if(g!=='project'&&((l==='org'||l==='dept')||(l==='proj'&&g==='team')))hint='При этой группировке строки идут по времени изменения, порядок не меняется. Выберите «По проекту», чтобы менять его.'}
 var h='<div class="bar"><span>Уровень:</span>'+LV.map(function(x){return'<button data-v="lv" data-l="'+x[0]+'" style="'+(x[0]===l?'background:var(--sel)':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
 h+='<h1>'+{b:'Бэклог',k:'Канбан',w:'Рабочие элементы'}[vw]+'</h1><div class="bar">'+vsw(g)+(g!=='none'?'<button data-v="col">Свернуть все</button>':(vw==='w'?'':'<span class="cap">Элементов: '+its.length+'</span>'))+'</div>';
 if(hint)h+='<div class="ntc i">'+hint+'</div>';
 var ok=vw+l+g;
 if(!its.length)h+='<p>Ничего не найдено</p>';
 else if(vw==='w'&&g==='none')h+=vtab(its)+'<div class="cap">Строки 1–'+its.length+' из '+its.length+' · столбцы сортируются, страницы по 50</div>';
 else if(g==='none')h+='<div class="acc" role="region" aria-label="Элементы">'+vbody(vw,gs[0],g,mv,ok+'|')+'</div>';
 else gs.forEach(function(q,i){var op=V.open[ok]?V.open[ok].indexOf(q.n)>-1:i===0,tag=q.k?'<span class="tag">'+q.k+'</span>':'';
  h+='<div class="acc"><div class="sum" data-v="tog" data-k="'+ok+'" data-n="'+esc(q.n)+'" tabindex="0" role="button" aria-expanded="'+op+'"><h2>'+esc(q.n)+'</h2>'+tag+'<span class="cnt">'+q.its.length+'</span></div>'+(op?'<div class="det">'+vbody(vw,q,g,mv,ok+'|'+q.n)+'</div>':'')+'</div>'});
 $('m').innerHTML=h}
$('m').addEventListener('click',function(e){if(!VK[cur])return;var t=e.target.closest('[data-v]');if(!t){V.menu=false;V.rm=null;return vdraw()}var a=t.getAttribute('data-v'),vw=VK[cur];
 if(a==='sw'){V.menu=!V.menu;V.rm=null}
 else if(a==='pick'){V.mem[vw+V.lvl]=t.getAttribute('data-g');V.menu=false;toast('Группировка: '+GN[t.getAttribute('data-g')])}
 else if(a==='lv'){V.lvl=t.getAttribute('data-l');V.menu=false;V.rm=null}
 else if(a==='tog'){var k=t.getAttribute('data-k'),n=t.getAttribute('data-n'),gs=vgroups(vgrp(),vscope());
  if(!V.open[k])V.open[k]=[gs[0].n];var o=V.open[k],ix=o.indexOf(n);if(ix>-1)o.splice(ix,1);else o.push(n)}
 else if(a==='col'){V.open[vw+V.lvl+vgrp()]=[]}
 else if(a==='more'){var kk=t.getAttribute('data-k');V.shown[kk]=(V.shown[kk]||PAGE)+PAGE;toast('Загружено ещё элементов: '+PAGE)}
 else if(a==='rm'||a==='cm'){var id=t.getAttribute('data-i');V.rm=V.rm===id?null:id;V.menu=false}
 else if(a==='mv'){V.rm=null;toast('Строка перемещена внутри группы (макет)')}
 else if(a==='cmv'){V.cs[t.getAttribute('data-i')]=+t.getAttribute('data-c');V.rm=null;toast('Карточка перенесена; ячейка читается заново с первой страницы.')}
 vdraw()});
(function(){var s=$('sc');SC.forEach(function(x){var b=document.createElement('button');b.textContent=x[1];b.setAttribute('role','tab');b.onclick=function(){[].forEach.call(s.children,function(c){c.className=''});b.className='on';init(x[0])};s.appendChild(b)});s.children[0].className='on';init('part')})();
</script></body></html>

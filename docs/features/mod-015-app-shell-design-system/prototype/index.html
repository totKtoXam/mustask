<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mustask</title>
<!--
  mod-015 clickable prototype (docs/features/mod-015-app-shell-design-system/design.md, § 14).
  Self-contained: inline CSS, inline SVG copies of Material icon glyphs, vanilla JS.
  Loads nothing from any host and adds no dependency (BR-17).
  Every product string is the final Russian copy of design.md.
  The yellow dashed «Панель прототипа» and the dashed notes are prototype tooling, not design.
-->
<style>
:root{
  /* colour roles (design.md § 2.1) */
  --app-bg:#F8F8F8; --nav:#EBEBEB; --nav-hover:#E2E2E2; --nav-sel:#DCDCDC; --paper:#FFFFFF;
  --text:#242424; --text2:#616161; --accent:#0F6CBD; --accent-dark:#0C5598; --white:#FFFFFF;
  --divider:#E0E0E0; --input-border:#8A8A8A; --table-head:#F3F3F3; --hover:#F0F0F0; --row-sel:#E5F0FA;
  --error:#C42B1C; --warning:#9D5D00; --success:#107C10; --info:#01579B;
  --error-bg:#FDEDED; --error-ink:#5F2120; --info-bg:#E5F6FD; --info-ink:#014361; --warning-bg:#FFF4E5; --warning-ink:#663C00;
  --disabled:#9E9E9E; --disabled-bg:#E6E6E6; --chip:#EBEBEB;
  /* work-tracking tokens (design.md § 2.3) */
  --t-epic:#C05600; --t-feature:#773B93; --t-story:#00739E; --t-task:#8A6A00; --t-bug:#B4233A;
  --c-Proposed:#707070; --c-InProgress:#005A9E; --c-Resolved:#00796B; --c-Completed:#107C10; --c-Removed:#A4262C;
  /* layout and density (design.md § 2.5) */
  --topbar:48px; --nav-w:240px; --rail-w:48px; --snav-w:240px; --pane-w:360px; --form-w:480px;
  --col-w:280px; --col-cw:40px; --row-h:36px; --ctl-h:32px; --radius:4px; --avatar:32px; --dot:8px; --auth-w:400px;
  --shadow-menu:0 5px 5px -3px rgba(0,0,0,.2),0 8px 10px 1px rgba(0,0,0,.14),0 3px 14px 2px rgba(0,0,0,.12);
  --shadow-dialog:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12);
  --shadow-card:0 1px 3px rgba(0,0,0,.18),0 1px 1px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;font-size:14px;line-height:20px;color:var(--text);background:var(--app-bg)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.grow{flex:1 1 auto}
.muted{color:var(--text2)}
.cap{font-size:12px;line-height:16px;color:var(--text2)}

/* skip link */
.skip{position:fixed;left:8px;top:-60px;z-index:2000;background:var(--paper);padding:8px 12px;border-radius:var(--radius);box-shadow:var(--shadow-menu)}
.skip:focus{top:8px}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);background:var(--paper);border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:8px;padding:0 16px;z-index:1200;min-width:0}
.mark{font-size:16px;font-weight:500;color:var(--text);white-space:nowrap;padding:4px;border-radius:var(--radius)}
.mark:hover{text-decoration:none;background:var(--hover)}
.sw{display:flex;align-items:center;gap:2px;min-width:0}
.sw-level{display:inline-flex;align-items:center;gap:2px;height:var(--ctl-h);padding:0 4px 0 8px;border:0;background:none;border-radius:var(--radius);cursor:pointer;min-width:0;color:var(--text)}
.sw-level:hover{background:var(--hover)}
.sw-level[aria-expanded=true]{background:var(--nav-sel)}
.sw-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.sep{color:var(--text2);padding:0 2px}
.sw-empty{color:var(--text2);padding:0 8px;white-space:nowrap}
.sw-fail{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw .sk{width:120px;height:24px}
.vdiv{width:1px;align-self:stretch;margin:12px 6px;background:var(--divider);flex:none}
.trail{min-width:0;overflow:hidden}
.trail ol{display:flex;list-style:none;margin:0;padding:0;align-items:center;gap:6px;color:var(--text2);min-width:0}
.trail li{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail li.tsep{flex:none}
.avatar-btn{border:0;background:none;padding:4px;border-radius:50%;cursor:pointer;flex:none}
.avatar-btn:hover{background:var(--hover)}
.avatar{width:var(--avatar);height:var(--avatar);border-radius:50%;background:var(--text2);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
@media (max-width:1279px){.sw-name{max-width:160px}}
@media (max-width:1023px){.sw-name{max-width:96px}.sw-fail-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}

/* navigation */
.navwrap{position:fixed;top:var(--topbar);bottom:0;left:0;display:flex;z-index:1100}
.mainnav{width:var(--nav-w);background:var(--nav);display:flex;flex-direction:column;transition:width 150ms ease;overflow-x:hidden;overflow-y:auto}
.mainnav.rail{width:var(--rail-w)}
.navlist{list-style:none;margin:0;padding:4px 0}
.navlist.bottom{margin-top:auto;border-top:1px solid var(--divider)}
.navdiv{height:1px;background:var(--divider);margin:4px 0}
.navitem{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;color:var(--text);border:0;background:none;width:100%;cursor:pointer;position:relative;white-space:nowrap;text-align:left}
.navitem:hover{background:var(--nav-hover);text-decoration:none}
.navitem.sel{background:var(--nav-sel);font-weight:500}
.navitem.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.navitem:focus-visible{outline-offset:-2px}
.rail .navitem{justify-content:center;padding:0}
.setnav{width:var(--snav-w);background:var(--nav);border-left:1px solid var(--divider);overflow-y:auto;padding:12px 0}
.setnav-title{font-size:16px;line-height:24px;font-weight:500;margin:0 16px 4px}
.setnav ul{list-style:none;margin:0;padding:0}
.subheader{font-weight:500;padding:10px 16px 4px}
.navitem.set{padding-left:32px;height:36px}
@media (prefers-reduced-motion:reduce){.mainnav{transition:none}.sk{animation:none!important}.drawer-anim{animation:none!important}}

/* overlay navigation (< 1024 px) */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1300}
.overlay{position:fixed;top:0;bottom:0;left:0;display:flex;z-index:1301;box-shadow:var(--shadow-dialog);animation:slidein 180ms ease}
.overlay .mainnav,.overlay .setnav{padding-top:8px}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}

/* main region */
.main{padding:var(--topbar) 24px 64px;min-height:100vh}
body[data-nav=expanded] .main{margin-left:var(--nav-w)}
body[data-nav=rail] .main{margin-left:var(--rail-w)}
body[data-nav=settings] .main{margin-left:calc(var(--rail-w) + var(--snav-w))}
body[data-nav=overlay] .main{margin-left:0;padding-left:16px;padding-right:16px}
.main:focus-visible{outline-offset:-2px}

/* page header */
.ph{padding:16px 0 8px}
.ph-trail{margin-bottom:4px}
.ph-row{display:flex;align-items:flex-start;gap:16px}
.ph-title{font-size:20px;line-height:28px;font-weight:500;margin:2px 0;flex:1 1 200px;min-width:160px}
.cmdbar{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;overflow:hidden;min-height:38px;padding:3px}
.cmdbar .hidden{display:none}
.tabs{display:flex;gap:20px;margin-top:4px}
.tab{padding:8px 0 6px;color:var(--text2);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--text);text-decoration:none}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:var(--ctl-h);padding:4px 12px;border-radius:var(--radius);border:1px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap;background:none;color:var(--text);flex:none}
.btn .lead{color:var(--accent)}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.contained{background:var(--accent);color:var(--white)}
.btn.contained .lead{color:inherit}
.btn.contained:hover{background:var(--accent-dark)}
.btn.outlined{border-color:var(--input-border);background:var(--paper)}
.btn.outlined:hover{background:var(--hover)}
.btn.danger{background:var(--error);color:var(--white)}
.btn.danger .lead{color:inherit}
.btn.sm{min-height:28px;padding:2px 8px}
.btn.full{width:100%;justify-content:center;min-height:40px}
.btn:disabled,.btn:disabled:hover{color:var(--disabled);background:none;cursor:default}
.btn.contained:disabled,.btn.danger:disabled{background:var(--disabled-bg);color:var(--disabled)}
.btn:disabled .lead{color:var(--disabled)}
.iconbtn{width:var(--ctl-h);height:var(--ctl-h);display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--text);flex:none}
.iconbtn:hover{background:var(--hover)}
.iconbtn.sm{width:28px;height:28px}
.iconbtn:disabled{color:var(--disabled);cursor:default;background:none}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* text fields */
.tf{position:relative;display:inline-flex;flex-direction:column;min-width:130px}
.tf>label{position:absolute;top:-8px;left:9px;padding:0 4px;background:var(--paper);font-size:12px;line-height:16px;color:var(--text2);pointer-events:none;z-index:1}
.tf input,.tf select,.tf textarea,.tf .selbtn{height:38px;padding:8px 10px;border:1px solid var(--input-border);border-radius:var(--radius);font:inherit;color:var(--text);background:var(--paper);width:100%}
.tf textarea{height:auto;min-height:72px;resize:vertical}
.tf input:focus,.tf select:focus,.tf textarea:focus,.tf .selbtn:focus-visible{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tf input:disabled,.tf select:disabled,.tf textarea:disabled{color:var(--disabled);border-color:var(--disabled-bg);background:var(--paper)}
.tf .help{font-size:12px;line-height:16px;color:var(--text2);margin:3px 12px 0}
.tf.err input,.tf.err textarea{border-color:var(--error)}
.tf.err .help,.tf.err>label{color:var(--error)}
.tf .selbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;text-align:left}
.tf .selbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf.adorn input{padding-left:34px}
.tf .adorn-ic{position:absolute;left:9px;top:9px;color:var(--text2)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:34px;height:18px;accent-color:var(--text)}

/* panels, tables */
.panel{background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius)}
.panel.pad{padding:24px}
.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 8px;padding:14px 12px 10px;margin-bottom:8px}
.filterbar>.lead-ic{color:var(--text2)}
.filterbar .clear{margin-left:auto}
.tablewrap{background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius);overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{height:var(--row-h);background:var(--table-head);font-size:12px;line-height:16px;font-weight:500;color:var(--text2);text-align:left;padding:4px 12px;border-bottom:1px solid var(--divider);white-space:nowrap}
.t td{height:var(--row-h);padding:4px 12px;border-bottom:1px solid var(--divider);white-space:nowrap}
.t tbody tr:hover{background:var(--hover)}
.t tbody tr.selrow{background:var(--row-sel)}
.t tbody tr[tabindex]{cursor:pointer}
.t tbody tr:focus-visible{outline-offset:-2px}
.t td.actions{text-align:right;padding-top:2px;padding-bottom:2px}
.t td.ellip{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sortlabel{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;font-weight:500}
.sortlabel .ic{opacity:0}
.sortlabel:hover .ic,.sortlabel.active .ic{opacity:1}
.sortlabel.active{color:var(--text)}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:4px 8px;color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:var(--chip);font-size:13px;white-space:nowrap}
.chip.success{background:var(--success);color:var(--white)}
.chip .x{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;color:var(--text2)}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.dot{width:var(--dot);height:var(--dot);border-radius:50%;display:inline-block;background:currentColor;flex:none}
.dot.ring{background:transparent;border:2px solid currentColor}
.state{display:inline-flex;align-items:center;gap:6px}
.wi-ref{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.wi-ref a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .chips{flex-wrap:nowrap}
.sk{display:inline-block;height:20px;width:100%;border-radius:var(--radius);background:var(--disabled-bg);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* canon frame and alerts */
.frame{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 16px;gap:8px}
.frame .frame-ic{color:var(--text2)}
.frame-h{font-size:16px;line-height:24px;font-weight:500;margin:8px 0 0}
.frame-h.h1{font-size:20px;line-height:28px}
.frame-hint{color:var(--text2);margin:0 0 8px;max-width:520px}
.alert{display:flex;gap:12px;align-items:center;padding:6px 12px;border-radius:var(--radius);margin:8px 0}
.alert>.ic{align-self:flex-start;margin-top:2px}
.alert .msg{flex:1;padding:2px 0}
.alert.error{background:var(--error-bg);color:var(--error-ink)} .alert.error>.ic{color:var(--error)}
.alert.info{background:var(--info-bg);color:var(--info-ink)} .alert.info>.ic{color:var(--info)}
.alert.warning{background:var(--warning-bg);color:var(--warning-ink)} .alert.warning>.ic{color:var(--warning)}

/* menus, tooltip, snackbar, dialogs */
.menu{position:fixed;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-menu);padding:4px 0;min-width:200px;max-width:360px;z-index:1350;max-height:60vh;overflow:auto}
.mi{display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:36px;cursor:pointer;width:100%;border:0;background:none;text-align:left;color:var(--text)}
.mi:hover,.mi:focus{background:var(--hover)}
.mi:focus-visible{outline-offset:-2px}
.mi .check{width:20px;flex:none;color:var(--text)}
.mi .cbx{width:16px;height:16px;border:2px solid var(--input-border);border-radius:2px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.mi[aria-checked=true] .cbx{background:var(--text);border-color:var(--text);color:var(--white)}
.mi.danger{color:var(--error)}
.mi:disabled{color:var(--disabled);cursor:default;background:none}
.mlabel{padding:8px 16px 6px;font-weight:500}
.msub{padding:6px 16px 4px;font-size:12px;line-height:16px;color:var(--text2);font-weight:500}
.mdiv{height:1px;background:var(--divider);margin:4px 0}
#tip{position:fixed;background:rgba(97,97,97,.94);color:var(--white);font-size:12px;line-height:16px;padding:4px 8px;border-radius:var(--radius);max-width:320px;z-index:1500;pointer-events:none;display:none;overflow-wrap:anywhere}
.snack{position:fixed;left:24px;bottom:24px;z-index:1400;min-width:288px;max-width:560px;border-radius:var(--radius);box-shadow:var(--shadow-menu);padding:10px 16px;background:#323232;color:var(--white)}
.snack.alertsnack{background:var(--info-bg);color:var(--info-ink);display:flex;gap:10px;align-items:flex-start}
.snack.alertsnack .ic{color:var(--info)}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-dialog);width:calc(100% - 64px);max-width:444px;max-height:calc(100% - 64px);display:flex;flex-direction:column;z-index:1310}
.dialog.sm{max-width:600px}
.dialog.lg{max-width:1200px;height:80vh}
.dlg-title{display:flex;align-items:center;gap:8px;padding:16px 16px 12px 24px}
.dlg-title h2{font-size:16px;line-height:24px;font-weight:500;margin:0;flex:1}
.dlg-content{padding:4px 24px 8px;overflow:auto;flex:1 1 auto}
.dlg-content p{margin:0 0 8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px 16px}
.setdlg{display:flex;flex:1 1 auto;min-height:0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.setdlg nav{width:220px;flex:none;background:var(--app-bg);overflow:auto;padding:8px 0}
.setdlg nav ul{list-style:none;margin:0;padding:0}
.setdlg .setbody{flex:1;overflow:auto;padding:16px 24px}
.setbody h3{font-size:14px;font-weight:500;margin:0 0 8px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}

/* work tracking */
.with-pane{display:flex;gap:16px;align-items:flex-start}
.with-pane>.mainpart{flex:1 1 auto;min-width:0}
.pane{width:var(--pane-w);flex:0 0 var(--pane-w);background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius);position:sticky;top:calc(var(--topbar) + 8px);max-height:calc(100vh - var(--topbar) - 16px);overflow:auto}
.pane-head{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--divider)}
.pane-head h2{font-size:16px;line-height:24px;font-weight:500;margin:0;flex:1}
.pane-body{padding:12px 16px}
@media (max-width:1279px){.pane{position:fixed;right:0;top:var(--topbar);bottom:0;max-height:none;border-radius:0;z-index:1250;box-shadow:var(--shadow-dialog)}}
.wi-band{background:var(--paper);border:1px solid var(--divider);border-left:4px solid var(--stripe);border-radius:var(--radius);padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:flex-start}
.wi-ident{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;margin:0}
.wi-title input{font:inherit;font-size:20px;line-height:28px;border:1px solid transparent;border-radius:var(--radius);width:100%;padding:2px 6px;margin-left:-6px;color:var(--text);background:none}
.wi-title input:hover:not(:disabled){border-color:var(--input-border)}
.wi-title input:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wi-title input:disabled{color:var(--text)}
.wi-strip{display:flex;flex-wrap:wrap;gap:10px 28px;padding:12px 4px;align-items:center}
.wi-field{display:flex;align-items:center;gap:8px}
.wi-field>.lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--text2)}
.wi-field select{height:30px;border:1px solid transparent;border-radius:var(--radius);background:none;font:inherit;color:var(--text);padding:0 4px;max-width:240px}
.wi-field select:hover:not(:disabled){border-color:var(--input-border)}
.wi-field select:disabled{color:var(--text);opacity:1;appearance:none}
.wi-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:12px}
.sec{background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.sec>h2{font-size:16px;line-height:24px;font-weight:500;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--divider)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center}
.kv dt{font-size:12px;color:var(--text2);font-weight:500}
.kv dd{margin:0}
.comment{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--divider)}
.avatar.sm{width:24px;height:24px;font-size:11px}
@media (max-width:1279px){.wi-grid{grid-template-columns:1fr}}
.board{display:flex;gap:8px;overflow-x:auto;align-items:stretch;padding-bottom:8px;min-height:420px}
.col{width:var(--col-w);flex:0 0 var(--col-w);background:var(--hover);border-radius:var(--radius);display:flex;flex-direction:column}
.col-head{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;border-bottom:2px solid var(--divider)}
.col-head h2{font-size:14px;line-height:20px;font-weight:500;margin:0;flex:1}
.col.collapsed{width:var(--col-cw);flex-basis:var(--col-cw);align-items:center;padding-top:4px}
.col.collapsed .vtext{writing-mode:vertical-rl;padding:8px 0;font-weight:500;white-space:nowrap}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-card);border-left:4px solid var(--stripe);padding:8px 8px 8px 10px;margin:8px 8px 0;display:flex;flex-direction:column;gap:6px}
.card-top{display:block;position:relative;padding-right:30px}
.card-top>.ic{vertical-align:-3px;margin-right:4px}
.card-top a{color:var(--text)}
.card-top .id{font-weight:500;white-space:nowrap;margin-right:6px}
.card-top .iconbtn{position:absolute;right:-4px;top:-4px}
.tree-name{display:flex;align-items:center;gap:2px}
.tree-gap{display:inline-block;width:28px;flex:none}
.iter-card{border:1px solid var(--divider);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;background:var(--paper)}
.swatch{display:flex;align-items:center;gap:10px;padding:6px 0}
.swatch .box{width:36px;height:24px;border-radius:var(--radius);border:1px solid var(--divider);flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* auth card, crash */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth{width:var(--auth-w);max-width:100%;background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius);padding:32px}
.auth h1{font-size:20px;line-height:28px;font-weight:500;margin:0 0 16px}
.crash{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.crash h1{font-size:20px;line-height:28px;font-weight:500;margin:0}

/* prototype tooling — not part of the design */
.proto{position:fixed;right:12px;bottom:12px;width:350px;max-height:60vh;overflow:auto;background:#FFFBE6;border:2px dashed #B38600;border-radius:6px;z-index:1450;font-size:13px;line-height:18px;padding:10px 12px;color:#3D3000}
.proto.closed{width:auto;padding:4px 8px}
.proto h2{font-size:14px;margin:0;flex:1}
.proto label{display:block;margin:8px 0 2px;font-weight:500}
.proto select{width:100%;font:inherit;padding:3px}
.proto .links{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.proto .links a,.proto .links button{color:#6B4E00;text-decoration:underline;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.proto .sect{border-top:1px dashed #D9B84A;margin-top:10px;padding-top:6px}
.proto-note{border:1px dashed #B38600;background:#FFFBE6;color:#3D3000;border-radius:var(--radius);padding:8px 12px;margin:8px 0;font-size:13px}
.snack.proto-snack{background:#FFFBE6;color:#3D3000;border:1px dashed #B38600}
</style>
</head>

function ic(name, o){
  o = o || {};
  const s = o.size || 20;

}
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

};

/* the theme lookups take a token name / a category code only (R-25) */
function typeAppearance(token){ const t = TOKENS[token]; return t ? {icon:t.icon, colour:t.colour} : {icon:'help', colour:'var(--text)'}; }
const CATEGORIES = {Proposed:'Новые', InProgress:'В работе', Resolved:'Решённые', Completed:'Завершённые', Removed:'Удалённые'};
function categoryColour(code){ return CATEGORIES[code] ? 'var(--c-' + code + ')' : 'var(--text2)'; }
function typeIcon(token, size){ const a = typeAppearance(token); return ic(a.icon, {size: size || 18, color: a.colour}); }
function stateHtml(state, cat){ return '<span class="state"><span class="dot' + (cat === 'Removed' ? ' ring' : '') + '" style="color:' + categoryColour(cat) + '" aria-hidden="true"></span>' + esc(state) + '</span>'; }
const STATES = {
  epic:[['Новая','Proposed'],['Активна','InProgress'],['Разрешена','InProgress'],['Закрыта','Completed']],
  feature:[['Новая','Proposed'],['Активна','InProgress'],['Разрешена','InProgress'],['Закрыта','Completed']],

  task:[['Новая','Proposed'],['Активна','InProgress'],['Закрыта','Completed']]
};
function catOf(type, state){ if (state === 'Удалена') return 'Removed'; const s = (STATES[type] || []).find((x) => x[0] === state); return s ? s[1] : 'Proposed'; }

function positionMenu(){

  let left = r.left, top = r.bottom + 4;
  const w = m.offsetWidth, h = m.offsetHeight;
  if (left + w > window.innerWidth - 8) left = Math.max(8, r.right - w);

  m.style.left = left + 'px'; m.style.top = top + 'px';

  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') {
    const tabs = Array.from(e.target.parentNode.querySelectorAll('[role=tab]'));
    const i = tabs.indexOf(e.target);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    n.focus();
  }
});
/* tooltips: on hover (after a delay) and on keyboard focus */
let tipTimer = null;
function showTip(el){
  const tip = document.getElementById('tip');
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  const r = el.getBoundingClientRect();
  let left, top;
  if (el.dataset.tipPos === 'right') { left = r.right + 8; top = r.top + r.height / 2 - tip.offsetHeight / 2; }
  else { left = r.left + r.width / 2 - tip.offsetWidth / 2; top = r.bottom + 6; }
  left = Math.max(4, Math.min(left, window.innerWidth - tip.offsetWidth - 4));
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip(){ clearTimeout(tipTimer); const t = document.getElementById('tip'); if (t) t.style.display = 'none'; }
document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (!t) return; clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(t), 500); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', (e) => { const t = e.target.closest('[data-tip]'); if (t && t.matches(':focus-visible')) showTip(t); else hideTip(); });
let lastWidthBand = null;
window.addEventListener('resize', () => {
  const band = window.innerWidth < 1024 ? 'n' : window.innerWidth < 1280 ? 'm' : 'w';
  if (band !== lastWidthBand) { lastWidthBand = band; if (band !== 'n') S.overlay = false; render(); }
  else { fitCommands(); positionMenu(); protoPanel(); }
});
window.addEventListener('hashchange', () => { S.menu = null; S.overlay = false; S.form.key = null; render(); window.scrollTo(0, 0); });
lastWidthBand = window.innerWidth < 1024 ? 'n' : window.innerWidth < 1280 ? 'm' : 'w';
if (!location.hash) history.replaceState(null, '', '#/home');
/* optional start state in the address, e.g. #/home?panel=0&view=build&role=reader&switcher=loading&open=sw-org|sw-org&dialog=destroy:PRM-BUG-7 */
(function startState(){
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  if (q.get('panel') === '0') S.panelOpen = false;
  ['view','role','user','dlgOutcome'].forEach((k) => { if (q.get(k)) S[k] = q.get(k); });
  if (q.get('switcher')) INPUT.proto('switcherData', q.get('switcher'));
  if (q.get('languages')) S.data.languages = q.get('languages');
  if (q.get('lists')) S.data.lists = q.get('lists');
  if (q.get('overlay') === '1') S.overlay = true;
  if (q.get('select')) S.wi.selected = q.get('select');
  render();
  if (q.get('dialog')) ACT.dialog(q.get('dialog'), {dataset:{}});
  if (q.get('newitem')) ACT.newItem(q.get('newitem'), {dataset:{}});
  if (q.get('open')) { const [id, fk] = q.get('open').split('|'); openMenu(id, fk || id); }
})();

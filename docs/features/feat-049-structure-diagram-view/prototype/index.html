<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>feat-049 prototype: «Структура», диаграмма</title>
<style>
/* tokens as in the feat-043 prototype (app/theme/tokens.ts) */
:root{--bg:#F8F8F8;--nav:#EBEBEB;--navh:#E2E2E2;--tx:#242424;--tx2:#616161;--lab:#707070;--acc:#0078D4;--accd:#0C5598;--div:#E0E0E0;--rule:#EAEAEA;--hov:#F0F0F0;--sel:#E5F0FA;--fh:#C8C8C8;--warn:#FFF4CE;--err:#FDE7E9;--glow:0 3px 7px rgba(0,0,0,.13),0 .6px 1.8px rgba(0,0,0,.11)}
*{box-sizing:border-box}html,body{max-width:100%}body{margin:0;font:14px/20px "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
a{color:var(--accd);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{font:inherit}button{background:var(--nav);color:var(--tx);border:0;border-radius:4px;min-height:32px;padding:4px 12px;font-weight:600;cursor:pointer}button:hover{background:var(--navh)}
button.p{background:var(--acc);color:#fff}button.p:hover{background:var(--accd)}
button.sm{min-height:24px;min-width:24px;padding:0 4px;background:transparent;font-weight:400;color:var(--tx2)}button.sm:hover{background:var(--hov)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input{min-height:32px;border:1px solid var(--fh);border-radius:4px;padding:4px 8px;background:#fff;color:var(--tx)}
/* prototype control strip */
#ctl{background:#fff;border-bottom:1px solid var(--div);padding:8px 16px;font-size:12px;line-height:16px;color:var(--tx2)}
#ctl b{color:var(--tx)}#ctl .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
#ctl button{min-height:24px;padding:2px 8px;font-size:12px;font-weight:400;border:1px solid var(--fh);background:#fff}#ctl button.on{background:var(--sel);border-color:var(--acc);font-weight:600}
#bar{height:48px;background:#fff;border-bottom:1px solid var(--div);display:flex;align-items:center;padding:0 16px;font-size:16px;font-weight:600}
#bar span{font-weight:400;color:var(--tx2);font-size:13px;margin-left:12px}
#shell{display:flex}#menu{width:200px;background:var(--nav);padding:8px 0;flex:none;min-height:640px}
#menu div{padding:6px 16px;color:var(--tx2)}#menu .cur{background:#DCDCDC;color:var(--tx);font-weight:600}
#page{flex:1;min-width:0;padding:0 24px 40px}
#page.narrow{max-width:640px}
.head{display:flex;align-items:center;gap:12px;margin:28px 0 12px}.head h1{margin:0;font-size:20px;line-height:28px;font-weight:600;flex:1}
/* the switch: BoxedTabs look (shared/ui/card/BoxedTabs) */
[role=tablist]{display:flex;margin-bottom:12px}
[role=tab]{background:transparent;border:0;border-top:1px solid var(--div);border-left:1px solid var(--div);border-radius:0;min-height:36px;padding:0 16px;font-weight:400;display:inline-flex;align-items:center;gap:6px;position:relative;color:var(--tx)}
[role=tab]:last-child{border-right:1px solid var(--div)}[role=tab][aria-selected=true]{font-weight:600}
[role=tab][aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:var(--acc)}
.toolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.toolbar .legend{margin-left:auto;margin-bottom:12px;font-size:12px;color:var(--tx2);display:flex;gap:16px;align-items:center}
.legend svg{vertical-align:middle;margin-right:4px}
/* notices (InlineNotice) */
.nt{display:flex;align-items:center;gap:12px;padding:6px 16px;border-radius:4px;margin-bottom:8px;font-size:13px}.nt.info{background:#E5F0FA}.nt.warning{background:var(--warn)}.nt.error{background:var(--err)}.nt span{flex:1;max-height:64px;overflow:auto}
.card{background:#fff;border-radius:4px;box-shadow:var(--glow)}
/* the tree view */
table{border-collapse:collapse;width:100%}th{text-align:left;font-weight:600;color:var(--tx2);padding:6px 12px;border-bottom:1px solid var(--div)}td{padding:4px 12px;border-bottom:1px solid var(--rule);height:36px}
.tag{display:inline-block;background:var(--nav);border-radius:10px;padding:0 8px;font-size:12px;line-height:18px;margin-left:8px;white-space:nowrap}
.state{padding:56px 16px;text-align:center}.state h2{margin:8px 0 4px;font-size:16px}.state p{margin:0 0 12px;color:var(--tx2)}
.sk{height:20px;background:var(--hov);border-radius:4px;margin:12px 12px}
/* the diagram */
#frame{position:relative;overflow:auto;max-height:560px;background:#fff;border-radius:4px;box-shadow:var(--glow)}
#frame:focus-visible{outline-offset:-2px}
#cv{position:relative}#cv svg{position:absolute;left:0;top:0;pointer-events:none}
.cap{position:absolute;font-size:12px;font-weight:600;color:var(--lab);line-height:16px}
.nd{position:absolute;height:32px;border:1px solid var(--div);border-radius:4px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;cursor:default;white-space:nowrap;overflow:hidden;transition:opacity .12s}
.nd.ch{cursor:pointer}.nd:hover.ch{background:var(--hov)}
.nd .ty{font-size:11px;color:var(--lab);flex:none}.nd .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}.nd .nm.plain{color:var(--tx);cursor:default}
.nd .key{font-size:12px;color:var(--tx2);flex:none}.nd .cnt{margin-left:auto;font-size:11px;color:var(--lab);flex:none;padding-left:8px}
.nd .tg{flex:none}.nd .tog{flex:none;width:20px;min-height:20px;height:20px;padding:0;text-align:center;line-height:18px}.nd .sp{flex:none;width:20px}
.nd.team{background:#FAFAFA}.nd.dead{background:#F5F5F5;color:var(--tx2)}
.nd.dim{opacity:.5}.nd.emph{background:var(--sel);border-color:var(--acc)}.nd.chosen{border:2px solid var(--acc);background:var(--sel);padding:0 7px}
.nd:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#242424;color:#fff;padding:6px 16px;border-radius:4px;font-size:13px;display:none;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.srv{font-size:11px;color:var(--lab);margin:6px 2px;min-height:16px}
.kb{margin-top:8px;font-size:12px;color:var(--tx2)}.kb kbd{border:1px solid var(--fh);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff}
</style></head><body>
<div id="ctl"><b>feat-049 prototype.</b> Scenarios (not part of the product):
<div class="row" id="scn"></div>
<div class="row"><span>Роль:</span><button data-role="admin" class="on">Администратор</button><button data-role="reader">Читатель</button>
<span style="margin-left:12px">Окно:</span><button data-w="full" class="on">Широкое</button><button data-w="narrow">640 px</button>
<span style="margin-left:12px">Повторить в «Предложения не загрузились» удаётся со второго раза.</span></div></div>
<div id="bar">MUSTASK<span id="orgn">Организация «Демо»</span></div>
<div id="shell"><div id="menu"><div>Обзор</div><div class="cur">Структура</div><div>Проекты</div><div>Команды</div><div>Участники</div></div>
<div id="page"></div></div>
<div id="toast" role="status"></div>
<div class="sr" role="status" id="live"></div>
<script>
(function(){
'use strict';
/* ---------- design constants (§ 4.3 of design.md) ---------- */
var LINE_LIMIT=150, EXPAND_ALL_LIMIT=100, ROW=40, IND=22, HIER_W=480, GAP=200, TEAM_W=220, PAD=16, HEAD=28;
var TYPE={department:'Департамент',project:'Проект',area:'Область'};
/* ---------- data ---------- */
function node(id,parent,type,name,o){o=o||{};return {id:id,parentId:parent,type:type,name:name,projectId:o.pid||null,active:o.active===false?false:true,key:o.key||null}}
function normal(){
 var areas=[
  node('d1',null,'department','Логистика'),
  node('pA','d1','project','Складской портал',{pid:'A',key:'WH'}),
  node('a1','pA','area','Склад',{pid:'A'}),node('a2','a1','area','Приёмка',{pid:'A'}),node('a3','a1','area','Отгрузка',{pid:'A'}),
  node('pE','d1','project','Транспорт',{pid:'E',key:'TR'}),
  node('d2',null,'department','Финансы'),
  node('pB','d2','project','Биллинг',{pid:'B',key:'BIL'}),
  node('pC','d2','project','Архив 2023',{pid:'C',active:false}),
  node('a4','pC','area','Сверка',{pid:'C',active:false}),
  node('pF',null,'project','Мобильное приложение',{pid:'F',key:'MOB'}),
  node('a5','pF','area','Платежи',{pid:'F'})
 ];
 var offers={projects:{A:{teams:['MARS','VENUS']},E:{teams:['JUPITER']},B:{teams:['MARS','SATURN']},F:{teams:['JUPITER']}},
  teams:[{id:'ATLAS',name:'ATLAS',depts:[]},{id:'JUPITER',name:'JUPITER',depts:['d1']},{id:'MARS',name:'MARS',depts:[]},{id:'SATURN',name:'SATURN',depts:['d2']},{id:'VENUS',name:'VENUS',depts:[]}]};
 return {areas:areas,offers:offers};
}
function large(){
 var areas=[],teams=[],offers={projects:{},teams:teams},t,i,j,k,d,p,c,tn=0;
 for(i=1;i<=24;i++){teams.push({id:'T'+i,name:'Команда '+(i<10?'0':'')+i,depts:i%4===0?['d'+(i%6+1)]:[]});}
 for(d=1;d<=6;d++){areas.push(node('d'+d,null,'department','Департамент '+d));
  for(p=1;p<=6;p++){var pid='p'+d+'_'+p;areas.push(node(pid,'d'+d,'project','Проект '+d+'.'+p,{pid:pid,key:'P'+d+p}));
   var ts=[];for(k=0;k<5;k++){ts.push('T'+(((d*5+p*3+k*4)%24)+1));}offers.projects[pid]={teams:ts.filter(function(x,ix){return ts.indexOf(x)===ix;})};
   for(j=1;j<=3;j++){areas.push(node(pid+'a'+j,pid,'area','Область '+j,{pid:pid}));if(j===1){areas.push(node(pid+'b',pid+'a'+j,'area','Подобласть',{pid:pid}));}}}}
 for(i=1;i<=3;i++){areas.push(node('top'+i,null,'project','Проект верхнего уровня '+i,{pid:'top'+i,key:'TOP'+i}));offers.projects['top'+i]={teams:['T'+i,'T'+(i+4)]};}
 teams.push({id:'T25',name:'Команда 25',depts:[]},{id:'T26',name:'Команда 26',depts:[]});
 return {areas:areas,offers:offers};
}
var SCN=[
 {id:'normal',label:'Обычная организация',make:normal},
 {id:'large',label:'Большая организация (линии только для выбранного)',make:large},
 {id:'offersFailed',label:'Предложения не загрузились',make:normal,offers:'failed'},
 {id:'offersLoading',label:'Предложения загружаются',make:normal,offers:'loading'},
 {id:'loading',label:'Загрузка',make:normal,tree:'loading'},
 {id:'treeFailed',label:'Ошибка дерева',make:normal,tree:'failed'},
 {id:'empty',label:'Пустая организация',make:function(){return {areas:[],offers:{projects:{},teams:[]}}}},
 {id:'notFound',label:'Организация не найдена',make:normal,tree:'404'}
];
/* ---------- state ---------- */
var S={scn:SCN[0],data:null,view:'diagram',role:'admin',expanded:null,chosen:null,focusId:null,retried:false,offersState:'ok'};
function $(sel,root){return (root||document).querySelector(sel)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ru(n,one,few,many){var m=n%10,h=n%100;return n+' '+(m===1&&h!==11?one:(m>=2&&m<=4&&(h<12||h>14)?few:many))}
/* ---------- model: pure functions (lib/diagramModel.ts in the product) ---------- */
function childrenOf(areas){var m={};areas.forEach(function(a){(m[a.parentId||'']=m[a.parentId||'']||[]).push(a)});return m}
function initialExpansion(areas){var s={};if(areas.length>EXPAND_ALL_LIMIT)return s;var ch=childrenOf(areas);areas.forEach(function(a){if(ch[a.id])s[a.id]=1});return s}
function model(){
 var areas=S.data.areas,off=S.offersState==='ok'?S.data.offers:null,byId={},ch=childrenOf(areas);
 areas.forEach(function(a){byId[a.id]=a});
 var projNode={};areas.forEach(function(a){if(a.type==='project')projNode[a.projectId]=a});
 var teams=[],links=[],teamsOf={},projsOf={},deptsOf={},deptTeams={};
 if(off){
  off.teams.forEach(function(t){teams.push(t)});
  Object.keys(off.projects).forEach(function(pid){var n=projNode[pid];if(!n||!n.active)return;
   off.projects[pid].teams.forEach(function(tid){links.push({a:n.id,t:tid});(teamsOf[n.id]=teamsOf[n.id]||[]).push(tid);(projsOf[tid]=projsOf[tid]||[]).push(n.id)})});
  off.teams.forEach(function(t){t.depts.forEach(function(did){if(!byId[did])return;links.push({a:did,t:t.id});(teamsOf[did]=teamsOf[did]||[]).push(t.id);(deptsOf[t.id]=deptsOf[t.id]||[]).push(did)})});
 }
 var teamById={};teams.forEach(function(t){teamById[t.id]=t});
 return {areas:areas,byId:byId,ch:ch,off:off,teams:teams,teamById:teamById,links:links,teamsOf:teamsOf,projsOf:projsOf,deptsOf:deptsOf,projNode:projNode};
}
function chosable(M,id){var n=M.byId[id];if(n)return n.type==='department'||(n.type==='project'&&n.active);return !!M.teamById[id]}
function emphasis(M,id){ /* what choosing id emphasises (US-3 table) */
 var s={},ln={};if(!id)return null;s[id]=1;
 M.links.forEach(function(l){if(l.a===id||l.t===id){s[l.a]=1;s[l.t]=1;ln[l.a+'>'+l.t]=1}});
 return {ids:s,lines:ln};
}
function summary(M,id){
 var n=M.byId[id],names=function(a){return a.length?a.map(function(x){return (M.teamById[x]||M.byId[x]).name}).join(', '):'нет'};
 if(n&&n.type==='department')return 'Команды департамента: '+names(M.teamsOf[id]||[]);
 if(n)return 'Команды проекта: '+names(M.teamsOf[id]||[]);
 return 'Проекты команды: '+names(M.projsOf[id]||[])+'. Департаменты команды: '+names(M.deptsOf[id]||[]);
}
function ancestors(M,id){var r=[],c=M.byId[id];while(c&&c.parentId){r.push(c.parentId);c=M.byId[c.parentId]}return r}
function visibleAnchor(M,id,exp){ /* nearest visible ancestor, and whether it stands for hidden nodes */
 var cur=id,hidden=false,anc=ancestors(M,id).reverse(); /* from the top */
 for(var i=0;i<anc.length;i++){if(!exp[anc[i]]){return {id:anc[i],hidden:true}}}
 return {id:id,hidden:false};
}
/* ---------- layout: rebuilt only when data or expansion changes, never on choosing ---------- */
function layout(M,exp){
 var items=[],pos={},y=PAD+HEAD,hierBottom;
 function walk(parent,depth){(M.ch[parent||'']||[]).forEach(function(a){
  var it={id:a.id,kind:'node',a:a,level:depth,x:PAD+(depth-1)*IND,y:y,w:HIER_W-(depth-1)*IND};items.push(it);pos[a.id]=it;y+=ROW;
  if(M.ch[a.id]&&exp[a.id])walk(a.id,depth+1)})}
 walk(null,1);hierBottom=y;
 var TX=PAD+HIER_W+GAP,related=[],lone=[];
 M.teams.forEach(function(t){
  var anchors=[];(M.projsOf[t.id]||[]).concat(M.deptsOf[t.id]||[]).forEach(function(id){var v=visibleAnchor(M,id,exp);anchors.push({id:v.id,hidden:v.hidden,src:id})});
  if(!anchors.length)lone.push(t);else{var mean=anchors.reduce(function(s,a){return s+pos[a.id].y+16},0)/anchors.length;related.push({t:t,anchors:anchors,mean:mean})}});
 related.sort(function(p,q){return p.mean-q.mean||p.t.name.localeCompare(q.t.name,'ru')});
 var ty=PAD+HEAD,teamItems=[];
 related.forEach(function(r){var yy=Math.max(r.mean-16,ty);var it={id:r.t.id,kind:'team',t:r.t,level:1,x:TX,y:yy,w:TEAM_W,anchors:r.anchors};teamItems.push(it);pos[r.t.id]=it;ty=yy+ROW});
 var bottom=Math.max(hierBottom,ty),groupTop=bottom+20,loneItems=[];
 var width=TX+TEAM_W+PAD,perRow=Math.max(1,Math.floor((width-2*PAD)/(TEAM_W+12)));
 lone.forEach(function(t,i){var it={id:t.id,kind:'team',t:t,level:1,lone:true,x:PAD+(i%perRow)*(TEAM_W+12),y:groupTop+HEAD+Math.floor(i/perRow)*ROW,w:TEAM_W,anchors:[]};loneItems.push(it);pos[t.id]=it});
 var height=(lone.length?groupTop+HEAD+Math.ceil(lone.length/perRow)*ROW:bottom)+PAD;
 return {hier:items,teams:teamItems,lone:loneItems,all:items.concat(teamItems,loneItems),pos:pos,TX:TX,width:width,height:height,groupTop:groupTop,hasLone:lone.length>0,hasTeams:teamItems.length>0};
}
/* ---------- rendering ---------- */
function setLive(t){$('#live').textContent='';setTimeout(function(){$('#live').textContent=t},30)}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},2200)}
function render(){
 var sc=S.scn,h='',admin=S.role==='admin';
 var create=admin?'<button class="p" id="mk">＋ Создать департамент</button>':'';
 h+='<div class="head"><h1>Структура</h1>'+create+'</div>';
 h+='<div class="toolbar"><div role="tablist" aria-label="Вид структуры"><button role="tab" id="tb-tree" aria-selected="'+(S.view==='tree')+'" tabindex="'+(S.view==='tree'?0:-1)+'" data-v="tree">⌸ Дерево</button><button role="tab" id="tb-diagram" aria-selected="'+(S.view==='diagram')+'" tabindex="'+(S.view==='diagram'?0:-1)+'" data-v="diagram">⌖ Диаграмма</button></div>';
 if(S.view==='diagram'&&sc.tree!=='loading'&&sc.tree!=='failed'&&sc.tree!=='404'&&S.data.areas.length)h+='<div class="legend"><span><svg width="28" height="10"><path d="M1 5H27" stroke="#9E9E9E" stroke-width="1" fill="none"/></svg>вложенность</span><span><svg width="28" height="10"><path d="M1 5H27" stroke="#0078D4" stroke-width="2" stroke-dasharray="6 3" fill="none"/></svg>команда работает</span><span><svg width="28" height="10"><path d="M1 5H27" stroke="#0078D4" stroke-width="2" stroke-dasharray="2 3" fill="none"/></svg>связь со скрытым узлом</span></div>';
 h+='</div><div id="body"></div>';
 $('#page').innerHTML=h;
 $('#page').className=S.narrow?'narrow':'';
 body();
}
function body(){
 var sc=S.scn,b=$('#body'),areas=S.data.areas;
 if(sc.tree==='404'){b.innerHTML='<div class="state"><h2>Организация не найдена</h2><p>Возможно, она удалена или у вас нет к ней доступа.</p></div>';return}
 if(sc.tree==='loading'){b.innerHTML='<div class="card" role="status" aria-label="Загрузка данных"><div class="sk" style="width:60%"></div><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>';return}
 if(sc.tree==='failed'){b.innerHTML='<div class="nt error" role="alert"><span>Не удалось загрузить структуру. Проверьте соединение и повторите.</span><button id="retry">Повторить</button></div>';$('#retry').onclick=function(){SCN.forEach(function(s){if(s.id==='normal')pick(s)})};return}
 if(!areas.length){b.innerHTML='<div class="state card"><div style="font-size:32px">▭</div><h2>В организации пока нет областей</h2><p>'+(S.role==='admin'?'Создайте первый департамент: он объединяет проекты и команды.':'Департаменты создаёт администратор организации.')+'</p>'+(S.role==='admin'?'<button class="p">＋ Создать департамент</button>':'')+'</div>';return}
 if(S.view==='tree'){treeView(b);return}
 diagramView(b);
}
function treeView(b){
 var M=model(),exp=S.expanded||initialExpansion(areas()),rows='';
 function areas(){return S.data.areas}
 function walk(p,d){(M.ch[p||'']||[]).forEach(function(a){
  rows+='<tr><td style="padding-left:'+(12+(d-1)*20)+'px">'+(M.ch[a.id]?'▾ ':'<span style="display:inline-block;width:12px"></span> ')+(a.active?'<a href="#" data-o="'+esc(a.name)+'">'+esc(a.name)+'</a>':esc(a.name)+'<span class="tag">деактивирован</span>')+'</td><td>'+TYPE[a.type]+'</td><td style="color:var(--tx2)"></td></tr>';
  if(M.ch[a.id])walk(a.id,d+1)})}
 walk(null,1);
 b.innerHTML='<div style="margin-bottom:8px"><input placeholder="Найти область" aria-label="Найти область"> <button>Развернуть всё</button></div><div class="card"><table role="treegrid" aria-label="Структура"><tr><th>Название</th><th>Тип</th><th>Описание</th></tr>'+rows+'</table></div><div class="srv">Вид «Дерево»: фильтр и «Развернуть всё» есть только здесь.</div>';
 b.querySelectorAll('a[data-o]').forEach(function(a){a.onclick=function(e){e.preventDefault();toast('Открывается страница: '+a.getAttribute('data-o'))}});
}
var DG={};
function diagramView(b){
 var M=model(),exp=S.expanded||(S.expanded=initialExpansion(S.data.areas));
 var L=layout(M,exp);DG={M:M,L:L,exp:exp};
 var many=M.links.length>LINE_LIMIT,sc=S.scn,pre='';
 if(sc.offers==='failed'&&S.offersState!=='ok')pre='<div class="nt warning" role="status"><span>Команды и ключи проектов не загружены</span><button id="oretry">Повторить</button></div>';
 if(sc.offers==='loading'&&S.offersState!=='ok')pre='<div class="nt warning" role="status"><span>Команды и ключи проектов не загружены</span></div>';
 pre+='<div id="sumbar"></div>';
 b.innerHTML=pre+'<div id="frame" tabindex="-1"><div id="cv" role="tree" aria-label="Диаграмма структуры" style="width:'+L.width+'px;height:'+L.height+'px"></div></div><div class="kb"><kbd>Tab</kbd> входит в диаграмму один раз · <kbd>↑</kbd><kbd>↓</kbd> узлы · <kbd>←</kbd><kbd>→</kbd> свернуть и развернуть · <kbd>Пробел</kbd> выбрать · <kbd>Enter</kbd> открыть · <kbd>Esc</kbd> сбросить</div>';
 var o=$('#oretry');if(o)o.onclick=function(){if(!S.retried){S.retried=true;toast('Не удалось загрузить предложения');}else{S.offersState='ok';S.retried=false;body()}};
 DG.many=many;drawCanvas();paint();
}
function nameOf(M,it){
 if(it.kind==='team'){var n1=(M.projsOf[it.id]||[]).length,n2=(M.deptsOf[it.id]||[]).length;return 'Команда '+it.t.name+', проектов: '+n1+', департаментов: '+n2+(it.lone?', без проектов и департаментов':'')}
 var a=it.a,p=a.parentId?M.byId[a.parentId]:null;
 if(a.type==='department')return 'Департамент '+a.name+', команд: '+(M.teamsOf[a.id]||[]).length;
 if(a.type==='project')return 'Проект '+a.name+(a.key?' ('+a.key+')':'')+(a.active?'':', деактивирован')+', '+(p?'в департаменте '+p.name:'на верхнем уровне')+(a.active&&M.off?', команд: '+(M.teamsOf[a.id]||[]).length:'');
 return 'Область '+a.name+', в «'+p.name+'»'+(a.active?'':', деактивирована');
}
function drawCanvas(){
 var cv=$('#cv'),M=DG.M,L=DG.L,exp=DG.exp,h='';
 /* captions (decorative; the tree has no heading items) */
 h+='<div class="cap" aria-hidden="true" style="left:'+PAD+'px;top:'+PAD+'px">Департаменты, проекты и области</div>';
 if(L.hasTeams||M.off)h+='<div class="cap" aria-hidden="true" style="left:'+L.TX+'px;top:'+PAD+'px">Команды</div>';
 if(L.hasLone)h+='<div class="cap" aria-hidden="true" style="left:'+PAD+'px;top:'+(L.groupTop)+'px">Без проектов и департаментов</div>';
 var first=true,cur=S.focusId&&L.pos[S.focusId]?S.focusId:L.all[0].id;S.focusId=cur;
 L.all.forEach(function(it){
  var ch=chosable(M,it.id),isNode=it.kind==='node',a=it.a,cls='nd'+(ch?' ch':'')+(it.kind==='team'?' team':'')+(isNode&&!a.active?' dead':'');
  var attrs='role="treeitem" id="n-'+esc(it.id)+'" data-id="'+esc(it.id)+'" tabindex="'+(it.id===cur?0:-1)+'" aria-level="'+it.level+'" aria-label="'+esc(nameOf(M,it))+'"'+(ch?' aria-selected="false"':'');
  var inner='';
  if(isNode){var hasCh=!!M.ch[a.id];
   if(hasCh)attrs+=' aria-expanded="'+(!!exp[a.id])+'"';
   inner+=hasCh?'<button class="sm tog" tabindex="-1" aria-hidden="true" data-t="'+esc(a.id)+'">'+(exp[a.id]?'▾':'▸')+'</button>':'<span class="sp"></span>';
   inner+='<span class="ty">'+TYPE[a.type]+'</span>'+(a.active?'<a class="nm" href="#" tabindex="-1" data-o="'+esc(a.name)+'">'+esc(a.name)+'</a>':'<span class="nm plain">'+esc(a.name)+'</span>');
   if(a.type==='project'&&a.active&&M.off&&a.key)inner+='<span class="key">'+esc(a.key)+'</span>';
   if(!a.active)inner+='<span class="tag tg">деактивирован</span>';
   var rc=(a.type==='project'&&a.active&&M.off)?ru((M.teamsOf[a.id]||[]).length,'команда','команды','команд'):(a.type==='department'&&M.off?ru((M.teamsOf[a.id]||[]).length,'команда','команды','команд'):'');
   if(rc)inner+='<span class="cnt">'+rc+'</span>';
  }else{
   inner+='<span class="ty">Команда</span><a class="nm" href="#" tabindex="-1" data-o="'+esc(it.t.name)+'">'+esc(it.t.name)+'</a><span class="cnt">'+ru((M.projsOf[it.id]||[]).length,'проект','проекта','проектов')+'</span>';
  }
  h+='<div class="'+cls+'" '+attrs+' style="left:'+it.x+'px;top:'+it.y+'px;width:'+it.w+'px">'+inner+'</div>';
 });
 cv.innerHTML='<svg id="ln" width="'+L.width+'" height="'+L.height+'" aria-hidden="true"></svg>'+h;
 drawLines();
}
function drawLines(){
 var M=DG.M,L=DG.L,exp=DG.exp,svg=$('#ln'),p='',PORT=PAD+HIER_W,i;
 /* nesting: solid thin elbows */
 L.hier.forEach(function(it){var par=it.a.parentId;if(!par||!L.pos[par])return;var pp=L.pos[par],x=pp.x+10,y1=pp.y+32,y2=it.y+16;
  p+='<path d="M'+x+' '+y1+'V'+y2+'H'+(it.x)+'" stroke="#9E9E9E" stroke-width="1" fill="none"/>'});
 /* relations */
 var seen={},rel='';
 L.teams.forEach(function(tm){tm.anchors.forEach(function(an){var k=an.id+'>'+tm.id;if(seen[k])return;seen[k]=1;
  var a=L.pos[an.id],ya=a.y+16,yt=tm.y+16,mx=(PORT+tm.x)/2,orig=an.src;
  rel+='<path class="rl" data-k="'+esc(orig+'>'+tm.id)+'" data-a="'+esc(an.id)+'" data-t="'+esc(tm.id)+'" d="M'+PORT+' '+ya+'C'+mx+' '+ya+' '+mx+' '+yt+' '+tm.x+' '+yt+'" stroke="#0078D4" stroke-width="1.5" fill="none" stroke-dasharray="'+(an.hidden?'2 3':'6 3')+'"/>';
  rel+='<circle class="rd" data-a="'+esc(an.id)+'" data-t="'+esc(tm.id)+'" cx="'+PORT+'" cy="'+ya+'" r="3" fill="#0078D4"/>'})});
 svg.innerHTML=p+'<g id="rels">'+rel+'</g>';
}
/* emphasis: classes and line visibility only, no layout */
function paint(){
 var M=DG.M,L=DG.L,E=emphasis(M,S.chosen),bar=$('#sumbar');
 L.all.forEach(function(it){var e=$('#n-'+cssId(it.id));if(!e)return;
  e.classList.remove('dim','emph','chosen');
  if(E){if(it.id===S.chosen)e.classList.add('chosen');else if(E.ids[it.id])e.classList.add('emph');else if(it.kind==='team'||it.a.type!=='area'||true)e.classList.add('dim')}
  if(chosable(M,it.id))e.setAttribute('aria-selected',String(it.id===S.chosen))});
 /* a project's sub-areas keep as they are: not dimmed */
 if(E)L.hier.forEach(function(it){if(it.a.type==='area'){var e=$('#n-'+cssId(it.id));e.classList.remove('dim')}});
 var show=DG.many?!!E:true;
 document.querySelectorAll('#rels path,#rels circle').forEach(function(el){
  var a=el.getAttribute('data-a'),t=el.getAttribute('data-t'),k=el.getAttribute('data-k');
  var on=true;if(DG.many&&!E)on=false;
  var isE=false;if(E){var anc=L.pos[t]&&L.pos[t].anchors.filter(function(x){return x.id===a})[0];var src=anc?anc.src:a;isE=!!E.lines[src+'>'+t]}
  if(DG.many&&E&&!isE)on=false;
  el.style.display=on?'':'none';
  if(el.tagName==='path'){el.setAttribute('stroke-width',isE?3:1.5);el.style.opacity=(E&&!isE)?.15:1}else el.style.opacity=(E&&!isE)?.15:1});
 var msg='';
 if(E){msg=summary(M,S.chosen);bar.innerHTML='<div class="nt info" role="status"><span>'+esc(msg)+'</span><button id="clr">Сбросить</button></div>';$('#clr').onclick=function(){choose(null)}}
 else if(DG.many&&M.off){bar.innerHTML='<div class="nt info" role="status"><span>Линии связей показаны для выбранного узла</span></div>'}
 else bar.innerHTML='';
}
function cssId(id){return String(id).replace(/[^\w-]/g,'_')}
function choose(id){
 var M=DG.M;
 if(id&&S.chosen===id)id=null;
 S.chosen=id;
 if(id){ /* reveal what is emphasised: expand branches that hide it */
  var E=emphasis(M,id),changed=false;
  Object.keys(E.ids).forEach(function(k){ancestors(M,k).forEach(function(a){if(!DG.exp[a]){DG.exp[a]=1;changed=true}})});
  if(changed){S.expanded=DG.exp;var keep=id;body();S.chosen=keep;paint();focusItem(keep,true);setLive(summary(M,id));return}
 }
 paint();setLive(id?summary(M,id):'Выбор сброшен');
}
function focusItem(id,noScroll){
 var e=$('#n-'+cssId(id));if(!e)return;
 document.querySelectorAll('#cv [role=treeitem][tabindex="0"]').forEach(function(x){x.tabIndex=-1});
 e.tabIndex=0;S.focusId=id;e.focus({preventScroll:!!noScroll});if(!noScroll)e.scrollIntoView({block:'nearest',inline:'nearest'});
}
function toggle(id,open){
 var M=DG.M;if(!M.ch[id])return;
 var was=!!DG.exp[id];if(open===undefined)open=!was;if(open===was)return;
 if(open)DG.exp[id]=1;else{delete DG.exp[id];if(S.chosen){var E=emphasis(M,S.chosen);}}
 S.expanded=DG.exp;var keep=S.chosen,f=S.focusId;body();S.chosen=keep;paint();focusItem(f,true);
}
/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var t=ev.target;
 var tab=t.closest&&t.closest('[role=tab]');
 if(tab){setView(tab.getAttribute('data-v'));return}
 if(!$('#cv')||!$('#cv').contains(t))return;
 var tog=t.closest('.tog');if(tog){toggle(tog.getAttribute('data-t'));return}
 var nm=t.closest('a[data-o]');if(nm){ev.preventDefault();toast('Открывается страница: '+nm.getAttribute('data-o'));return}
 var nd=t.closest('.nd');if(nd&&chosable(DG.M,nd.getAttribute('data-id'))){S.focusId=nd.getAttribute('data-id');choose(nd.getAttribute('data-id'));focusItem(nd.getAttribute('data-id'),true)}
});
document.addEventListener('keydown',function(ev){
 var tab=ev.target.closest&&ev.target.closest('[role=tab]');
 if(tab){var o=tab.getAttribute('data-v')==='tree'?'diagram':'tree';
  if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();$('#tb-'+o).focus()}
  if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setView(tab.getAttribute('data-v'));$('#tb-'+tab.getAttribute('data-v')).focus()}
  return}
 var nd=ev.target.closest&&ev.target.closest('.nd');if(!nd||!$('#cv'))return;
 var id=nd.getAttribute('data-id'),all=DG.L.all,i=all.map(function(x){return x.id}).indexOf(id),it=all[i],k=ev.key,M=DG.M;
 function go(j){j=Math.max(0,Math.min(all.length-1,j));focusItem(all[j].id)}
 if(k==='ArrowDown'){ev.preventDefault();go(i+1)}
 else if(k==='ArrowUp'){ev.preventDefault();go(i-1)}
 else if(k==='Home'){ev.preventDefault();go(0)}
 else if(k==='End'){ev.preventDefault();go(all.length-1)}
 else if(k==='ArrowRight'&&it.kind==='node'){ev.preventDefault();if(M.ch[id]&&!DG.exp[id])toggle(id,true);else if(M.ch[id])go(i+1)}
 else if(k==='ArrowLeft'&&it.kind==='node'){ev.preventDefault();if(M.ch[id]&&DG.exp[id])toggle(id,false);else if(it.a.parentId)focusItem(it.a.parentId)}
 else if(k===' '){ev.preventDefault();if(chosable(M,id))choose(id);else setLive('Этот узел выбрать нельзя')}
 else if(k==='Enter'){ev.preventDefault();var open=it.kind==='team'||it.a.active;if(open)toast('Открывается страница: '+(it.kind==='team'?it.t.name:it.a.name));else setLive('Узел деактивированного проекта ничего не открывает')}
 else if(k==='Escape'&&S.chosen){ev.preventDefault();choose(null)}
});
function setView(v){S.view=v;S.chosen=null;render()}
/* ---------- scenario controls ---------- */
function pick(sc){
 S.scn=sc;S.data=sc.make();S.expanded=null;S.chosen=null;S.focusId=null;S.retried=false;S.offersState=sc.offers?'failed':'ok';
 document.querySelectorAll('#scn button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===sc.id)});
 render();
}
SCN.forEach(function(sc){var b=document.createElement('button');b.textContent=sc.label;b.setAttribute('data-s',sc.id);b.onclick=function(){pick(sc)};$('#scn').appendChild(b)});
document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){S.role=b.getAttribute('data-role');document.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
document.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){S.narrow=b.getAttribute('data-w')==='narrow';document.querySelectorAll('[data-w]').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
pick(SCN[0]);
})();
</script></body></html>

<script>
(function(){

  teams:[{id:'ATLAS',name:'ATLAS',depts:[]},{id:'JUPITER',name:'JUPITER',depts:['d1']},{id:'MARS',name:'MARS',depts:[]},{id:'SATURN',name:'SATURN',depts:['d2']},{id:'VENUS',name:'VENUS',depts:[]}]};
 return {areas:areas,offers:offers};
}
function large(){
 var areas=[],teams=[],offers={projects:{},teams:teams},t,i,j,k,d,p,c,tn=0;
 for(i=1;i<=24;i++){teams.push({id:'T'+i,name:'Команда '+(i<10?'0':'')+i,depts:i%4===0?['d'+(i%6+1)]:[]});}

   for(j=1;j<=3;j++){areas.push(node(pid+'a'+j,pid,'area','Область '+j,{pid:pid}));if(j===1){areas.push(node(pid+'b',pid+'a'+j,'area','Подобласть',{pid:pid}));}}}}
 for(i=1;i<=3;i++){areas.push(node('top'+i,null,'project','Проект верхнего уровня '+i,{pid:'top'+i,key:'TOP'+i}));offers.projects['top'+i]={teams:['T'+i,'T'+(i+4)]};}

 return {areas:areas,offers:offers};
}
var SCN=[
 {id:'normal',label:'Обычная организация',make:normal},
 {id:'large',label:'Большая организация (линии только для выбранного)',make:large},

];
/* ---------- state ---------- */

function $(sel,root){return (root||document).querySelector(sel)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- model: pure functions (lib/diagramModel.ts in the product) ---------- */
function childrenOf(areas){var m={};areas.forEach(function(a){(m[a.parentId||'']=m[a.parentId||'']||[]).push(a)});return m}
function initialExpansion(areas){var s={};if(areas.length>EXPAND_ALL_LIMIT)return s;var ch=childrenOf(areas);areas.forEach(function(a){if(ch[a.id])s[a.id]=1});return s}
function model(){
 var areas=S.data.areas,off=S.offersState==='ok'?S.data.offers:null,byId={},ch=childrenOf(areas);
 areas.forEach(function(a){byId[a.id]=a});
 var maxLevel=areas.reduce(function(m,a){var d=1,c=a;while(c.parentId){c=byId[c.parentId];d++}return Math.max(m,d)},1);

 }

 return {areas:areas,byId:byId,ch:ch,off:off,teams:teams,teamById:teamById,links:links,teamsOf:teamsOf,projsOf:projsOf,deptsOf:deptsOf,projNode:projNode,maxLevel:maxLevel};
}
function chosable(M,id){var n=M.byId[id];if(n)return n.type==='department'||(n.type==='project'&&n.active);return !!M.teamById[id]}
function emphasis(M,id){
 var s={},ln={};if(!id)return null;s[id]=1;

}
function summary(M,id){

 if(n)return 'Команды проекта: '+names(M.teamsOf[id]||[]);

function ancestors(M,id){var r=[],c=M.byId[id];while(c&&c.parentId){r.push(c.parentId);c=M.byId[c.parentId]}return r}
function descendants(M,id,out){(M.ch[id]||[]).forEach(function(c){out[c.id]=1;descendants(M,c.id,out)})}

  if(M.teamById[id]){teams[id]=1;return}

/* ---------- layout: a pure function of (model, expansion, options); two orientations ---------- */
function levelOk(lv,l){var ks=Object.keys(lv.set).map(Number);if(!ks.length)return true;return lv.mode==='only'?!!lv.set[l]:l>=Math.min.apply(null,ks)}
function layout(M,exp0,o){
 var filt=o.filt,V=o.orient==='v',lv=o.lv,sec=o.sec,exp=exp0,pos={},i;
 if(filt){exp={};Object.keys(exp0).forEach(function(k){exp[k]=1});Object.keys(filt.keep).forEach(function(id){ancestors(M,id).forEach(function(a){exp[a]=1})})}

 var vis=sec.h?seq.filter(function(s){return levelOk(lv,s.level)}):[],visSet={};

  if(sec.g){var perRow=Math.max(1,Math.floor((width-2*PAD)/(TEAM_W+12)));

  rel+='<path class="rl" data-a="'+esc(an.id)+'" data-t="'+esc(tm.id)+'" d="'+d+'" stroke="#0078D4" stroke-width="1.5" fill="none" stroke-dasharray="'+(an.hidden?'2 3':'6 3')+'"/>';
  rel+='<circle class="rd" data-a="'+esc(an.id)+'" data-t="'+esc(tm.id)+'" cx="'+cx+'" cy="'+cy+'" r="3" fill="#0078D4"/>'})});
 svg.innerHTML=p+'<g id="rels">'+rel+'</g>';
}
function paint(){
 var M=DG.M,L=DG.L,E=emphasis(M,S.chosen),bar=$('#sumbar'),mode=S.mode;
 L.all.forEach(function(it){if(it.kind==='section')return;var e=$('#n-'+cssId(it.id));if(!e)return;
  e.classList.remove('dim','emph','chosen','hl');
  if(E){if(it.id===S.chosen)e.classList.add('chosen');
   else if(E.ids[it.id])e.classList.add(mode==='hl'?'hl':'emph');
   else if(mode==='dim'&&!(it.kind==='node'&&it.a.type==='area'))e.classList.add('dim')}
  if(chosable(M,it.id))e.setAttribute('aria-selected',String(it.id===S.chosen))});
 document.querySelectorAll('#rels path,#rels circle').forEach(function(el){
  var a=el.getAttribute('data-a'),t=el.getAttribute('data-t'),isE=false,on=true;
  if(E){var anc=L.pos[t]&&L.pos[t].anchors.filter(function(x){return x.id===a})[0];isE=!!E.lines[(anc?anc.src:a)+'>'+t]}
  if(DG.many&&(!E||!isE))on=false;
  el.style.display=on?'':'none';
  var col=(E&&!isE&&mode==='hl')?'#B0B0B0':'#0078D4',fade=(E&&!isE&&mode==='dim')?.15:1;
  if(el.tagName==='path'){el.setAttribute('stroke',col);el.setAttribute('stroke-width',isE?3:1.5)}else el.setAttribute('fill',col);
  el.style.opacity=fade});
 if(E){bar.innerHTML='<div class="nt info" role="status"><span>'+esc(summary(M,S.chosen))+(mode==='only'?'<br><small>Показаны только выбранный узел и связанные с ним.</small>':'')+'</span><button id="clr">Сбросить</button></div>';$('#clr').onclick=function(){choose(null)}}
 else if(DG.many&&M.off){bar.innerHTML='<div class="nt info" role="status"><span>Линии связей показаны для выбранного узла</span></div>'}
 else bar.innerHTML='';
}
function cssId(id){return String(id).replace(/[^\w-]/g,'_')}
function rebuild(focus,sel){body();if(sel){var e=$(sel);if(e)e.focus()}else if(focus)focusItem(focus,true)}
function choose(id){
 var M=DG.M;
 if(id&&S.chosen===id)id=null;
 S.chosen=id;
 var f=S.focusId,changed=false;
 if(id&&S.mode!=='only'){var E=emphasis(M,id);Object.keys(E.ids).forEach(function(k){ancestors(M,k).forEach(function(a){if(!DG.exp[a]){DG.exp[a]=1;changed=true}})});if(changed)S.expanded=DG.exp}
 if(id){var E2=emphasis(M,id),needH=Object.keys(E2.ids).some(function(k){return !!M.byId[k]||(!!M.teamById[k]&&((M.projsOf[k]||[]).length+(M.deptsOf[k]||[]).length>0))});if(needH&&!S.sec.h){S.sec.h=true;changed=true}}
 if(changed||S.mode==='only')rebuild(f);else paint();
 setLive(id?summary(M,id):'Выбор сброшен');
}
function focusItem(id,noScroll){
 var e=$('#n-'+cssId(id));if(!e)return;
 document.querySelectorAll('#cv [role=treeitem][tabindex="0"]').forEach(function(x){x.tabIndex=-1});
 e.tabIndex=0;S.focusId=id;e.focus({preventScroll:!!noScroll});if(!noScroll)e.scrollIntoView({block:'nearest',inline:'nearest'});
}
function toggle(id,open){
 var L=DG.L;if(!L.kids(id).length)return;
 var was=!!L.exp[id];if(open===undefined)open=!was;if(open===was)return;
 if(open)DG.exp[id]=1;else delete DG.exp[id];
 S.expanded=DG.exp;rebuild(S.focusId);
}
function toggleSec(key,open){
 var was=!!S.sec[key];if(open===undefined)open=!was;if(open===was)return;
 S.sec[key]=open;rebuild('sec-'+key);setLive((key==='g'?'Без проектов и департаментов':'Департаменты, проекты и области')+(open?': развёрнуто':': свёрнуто'));
}
function closeMenus(){document.querySelectorAll('.mmenu').forEach(function(m){m.hidden=true});document.querySelectorAll('[data-mb]').forEach(function(b){b.setAttribute('aria-expanded','false')})}
function openMenu(id){
 closeMenus();var m=$('#mm-'+id),cur=MENUS[id].get();
 m.innerHTML=MENUS[id].items.map(function(x){return '<button role="menuitemradio" aria-checked="'+(x.id===cur)+'" data-mi="'+id+'" data-mv="'+x.id+'" tabindex="-1"><b>'+(x.id===cur?'✓ ':'')+x.label+'</b><small>'+x.hint+'</small></button>'}).join('');
 m.hidden=false;$('#mb-'+id).setAttribute('aria-expanded','true');(m.querySelector('[aria-checked=true]')||m.firstChild).focus();
}
function pickMenu(id,v){MENUS[id].set(v);closeMenus();if(DG.M)rebuild(S.focusId,'#mb-'+id)}
function jump(){
 var M=DG.M,m=matches(M,S.q);if(!m.length)return;
 S.qi=(S.qi+1)%m.length;var id=m[S.qi],ch=false;
 ancestors(M,id).forEach(function(a){if(!DG.exp[a]){DG.exp[a]=1;ch=true}});
 var isTeamLone=M.teamById[id]&&!((M.projsOf[id]||[]).length+(M.deptsOf[id]||[]).length);
 if(isTeamLone&&!S.sec.g){S.sec.g=true;ch=true}
 if(!isTeamLone&&!S.sec.h){S.sec.h=true;ch=true}
 if(ch){S.expanded=DG.exp;body()}
 if(!DG.L.pos[id]){toast(S.mode==='only'&&S.chosen?'Узел скрыт режимом «Только связанные»':'Узел скрыт выбором уровней');return}
 focusItem(id);
}
/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var t=ev.target;
 var tab=t.closest&&t.closest('[role=tab]');
 if(tab){setView(tab.getAttribute('data-v'));return}
 var mb=t.closest&&t.closest('[data-mb]');if(mb){var id=mb.getAttribute('data-mb');if($('#mm-'+id).hidden)openMenu(id);else closeMenus();return}
 var mi=t.closest&&t.closest('[data-mi]');if(mi){pickMenu(mi.getAttribute('data-mi'),mi.getAttribute('data-mv'));return}
 var lb=t.closest&&t.closest('.lvl');if(lb){var l=Number(lb.getAttribute('data-l'));if(S.lv.set[l])delete S.lv.set[l];else S.lv.set[l]=1;rebuild(null,'#lvl-'+l);setLive(Object.keys(S.lv.set).length?'Показаны уровни: '+Object.keys(S.lv.set).sort().join(', ')+(S.lv.mode==='from'?' и более глубокие':''):'Показаны все уровни');return}
 if(t.id==='lvreset'){S.lv.set={};rebuild(null,'#lvl-1');setLive('Показаны все уровни');return}
 if(t.id==='xall'){var M0=DG.M,ex={};M0.areas.forEach(function(a){if(M0.ch[a.id])ex[a.id]=1});var all=Object.keys(ex).every(function(k){return DG.exp[k]});S.expanded=all?{}:ex;rebuild(S.focusId);return}
 if(!t.closest||!t.closest('.mwrap'))closeMenus();
 if(!$('#cv')||!$('#cv').contains(t))return;
 var ts=t.closest('.tog');if(ts&&ts.hasAttribute('data-s')){toggleSec(ts.getAttribute('data-s'));return}
 var tog=t.closest('.tog');if(tog){toggle(tog.getAttribute('data-t'));return}
 var nm=t.closest('a[data-o]');if(nm){ev.preventDefault();toast('Открывается страница: '+nm.getAttribute('data-o'));return}
 var sc=t.closest('.sec');if(sc){toggleSec(sc.getAttribute('data-id').slice(4));return}
 var nd=t.closest('.nd');if(nd&&chosable(DG.M,nd.getAttribute('data-id'))){S.focusId=nd.getAttribute('data-id');choose(nd.getAttribute('data-id'));focusItem(nd.getAttribute('data-id'),true)}
});
document.addEventListener('input',function(ev){if(ev.target.id==='q'){S.q=ev.target.value;S.qi=-1;if(DG.M){drawCanvas();paint();updateTool()}}});
document.addEventListener('keydown',function(ev){
 var tab=ev.target.closest&&ev.target.closest('[role=tab]');
 if(tab){var o=tab.getAttribute('data-v')==='tree'?'diagram':'tree';
  if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();$('#tb-'+o).focus()}
  if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setView(tab.getAttribute('data-v'));$('#tb-'+tab.getAttribute('data-v')).focus()}
  return}
 if(ev.target.id==='q'){if(ev.key==='Enter'){ev.preventDefault();jump()}return}
 var mm=ev.target.closest&&ev.target.closest('.mmenu'),mbt=ev.target.closest&&ev.target.closest('[data-mb]');
 if(mm||mbt){
  var mid=mm?mm.id.slice(3):mbt.getAttribute('data-mb'),menu=$('#mm-'+mid),its=[].slice.call(menu.querySelectorAll('button')),ix=its.indexOf(ev.target);
  if(ev.key==='Escape'){closeMenus();$('#mb-'+mid).focus();return}
  if(ev.key==='ArrowDown'){ev.preventDefault();if(menu.hidden)openMenu(mid);else its[(ix+1)%its.length].focus()}
  if(ev.key==='ArrowUp'&&!menu.hidden){ev.preventDefault();its[(ix+its.length-1)%its.length].focus()}
  return}
 var nd=ev.target.closest&&ev.target.closest('.nd');if(!nd||!$('#cv'))return;
 var id=nd.getAttribute('data-id'),all=DG.L.all,i=all.map(function(x){return x.id}).indexOf(id),it=all[i],k=ev.key,M=DG.M,L=DG.L;
 function go(j){j=Math.max(0,Math.min(all.length-1,j));focusItem(all[j].id)}
 if(k==='ArrowDown'||(k==='ArrowRight'&&L.orient==='v'&&false)){ev.preventDefault();go(i+1)}
 else if(k==='ArrowUp'){ev.preventDefault();go(i-1)}
 else if(k==='Home'){ev.preventDefault();go(0)}
 else if(k==='End'){ev.preventDefault();go(all.length-1)}
 else if(it.kind==='section'){var key=it.key;
  if(k==='ArrowRight'){ev.preventDefault();if(!it.expanded)toggleSec(key,true);else go(i+1)}
  else if(k==='ArrowLeft'){ev.preventDefault();if(it.expanded)toggleSec(key,false)}
  else if(k===' '||k==='Enter'){ev.preventDefault();toggleSec(key)}}
 else if(k==='ArrowRight'&&it.kind==='node'){ev.preventDefault();if(L.kids(id).length&&!L.exp[id])toggle(id,true);else if(L.kids(id).length)go(i+1)}
 else if(k==='ArrowLeft'){ev.preventDefault();if(it.kind==='node'&&L.kids(id).length&&L.exp[id])toggle(id,false);else if(it.kind==='node'&&it.vp&&L.pos[it.vp])focusItem(it.vp);else focusItem(it.kind==='team'&&!it.lone?'sec-h':(it.kind==='team'?'sec-g':'sec-h'))}
 else if(k===' '){ev.preventDefault();if(chosable(M,id))choose(id);else setLive('Этот узел выбрать нельзя')}
 else if(k==='Enter'){ev.preventDefault();var open=it.kind==='team'||it.a.active;if(open)toast('Открывается страница: '+(it.kind==='team'?it.t.name:it.a.name));else setLive('Узел деактивированного проекта ничего не открывает')}
 else if(k==='Escape'&&S.chosen){ev.preventDefault();choose(null)}
});

 S.scn=sc;S.data=sc.make();S.expanded=null;S.chosen=null;S.focusId=null;S.retried=false;S.q='';S.qi=-1;S.lv={set:{},mode:'only'};S.sec={g:true,h:true};S.offersState=sc.offers?'failed':'ok';

SCN.forEach(function(sc){var b=document.createElement('button');b.textContent=sc.label;b.setAttribute('data-s',sc.id);b.onclick=function(){pick(sc)};$('#scn').appendChild(b)});

<script>
(function(){
'use strict';
/* ---------- design constants (§ 4.3 of design.md) ---------- */
var LINE_LIMIT=150, EXPAND_ALL_LIMIT=100, ROW=40, RULER=22, CTL=0, IND=22, VW=156, VH=58, VGAP=12, BAND=88, SLIM=30, TEAMGAP=70, LABEL_W=40, VERT_NOTE_LIMIT=120, HIER_W=480, GUT=150, GAP=200, TEAM_W=220, PAD=16, HEAD=28;

var LN={nest:{c:'#616161',w:1.5,d:''},rel:{c:'#0C5598',w:2.5,d:'7 4'},copy:{c:'#424242',w:2.5,d:'9 4 2.5 4'},hid:{c:'#0C5598',w:2.5,d:'2.5 4'},grey:'#9E9E9E',emph:4};
var ZMIN=.5,ZMAX=2,ZSTEP=.1;
var TYPE={department:'Департамент',project:'Проект',area:'Область'};
/* ---------- data ---------- */
function node(id,parent,type,name,o){o=o||{};return {id:id,parentId:parent,type:type,name:name,projectId:o.pid||null,active:o.active===false?false:true,key:o.key||null}}
function normal(){
 var areas=[
  node('d1',null,'department','Логистика'),
  node('pA','d1','project','Складской портал',{pid:'A',key:'WH'}),
  node('a1','pA','area','Склад',{pid:'A'}),node('a2','a1','area','Приёмка',{pid:'A'}),node('a3','a1','area','Отгрузка',{pid:'A'}),
  node('pE','d1','project','Транспорт',{pid:'E',key:'TR'}),
  node('d2',null,'department','Финансы'),
  node('pB','d2','project','Биллинг',{pid:'B',key:'BIL'}),
  node('pC','d2','project','Архив 2023',{pid:'C',active:false}),
  node('a4','pC','area','Сверка',{pid:'C',active:false}),
  node('pF',null,'project','Мобильное приложение',{pid:'F',key:'MOB'}),
  node('a5','pF','area','Платежи',{pid:'F'})
 ];
 var offers={projects:{A:{teams:['MARS','VENUS']},E:{teams:['JUPITER']},B:{teams:['MARS','SATURN']},F:{teams:['JUPITER','ORION']}},
  teams:[{id:'ATLAS',name:'ATLAS',depts:[]},{id:'JUPITER',name:'JUPITER',depts:['d1','d2']},{id:'MARS',name:'MARS',depts:['d1']},{id:'ORION',name:'ORION',depts:[]},{id:'SATURN',name:'SATURN',depts:['d2']},{id:'VENUS',name:'VENUS',depts:['d1']}]};
 return {areas:areas,offers:offers};
}
function large(){
 var areas=[],teams=[],offers={projects:{},teams:teams},t,i,j,k,d,p,c,tn=0;
 for(i=1;i<=24;i++){teams.push({id:'T'+i,name:'Команда '+(i<10?'0':'')+i,depts:(i%4===0?['d'+(i%6+1)]:[]).concat(i%8===0?['d'+((i+2)%6+1)]:[])});}
 for(d=1;d<=6;d++){areas.push(node('d'+d,null,'department','Департамент '+d));
  for(p=1;p<=6;p++){var pid='p'+d+'_'+p;areas.push(node(pid,'d'+d,'project','Проект '+d+'.'+p,{pid:pid,key:'P'+d+p}));
   var ts=[];for(k=0;k<5;k++){ts.push('T'+(((d*5+p*3+k*4)%24)+1));}offers.projects[pid]={teams:ts.filter(function(x,ix){return ts.indexOf(x)===ix;})};
   for(j=1;j<=3;j++){areas.push(node(pid+'a'+j,pid,'area','Область '+j,{pid:pid}));if(j===1){areas.push(node(pid+'b',pid+'a'+j,'area','Подобласть',{pid:pid}));}}}}
 for(i=1;i<=3;i++){areas.push(node('top'+i,null,'project','Проект верхнего уровня '+i,{pid:'top'+i,key:'TOP'+i}));offers.projects['top'+i]={teams:['T'+i,'T'+(i+4)]};}
 teams.push({id:'T25',name:'Команда 25',depts:[]},{id:'T26',name:'Команда 26',depts:[]});
 return {areas:areas,offers:offers};
}
var SCN=[
 {id:'normal',label:'Обычная организация',make:normal},
 {id:'large',label:'Большая организация (линии только для выбранного)',make:large},
 {id:'offersFailed',label:'Предложения не загрузились',make:normal,offers:'failed'},
 {id:'offersLoading',label:'Предложения загружаются',make:normal,offers:'loading'},
 {id:'loading',label:'Загрузка',make:normal,tree:'loading'},
 {id:'treeFailed',label:'Ошибка дерева',make:normal,tree:'failed'},
 {id:'empty',label:'Пустая организация',make:function(){return {areas:[],offers:{projects:{},teams:[]}}}},
 {id:'notFound',label:'Организация не найдена',make:normal,tree:'404'}
];
/* ---------- state ---------- */
var S={mode:'dim',q:'',qi:-1,scn:SCN[0],data:null,view:'diagram',role:'admin',expanded:null,chosen:null,focusId:null,retried:false,offersState:'ok',layout:'h',lv:{set:{},mode:'only'},sec:{n:true,h:true},zoom:1};
function $(sel,root){return (root||document).querySelector(sel)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ru(n,one,few,many){var m=n%10,h=n%100;return n+' '+(m===1&&h!==11?one:(m>=2&&m<=4&&(h<12||h>14)?few:many))}
/* ---------- model: pure functions (lib/diagramModel.ts in the product) ---------- */
function childrenOf(areas){var m={};areas.forEach(function(a){(m[a.parentId||'']=m[a.parentId||'']||[]).push(a)});return m}
function initialExpansion(areas,ch){var s={};if(areas.length>EXPAND_ALL_LIMIT)return s;Object.keys(ch).forEach(function(k){if(k!=='')s[k]=1});return s}
function model(){
 var areas=S.data.areas,off=S.offersState==='ok'?S.data.offers:null,byId={},ch=childrenOf(areas);
 areas.forEach(function(a){byId[a.id]=a});
 var projNode={};areas.forEach(function(a){if(a.type==='project')projNode[a.projectId]=a});
 var teams=off?off.teams.slice():[],teamById={},copies={},loose=[],teamsOf={},projsOf={},deptsOf={},teamsOfDept={},pairs=[];
 teams.forEach(function(t){teamById[t.id]=t});
 /* a team is a child of every department it is linked to (a copy per department); with none it is loose */
 teams.forEach(function(t){
  var ds=t.depts.filter(function(d){return byId[d]&&byId[d].type==='department'});
  deptsOf[t.id]=ds.slice();
  (ds.length?ds:[null]).forEach(function(d){
   var n={id:'tm:'+t.id+'@'+(d||'-'),kind:'team',type:'team',teamId:t.id,name:t.name,parentId:d,active:true,projectId:null,t:t};
   byId[n.id]=n;(copies[t.id]=copies[t.id]||[]).push(n);
   if(d){(ch[d]=ch[d]||[]).push(n);(teamsOfDept[d]=teamsOfDept[d]||[]).push(t.id)}else loose.push(n)})});
 if(off)Object.keys(off.projects).forEach(function(pid){var n=projNode[pid];if(!n||!n.active)return;
  off.projects[pid].teams.forEach(function(tid){if(!teamById[tid])return;pairs.push({p:n.id,t:tid});(teamsOf[n.id]=teamsOf[n.id]||[]).push(tid);(projsOf[tid]=projsOf[tid]||[]).push(n.id)})});
 var top=ch['']||[],roots={h:top.filter(function(a){return a.type==='department'}),n:top.filter(function(a){return a.type!=='department'}).concat(loose)};
 var joins=0;Object.keys(copies).forEach(function(k){joins+=copies[k].length-1});
 var M={areas:areas,byId:byId,ch:ch,off:off,teams:teams,teamById:teamById,copies:copies,pairs:pairs,roots:roots,teamsOf:teamsOf,projsOf:projsOf,deptsOf:deptsOf,teamsOfDept:teamsOfDept,projNode:projNode,linesTotal:pairs.length+joins,secMax:{n:0,h:0},maxLevel:1};
 ['n','h'].forEach(function(k){(function walk(list,d){list.forEach(function(n){M.secMax[k]=Math.max(M.secMax[k],d);M.maxLevel=Math.max(M.maxLevel,d);walk(ch[n.id]||[],d+1)})})(roots[k],1)});
 return M;
}
function baseOf(n){return n.kind==='team'?n.teamId:n.id}
function chosable(M,base){var n=M.byId[base];if(n&&n.kind!=='team')return n.type==='department'||(n.type==='project'&&n.active);return !!M.teamById[base]}
function descendants(M,id,out){(M.ch[id]||[]).forEach(function(c){if(c.kind!=='team'){out[c.id]=1;descendants(M,c.id,out)}})}
function emphasis(M,base){
 if(!base)return null;
 var ids={},lines={},bA={},bT={};
 if(M.teamById[base]){bT[base]=1;(M.deptsOf[base]||[]).forEach(function(d){ids[d]=1})}

function tipShow(el){var t=el.getAttribute('data-tip');if(!t){tipHide();return}TIP.textContent=t;TIP.style.display='block';var r=el.getBoundingClientRect(),w=TIP.offsetWidth,x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),y=r.bottom+6;if(y+TIP.offsetHeight>innerHeight-4)y=r.top-TIP.offsetHeight-6;TIP.style.left=x+'px';TIP.style.top=y+'px'}
function tipHide(){TIP.style.display='none'}
document.addEventListener('mouseover',function(ev){var el=ev.target.closest&&ev.target.closest('[data-tip]');if(el)tipShow(el);else tipHide()});
document.addEventListener('focusin',function(ev){var el=ev.target.closest&&ev.target.closest('[data-tip]');if(el&&ev.target.matches(':focus-visible'))tipShow(el);else tipHide()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')tipHide()},true);
document.addEventListener('click',function(){tipHide()},true);
function setView(v){S.view=v;S.chosen=null;render()}
/* ---------- scenario controls ---------- */
function pick(sc){
 S.scn=sc;S.data=sc.make();S.expanded=null;S.chosen=null;S.focusId=null;S.retried=false;S.q='';S.qi=-1;S.lv={set:{},mode:'only'};S.sec={n:true,h:true};S.zoom=1;S.offersState=sc.offers?'failed':'ok';
 document.querySelectorAll('#scn button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===sc.id)});
 render();
}
SCN.forEach(function(sc){var b=document.createElement('button');b.textContent=sc.label;b.setAttribute('data-s',sc.id);b.onclick=function(){pick(sc)};$('#scn').appendChild(b)});
document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){S.role=b.getAttribute('data-role');document.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
document.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){S.narrow=b.getAttribute('data-w')==='narrow';document.querySelectorAll('[data-w]').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
S.mode=stored('mustask.structure.mode.v1.demo',['dim','only','hl'],'dim');
S.layout=stored('mustask.structure.layout.v1.demo',['h','v'],'h');
pick(SCN[0]);
})();

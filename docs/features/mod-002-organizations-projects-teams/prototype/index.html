<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mustask</title>
<!--
  mod-002 clickable prototype (docs/features/mod-002-organizations-projects-teams/design.md, § 17).
  Self-contained: inline CSS with mod-015's theme tokens, inline SVG copies of Material icon glyphs, vanilla JS.
  Loads nothing from any host and adds no dependency.
  Every product string is the final Russian copy of design.md and the stories.
  The shell around the pages is a simplified copy of mod-015's prototype; mod-015's design governs it.
  As mod-015's shell does, it derives the settings page, the current entry and the trail from the
  navigation model and the address; no page sets them (design.md § 2.1).
  The yellow dashed «Панель прототипа» and the dashed notes are prototype tooling, not design.
-->
<style>
:root{
  /* colour roles (mod-015 design.md § 2.1) */
  --app-bg:#F8F8F8; --nav:#EBEBEB; --nav-hover:#E2E2E2; --nav-sel:#DCDCDC; --paper:#FFFFFF;
  --text:#242424; --text2:#616161; --accent:#0F6CBD; --accent-dark:#0C5598; --white:#FFFFFF;
  --divider:#E0E0E0; --input-border:#8A8A8A; --table-head:#F3F3F3; --hover:#F0F0F0; --row-sel:#E5F0FA;
  --error:#C42B1C; --warning:#9D5D00; --success:#107C10; --info:#01579B;
  --error-bg:#FDEDED; --error-ink:#5F2120; --info-bg:#E5F6FD; --info-ink:#014361;
  --disabled:#9E9E9E; --disabled-bg:#E6E6E6; --chip:#EBEBEB;
  /* layout and density (mod-015 design.md § 2.5) */
  --topbar:48px; --nav-w:240px; --rail-w:48px; --snav-w:240px; --form-w:480px;
  --row-h:36px; --ctl-h:32px; --radius:4px; --avatar:32px;
  --shadow-menu:0 5px 5px -3px rgba(0,0,0,.2),0 8px 10px 1px rgba(0,0,0,.14),0 3px 14px 2px rgba(0,0,0,.12);
  --shadow-dialog:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;font-size:14px;line-height:20px;color:var(--text);background:var(--app-bg)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.grow{flex:1 1 auto}
.muted{color:var(--text2)}
.cap{font-size:12px;line-height:16px;color:var(--text2)}

/* skip link */
.skip{position:fixed;left:8px;top:-60px;z-index:2000;background:var(--paper);padding:8px 12px;border-radius:var(--radius);box-shadow:var(--shadow-menu)}
.skip:focus{top:8px}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);background:var(--paper);border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:8px;padding:0 16px;z-index:1200;min-width:0}
.mark{font-size:16px;font-weight:500;color:var(--text);white-space:nowrap;padding:4px;border-radius:var(--radius)}
.mark:hover{text-decoration:none;background:var(--hover)}
.sw{display:flex;align-items:center;gap:2px;min-width:0}
.sw-level{display:inline-flex;align-items:center;gap:2px;height:var(--ctl-h);padding:0 4px 0 8px;border:0;background:none;border-radius:var(--radius);cursor:pointer;min-width:0;color:var(--text)}
.sw-level:hover{background:var(--hover)}
.sw-level[aria-expanded=true]{background:var(--nav-sel)}
.sw-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.sep{color:var(--text2);padding:0 2px}
.sw-empty{color:var(--text2);padding:0 8px;white-space:nowrap}
a.sw-empty{color:var(--accent)}
.sw-fail{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw .sk{width:120px;height:24px}
.sw-sk{display:inline-flex;align-items:center;gap:2px}
.vdiv{width:1px;align-self:stretch;margin:12px 6px;background:var(--divider);flex:none}
.trail{min-width:0;overflow:hidden}
.trail ol{display:flex;list-style:none;margin:0;padding:0;align-items:center;gap:6px;color:var(--text2);min-width:0}
.trail li{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail li.tsep{flex:none}
.avatar-btn{border:0;background:none;padding:4px;border-radius:50%;cursor:pointer;flex:none}
.avatar-btn:hover{background:var(--hover)}
.avatar{width:var(--avatar);height:var(--avatar);border-radius:50%;background:var(--text2);color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
@media (max-width:1279px){.sw-name{max-width:160px}}
@media (max-width:1023px){.sw-name{max-width:96px}.sw-fail-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}

/* navigation */
.navwrap{position:fixed;top:var(--topbar);bottom:0;left:0;display:flex;z-index:1100}
.mainnav{width:var(--nav-w);background:var(--nav);display:flex;flex-direction:column;transition:width 150ms ease;overflow-x:hidden;overflow-y:auto}
.mainnav.rail{width:var(--rail-w)}
.navlist{list-style:none;margin:0;padding:4px 0}
.navlist.bottom{margin-top:auto;border-top:1px solid var(--divider)}
.navitem{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;color:var(--text);border:0;background:none;width:100%;cursor:pointer;position:relative;white-space:nowrap;text-align:left}
.navitem:hover{background:var(--nav-hover);text-decoration:none}
.navitem.sel{background:var(--nav-sel);font-weight:500}
.navitem.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.navitem:focus-visible{outline-offset:-2px}
.rail .navitem{justify-content:center;padding:0}
.setnav{width:var(--snav-w);background:var(--nav);border-left:1px solid var(--divider);overflow-y:auto;padding:12px 0}
.setnav-title{font-size:16px;line-height:24px;font-weight:500;margin:0 16px 4px}
.setnav ul{list-style:none;margin:0;padding:0}
.subheader{font-weight:500;padding:10px 16px 4px}
.navitem.set{padding-left:32px;height:36px}
@media (prefers-reduced-motion:reduce){.mainnav{transition:none}.sk{animation:none!important}.drawer-anim{animation:none!important}}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1300}
.overlay{position:fixed;top:0;bottom:0;left:0;display:flex;z-index:1301;box-shadow:var(--shadow-dialog);animation:slidein 180ms ease}
.overlay .mainnav,.overlay .setnav{padding-top:8px}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}

/* main region */
.main{padding:var(--topbar) 24px 64px;min-height:100vh}
body[data-nav=expanded] .main{margin-left:var(--nav-w)}
body[data-nav=rail] .main{margin-left:var(--rail-w)}
body[data-nav=settings] .main{margin-left:calc(var(--rail-w) + var(--snav-w))}
body[data-nav=overlay] .main{margin-left:0;padding-left:16px;padding-right:16px}
.main:focus-visible{outline-offset:-2px}

/* page header */
.ph{padding:16px 0 8px}
.ph-trail{margin-bottom:4px}
.ph-row{display:flex;align-items:flex-start;gap:16px}
.ph-title{font-size:20px;line-height:28px;font-weight:500;margin:2px 0;flex:1 1 200px;min-width:160px;overflow-wrap:anywhere}
.cmdbar{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;overflow:hidden;min-height:38px;padding:3px}
.cmdbar .hidden{display:none}
.tabs{display:flex;gap:20px;margin-top:4px}
.tab{padding:8px 0 6px;color:var(--text2);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--text);text-decoration:none}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:var(--ctl-h);padding:4px 12px;border-radius:var(--radius);border:1px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap;background:none;color:var(--text);flex:none}
.btn .lead{color:var(--accent)}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.contained{background:var(--accent);color:var(--white)}
.btn.contained .lead{color:inherit}
.btn.contained:hover{background:var(--accent-dark)}
.btn.outlined{border-color:var(--input-border);background:var(--paper)}
.btn.outlined:hover{background:var(--hover)}
.btn.danger{background:var(--error);color:var(--white)}
.btn.sm{min-height:28px;padding:2px 8px}
.btn:disabled,.btn:disabled:hover{color:var(--disabled);background:none;cursor:default}
.btn.contained:disabled,.btn.danger:disabled{background:var(--disabled-bg);color:var(--disabled)}
.btn:disabled .lead{color:var(--disabled)}
.iconbtn{width:var(--ctl-h);height:var(--ctl-h);display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--text);flex:none}
.iconbtn:hover{background:var(--hover)}
.iconbtn.sm{width:28px;height:28px}
.iconbtn:disabled{color:var(--disabled);cursor:default;background:none}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* text fields */
.tf{position:relative;display:flex;flex-direction:column;width:100%}
.tf>label{position:absolute;top:-8px;left:9px;padding:0 4px;background:var(--paper);font-size:12px;line-height:16px;color:var(--text2);pointer-events:none;z-index:1}
.tf input,.tf select{height:38px;padding:8px 10px;border:1px solid var(--input-border);border-radius:var(--radius);font:inherit;color:var(--text);background:var(--paper);width:100%}
.tf input:focus,.tf select:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tf input:disabled,.tf select:disabled{color:var(--disabled);border-color:var(--disabled-bg)}
.tf .help{font-size:12px;line-height:16px;color:var(--text2);margin:3px 12px 0}
.tf.err input,.tf.err select{border-color:var(--error)}
.tf.err .help,.tf.err>label{color:var(--error)}
.tf.combo input{padding-right:40px}
.tf .popup-ind{position:absolute;right:4px;top:3px}
.combo-list{list-style:none;margin:4px 0 0;padding:4px 0;border-radius:var(--radius);max-height:220px;overflow:auto;background:var(--paper);box-shadow:var(--shadow-menu)}
.combo-list li{padding:6px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.combo-list li:hover,.combo-list li.active{background:var(--hover)}
.combo-list li.none{cursor:default;color:var(--text2)}

/* panels, tables, facts */
.panel{background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius)}
.panel.pad{padding:24px}
.facts-panel{max-width:var(--form-w)}
.facts{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 16px;margin:0}
.facts dt{font-size:12px;line-height:20px;font-weight:500;color:var(--text2)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts dd .cap{display:block;margin-top:2px}
@media (max-width:900px){.facts{grid-template-columns:minmax(0,1fr);gap:0}.facts dd{margin-bottom:12px}}
.tablewrap{background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius);overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{height:var(--row-h);background:var(--table-head);font-size:12px;line-height:16px;font-weight:500;color:var(--text2);text-align:left;padding:4px 12px;border-bottom:1px solid var(--divider);white-space:nowrap}
.t td{height:var(--row-h);padding:4px 12px;border-bottom:1px solid var(--divider);white-space:nowrap}
.t tbody tr:hover{background:var(--hover)}
.t td.actions{text-align:right;padding-top:2px;padding-bottom:2px;width:1%}
.t td.nm{max-width:420px;overflow:hidden;text-overflow:ellipsis}
.t td.key{width:160px}
.treegrid tbody tr{cursor:pointer}
.treegrid tbody tr[aria-selected=true]{background:var(--row-sel)}
.treegrid tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tree-name{display:flex;align-items:center;gap:2px;min-width:0}
.tree-name .nm{overflow:hidden;text-overflow:ellipsis;max-width:360px}
.tree-gap{display:inline-block;width:28px;flex:none}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--chip);font-size:12px;line-height:16px;white-space:nowrap;margin-left:8px;flex:none}
.sk{display:inline-block;height:20px;width:100%;border-radius:var(--radius);background:var(--disabled-bg);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* canon frame and alerts */
.frame{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 16px;gap:8px}
.frame .frame-ic{color:var(--text2)}
.frame-h{font-size:16px;line-height:24px;font-weight:500;margin:8px 0 0}
.frame-h.h1{font-size:20px;line-height:28px}
.frame-hint{color:var(--text2);margin:0 0 8px;max-width:520px}
.alert{display:flex;gap:12px;align-items:center;padding:6px 12px;border-radius:var(--radius);margin:8px 0}
.alert>.ic{align-self:flex-start;margin-top:2px}
.alert .msg{flex:1;padding:2px 0}
.alert.error{background:var(--error-bg);color:var(--error-ink)} .alert.error>.ic{color:var(--error)}

/* menus, tooltip, snackbar, dialogs */
.menu{position:fixed;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-menu);padding:4px 0;min-width:200px;max-width:360px;z-index:1350;max-height:60vh;overflow:auto}
.mi{display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:36px;cursor:pointer;width:100%;border:0;background:none;text-align:left;color:var(--text)}
a.mi{color:var(--text)}
.mi:hover,.mi:focus{background:var(--hover);text-decoration:none}
.mi:focus-visible{outline-offset:-2px}
.mi .check{width:20px;flex:none;color:var(--text)}
.mi.danger{color:var(--error)}
.mlabel{padding:8px 16px 6px;font-weight:500}
.msub{padding:6px 16px 4px;font-size:12px;line-height:16px;color:var(--text2);font-weight:500}
.mdiv{height:1px;background:var(--divider);margin:4px 0}
#tip{position:fixed;background:rgba(97,97,97,.94);color:var(--white);font-size:12px;line-height:16px;padding:4px 8px;border-radius:var(--radius);max-width:320px;z-index:1500;pointer-events:none;display:none;overflow-wrap:anywhere}
.snack{position:fixed;left:24px;bottom:24px;z-index:1400;min-width:288px;max-width:560px;border-radius:var(--radius);box-shadow:var(--shadow-menu);padding:10px 16px;background:#323232;color:var(--white)}
.snack.alertsnack{background:var(--info-bg);color:var(--info-ink);display:flex;gap:10px;align-items:flex-start}
.snack.alertsnack .ic{color:var(--info)}
.snack.errsnack{background:var(--error-bg);color:var(--error-ink);display:flex;gap:10px;align-items:flex-start}
.snack.errsnack .ic{color:var(--error)}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-dialog);width:calc(100% - 64px);max-width:444px;max-height:calc(100% - 64px);display:flex;flex-direction:column;z-index:1310;margin:0}
.dialog.sm{max-width:600px}
.dlg-title{display:flex;align-items:center;gap:8px;padding:16px 16px 12px 24px}
.dlg-title h2{font-size:16px;line-height:24px;font-weight:500;margin:0;flex:1}
.dlg-content{padding:4px 24px 8px;overflow:auto;flex:1 1 auto}
.dlg-content p{margin:0 0 8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px 16px}
.stack{display:flex;flex-direction:column;gap:20px;padding-top:10px}
.row{display:flex;align-items:center;gap:8px}

/* prototype tooling — not part of the design */
.proto{position:fixed;right:12px;bottom:12px;width:360px;max-height:62vh;overflow:auto;background:#FFFBE6;border:2px dashed #B38600;border-radius:6px;z-index:1450;font-size:13px;line-height:18px;padding:10px 12px;color:#3D3000}
.proto.closed{width:auto;padding:4px 8px}
.proto h2{font-size:14px;margin:0;flex:1}
.proto label{display:block;margin:8px 0 2px;font-weight:500}
.proto select{width:100%;font:inherit;padding:3px}
.proto .links{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.proto .links a,.proto .links button{color:#6B4E00;text-decoration:underline;border:0;background:none;padding:0;cursor:pointer;font:inherit;text-align:left}
.proto .sect{border-top:1px dashed #D9B84A;margin-top:10px;padding-top:6px}
.proto-note{border:1px dashed #B38600;background:#FFFBE6;color:#3D3000;border-radius:var(--radius);padding:8px 12px;margin:8px 0;font-size:13px}
.snack.proto-snack{background:#FFFBE6;color:#3D3000;border:1px dashed #B38600}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="tip" role="tooltip"></div>
<aside id="proto" class="proto" aria-label="Панель прототипа"></aside>

function dataset(kind){
  const D = {orgs:[], projects:[], teams:[], areas:[]};
  if (kind === 'noOrgs') return D;
  const org = (id, name, status) => D.orgs.push({id, name, status:status || 'Active'});
  /* BR-M1-9, BR-M1-11: a project comes with its first team and its root area, the team's default */
  const prj = (id, orgId, name, key, status) => {
    D.projects.push({id, orgId, name, key, status:status || 'Active'});
    D.teams.push({id:'team-' + id.slice(4), projectId:id, name, status:'Active', first:true, defaultAreaId:'area-' + id.slice(4)});
    D.areas.push({id:'area-' + id.slice(4), projectId:id, parentId:null, name, ownerTeamId:'team-' + id.slice(4)});
  };
  org('org-alfa', 'Альфа'); org('org-beta', 'Бета'); org('org-gamma', 'Гамма', 'Deactivated');
  prj('prj-prm', 'org-alfa', 'Пример проекта', 'PRM');
  prj('prj-anl', 'org-alfa', 'Аналитика', 'ANL');
  prj('prj-old', 'org-alfa', 'Старый проект', 'OLD', 'Deactivated');
  prj('prj-rep', 'org-beta', 'Отчётность', 'REP');
  prj('prj-arc', 'org-gamma', 'Архивный проект', 'ARC');
  if (kind === 'rootOnly') return D;
  const team = (id, name, status, defaultAreaId) => D.teams.push({id, projectId:'prj-prm', name, status:status || 'Active', first:false, defaultAreaId});
  const area = (id, parentId, name, ownerTeamId) => D.areas.push({id, projectId:'prj-prm', parentId, name, ownerTeamId:ownerTeamId || null});
  team('team-plat', 'Платформа', null, 'area-api');
  team('team-mob', 'Мобильное приложение', 'Deleted', null);   /* deleted earlier: its area passed to the first team (US-7) */
  area('area-plat', 'area-prm', 'Платформа', 'team-plat');
  area('area-api', 'area-plat', 'API', 'team-plat');
  area('area-gw', 'area-api', 'Шлюз', null);
  area('area-reports', 'area-prm', 'Отчёты', null);
  area('area-q', 'area-reports', 'Квартальные', null);
  area('area-y', 'area-reports', 'Годовые', null);
  area('area-arch', 'area-prm', 'Архив', null);
  area('area-mob', 'area-prm', 'Мобильное приложение', 'team-prm');
  return D;
}
const getOrg = (id) => S.db.orgs.find((x) => x.id === id) || null;
const getPrj = (id) => S.db.projects.find((x) => x.id === id) || null;
const getTeam = (id) => S.db.teams.find((x) => x.id === id) || null;
const getArea = (id) => S.db.areas.find((x) => x.id === id) || null;
function activeOrgs(){ return S.db.orgs.filter((o) => o.status === 'Active').sort(byName); }
function deactivatedOrgs(){ return S.db.orgs.filter((o) => o.status === 'Deactivated').sort(byName); }
function projectsOf(orgId, status){ return S.db.projects.filter((p) => p.orgId === orgId && p.status === (status || 'Active')).sort(byName); }
function teamsOf(prjId){ const t = S.db.teams.filter((x) => x.projectId === prjId && x.status === 'Active'); return t.filter((x) => x.first).concat(t.filter((x) => !x.first).sort(byName)); }
function firstTeam(prjId){ return S.db.teams.find((t) => t.projectId === prjId && t.first) || null; }
function rootOf(prjId){ return S.db.areas.find((a) => a.projectId === prjId && !a.parentId) || null; }
function childrenOf(id){ return S.db.areas.filter((a) => a.parentId === id).sort(byName); }
function treeOrder(prjId){ const out = []; const walk = (a, level) => { out.push({a, level}); childrenOf(a.id).forEach((c) => walk(c, level + 1)); }; const r = rootOf(prjId); if (r) walk(r, 1); return out; }
function subtreeIds(id){ let ids = [id]; childrenOf(id).forEach((c) => { ids = ids.concat(subtreeIds(c.id)); }); return ids; }
/* design.md § 4.6: the path below the root; the root by its own name */
function areaPath(a){ if (!a.parentId) return a.name; const names = []; let x = a; while (x && x.parentId) { names.unshift(x.name); x = getArea(x.parentId); } return names.join(' / '); }
/* BR-M1-11: no explicit owner → the nearest explicitly owned ancestor's */
function owner(a){ let x = a, inherited = false; while (x && !x.ownerTeamId) { x = getArea(x.parentId); inherited = true; } return {team:x ? getTeam(x.ownerTeamId) : null, inherited}; }
function defaultTeamOf(a){ return S.db.teams.find((t) => t.status === 'Active' && t.defaultAreaId === a.id) || null; }

/* design.md § 3.6: a remembered or chosen entry that is gone is replaced by the first entry of its level;
   the levels below take their first entries. Returns true when the fallback notice was shown. */
function fallback(announce){
  const was = Object.assign({}, S.ctx);
  let replaced = false;
  const os = activeOrgs();
  let o = os.find((x) => x.id === was.org) || null;
  if (!o && was.org && os.length) replaced = true;
  if (!o) o = os[0] || null;
  let p = null, t = null;
  if (o) {
    const ps = projectsOf(o.id);
    p = ps.find((x) => x.id === was.prj) || null;
    if (!p && was.prj && o.id === was.org && ps.length) replaced = true;
    if (!p) p = ps[0] || null;
  }
  if (p) {
    const ts = teamsOf(p.id);
    t = ts.find((x) => x.id === was.team) || null;
    if (!t && was.team && p.id === was.prj && ts.length) replaced = true;
    if (!t) t = ts[0] || null;
  }
  S.ctx = {org:o ? o.id : null, prj:p ? p.id : null, team:t ? t.id : null};
  remember();
  if (announce && replaced) {
    const parts = [o && o.name, p && p.name, t && t.name].filter(Boolean);
    notice('Ранее выбранный контекст недоступен. Выбрано: ' + parts.join(' / ') + '.', 'info');
    return true;
  }
  return false;
}

/* ---------- routing (design.md § 1) ---------- */
function path(){ return (location.hash.replace(/^#/, '') || '/home').split('?')[0]; }
function go(p){ if (path() === p) render(); else location.hash = '#' + p; }
function parseRoute(){
  const p = path(); const s = p.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  /* entry: the entry whose landing pattern the address is at or beneath; the switch resolver keeps it (design.md § 2.2, § 16) */
  const R = (o) => Object.assign({path:p, ctx:null, carries:null, entry:null}, o);
  if (p === '/' || p === '/home') return R({name:'home', entry:'home'});
  if (p === '/dictionaries/languages') return R({name:'languages', entry:'languages'});
  if (s[0] === 'organizations') {
    if (s.length === 1) return R({name:'orgList', tab:'active'});
    if (s.length === 2 && s[1] === 'deactivated') return R({name:'orgList', tab:'deactivated'});   /* the static segment outranks :organizationId */
    const o = s[1];
    const oc = {ctx:{o}, carries:'org'};
    if (s[2] === 'settings' && s.length === 4 && s[3] === 'general') return R(Object.assign({name:'orgGeneral', entry:'org-general'}, oc));
    if (s[2] === 'settings' && s.length === 4 && s[3] === 'process') return R(Object.assign({name:'process', entry:'org-process'}, oc));
    if (s[2] === 'settings' && s[3] === 'projects' && s.length === 4) return R(Object.assign({name:'projects', tab:'active', entry:'org-projects'}, oc));
    if (s[2] === 'settings' && s[3] === 'projects' && s.length === 5 && s[4] === 'deactivated') return R(Object.assign({name:'projects', tab:'deactivated', entry:'org-projects'}, oc));
    if (s[2] === 'projects' && s[4] === 'settings') {
      const pc = {ctx:{o, p:s[3]}, carries:'prj'};
      const map = {general:['prjGeneral','prj-general'], teams:['teams','prj-teams'], areas:['areas','prj-areas']};
      if (s.length === 6 && map[s[5]]) return R(Object.assign({name:map[s[5]][0], entry:map[s[5]][1]}, pc));
      /* DC-4: a team's page is project-level, beneath «Команды»; its team is the page's entity, not a context level */
      if (s.length === 7 && s[5] === 'teams') return R(Object.assign({name:'team', team:s[6], entry:'prj-teams'}, pc));
    }
  }
  return R({name:'notFound', kind:'page'});
}
/* BR-M1-20: the outermost level not found answers; a found context sets the switcher (design.md § 3.4) */
function resolveRoute(){
  const r = parseRoute();
  if (!r.ctx) return r;
  const nf = (kind) => Object.assign({}, r, {name:'notFound', kind});
  const o = S.db.orgs.find((x) => x.id === r.ctx.o && x.status === 'Active');
  if (!o) return nf('organization');
  let p = null;
  if (r.ctx.p !== undefined) { p = S.db.projects.find((x) => x.id === r.ctx.p && x.orgId === o.id && x.status === 'Active'); if (!p) return nf('project'); }
  const before = JSON.stringify(S.ctx);
  S.ctx.org = o.id;
  if (p) S.ctx.prj = p.id;
  else if (!projectsOf(o.id).some((x) => x.id === S.ctx.prj)) S.ctx.prj = (projectsOf(o.id)[0] || {}).id || null;
  const cp = S.ctx.prj;
  if (!cp || !teamsOf(cp).some((x) => x.id === S.ctx.team)) S.ctx.team = cp ? (teamsOf(cp)[0] || {}).id || null : null;
  if (JSON.stringify(S.ctx) !== before) remember();
  /* the page's own entity, after the context it lives in was found (design.md § 12) */
  if (r.team !== undefined && !S.db.teams.some((x) => x.id === r.team && x.projectId === p.id && x.status === 'Active')) return nf('team');
  return r;
}

/* design.md § 3.2: mod-015 § 5.4 states plus a lower level that loads or fails on its own, drawn by mod-015's switcher from a status per level once amended (DC-11) */
function switcher(){
  const sep = '<span class="sep" aria-hidden="true">/</span>', sk = '<span class="sk"></span>';
  if (S.sw === 'orgLoading') return '<div class="sw" role="status" aria-label="Загрузка контекста">' + sk + sep + sk + sep + sk + '</div>';

  let h = '<div class="sw" role="group" aria-label="Контекст работы">';
  const o = getOrg(S.ctx.org);
  if (!o) return h + '<a class="sw-empty" href="#/organizations" data-fk="sw-none">Нет организаций</a></div>';

function navItem(e, href, label, icon, rail, current, extra){
  const cur = current ? ' aria-current="' + current + '"' : '';
  const tip = rail ? ' aria-label="' + esc(label) + '" data-tip="' + esc(label) + '" data-tip-pos="right"' : '';
  return '<li><a class="navitem' + (current ? ' sel' : '') + '" href="#' + esc(href) + '" data-fk="nav-' + e + '"' + cur + tip + (extra || '') + '>' + ic(icon) + (rail ? '' : '<span>' + esc(label) + '</span>') + '</a></li>';

/* mod-015's derivation (its § 4.4; its plan § 4.2, § 4.5): the marker, the settings page and the trail come from
   the model and the address, never from the page. A visible entry is "page" on its landing, "true" beneath it.
   A context that is not found is not the switcher's, so its address is beneath no landing (design.md § 12). */
function markerFor(e, p){
  if (!entryVisible(e)) return null;
  const l = e.landing(S.ctx);
  return p === l ? 'page' : p.startsWith(l + '/') ? 'true' : null;
}
const addr = (r) => r.path === '/' ? '/home' : r.path;
function currentFor(e, r){ return r ? markerFor(e, addr(r)) : null; }
function settingsHit(r){
  for (const s of SETTINGS) for (const e of s.entries) { const m = currentFor(e, r); if (m) return {section:s.section, entry:e, marker:m}; }
  return null;
}
function deriveTrail(r){
  const h = settingsHit(r);
  if (!h) return null;
  const t = [{label:'Настройки'}, {label:h.section}];
  if (h.marker === 'true') t.push({label:h.entry.label, href:h.entry.landing(S.ctx)});
  return t;
}
function mainNav(r, rail, isSettings, inOverlay){
  const fs = firstSettings();
  const ov = inOverlay ? ' data-overlay="1"' : '';
  let h = '<nav class="mainnav' + (rail ? ' rail' : '') + '" aria-label="Основное меню" id="main-nav"><ul class="navlist">';
  h += NAV.map((e) => navItem(e.key, e.landing(S.ctx), e.label, e.icon, rail, currentFor(e, r), ov)).join('');
  h += '</ul><ul class="navlist bottom">';
  if (fs) h += navItem('settings', fs.landing(S.ctx), 'Настройки', 'settings', rail, isSettings ? 'true' : null, ov);
  if (!isSettings && !inOverlay) h += '<li><button class="navitem" data-act="toggleNav" data-fk="nav-toggle" aria-controls="main-nav" aria-expanded="' + !rail + '"' + (rail ? ' aria-label="Развернуть меню" data-tip="Развернуть меню" data-tip-pos="right"' : '') + '>' + ic(rail ? 'dblRight' : 'dblLeft') + (rail ? '' : '<span>Свернуть меню</span>') + '</button></li>';
  return h + '</ul></nav>';
}
function settingsNav(r, inOverlay){
  const ov = inOverlay ? ' data-overlay="1"' : '';
  let h = '<nav class="setnav" aria-label="Меню настроек"><p class="setnav-title">Настройки</p>';
  visibleSettingsSections().forEach((s) => {
    h += '<div class="subheader">' + esc(s.section) + '</div><ul>';
    s.entries.forEach((e) => {
      const cur = currentFor(e, r);
      h += '<li><a class="navitem set' + (cur ? ' sel' : '') + '" href="#' + esc(e.landing(S.ctx)) + '" data-fk="set-' + e.key + '"' + (cur ? ' aria-current="' + cur + '"' : '') + ov + '>' + esc(e.label) + '</a></li>';
    });

}
let CMDS = [];
function pageHeader(pg, narrow){
  if (pg.noHeader) return '';

  const cmds = (pg.commands || []).filter(Boolean);

  const bar = cmds.map((c, i) => '<button class="btn' + (c.primary ? ' contained' : '') + '" data-cmd="' + i + '" data-act="' + c.act + '" data-arg="' + esc(c.arg || '') + '" data-fk="cmd-' + c.fk + '"' + (c.disabled ? ' disabled' : '') + '>' + ic(c.icon, {cls:'lead'}) + esc(c.label) + '</button>').join('');
  const more = '<button class="iconbtn hidden" data-more="1" data-act="openMenu" data-arg="overflow" data-fk="overflow" aria-label="Ещё действия" aria-haspopup="menu" aria-expanded="' + !!(S.menu && S.menu.id === 'overflow') + '" data-tip="Ещё действия">' + ic('more') + '</button>';

  return '<div class="ph">' + tr + '<div class="ph-row"><h1 class="ph-title">' + esc(pg.title) + '</h1><div class="cmdbar" data-cmdbar="1">' + bar + more + '</div></div>' + tabs + '</div>';

/* mod-015 § 6.1: secondary commands move into «Ещё действия» from the end; the primary never moves */
function fitCommands(){
  const bar = document.querySelector('[data-cmdbar]'); if (!bar) return;
  const more = bar.querySelector('[data-more]');
  bar.querySelectorAll('[data-cmd]').forEach((b) => b.classList.remove('hidden'));
  more.classList.add('hidden');
  const secondary = Array.from(bar.querySelectorAll('[data-cmd]')).filter((b) => !CMDS[+b.dataset.cmd].primary);
  let i = secondary.length - 1;
  while (bar.scrollWidth > bar.clientWidth + 1 && i >= 0) { more.classList.remove('hidden'); secondary[i].classList.add('hidden'); i--; }
}
function shell(r, pg){

  if (kind === 'areaAct') {

function positionMenu(){
  const m = document.getElementById('open-menu'); if (!m || !S.menu) return;
  const a = document.querySelector('[data-fk="' + S.menu.fk + '"]');
  if (!a) { S.menu = null; m.remove(); return; }
  const r = a.getBoundingClientRect();
  let left = r.left, top = r.bottom + 4;
  if (left + m.offsetWidth > window.innerWidth - 8) left = Math.max(8, r.right - m.offsetWidth);
  if (top + m.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 4);
  m.style.left = left + 'px'; m.style.top = top + 'px';

/* the server: each returns a refusal {field, text} / {top} or performs the change and returns nothing */
const SERVER = {
  newOrg(d){
    if (!S.canCreate) return {top:'Недостаточно прав'};
    const name = d.name.trim();
    const taken = S.db.orgs.find((o) => same(o.name, name));   /* instance-wide, deactivated included; the same text either way */

    closeDialog();

  },
  renameOrg(d){
    const name = d.name.trim();
    const taken = S.db.orgs.find((o) => o.id !== d.id && same(o.name, name));

    go('/organizations/deactivated');   /* BR-M1-24: the list that holds it among the deactivated ones */
  },
  newProject(d){
    const name = d.name.trim(), orgId = S.ctx.org;
    const taken = S.db.projects.find((p) => p.orgId === orgId && same(p.name, name));
    if (taken) return {field:'name', text:PRJ_TAKEN(taken)};
    if (S.db.projects.some((p) => p.orgId === orgId && p.key === d.key)) return {field:'key', text:'Ключ «' + d.key + '» уже используется в организации'};
    const p = {id:newId('prj'), orgId, name, key:d.key, status:'Active'};
    const t = {id:newId('team'), projectId:p.id, name, status:'Active', first:true, defaultAreaId:null};
    const a = {id:newId('area'), projectId:p.id, parentId:null, name, ownerTeamId:t.id};

  renameProject(d){

    closeDialog();
    notice('Проект переименован.');
    render();
  },
  deactivateProject(d){
    const p = getPrj(d.id);
    p.status = 'Deactivated';
    closeDialog('tab-1');
    if (!fallback(true)) notice('Проект «' + p.name + '» деактивирован.');

  newTeam(d){

    if (teamsOf(prjId).some((t) => same(t.name, name))) return {field:'name', text:'Команда с таким названием уже есть в проекте'};
    const root = rootOf(prjId);

    const a = {id:newId('area'), projectId:prjId, parentId:root.id, name, ownerTeamId:t.id};

  renameTeam(d){

    if (teamsOf(t.projectId).some((x) => x.id !== t.id && same(x.name, name))) return {field:'name', text:'Команда с таким названием уже есть в проекте'};

  defaultArea(d){

  deleteTeam(d){

    const f = firstTeam(t.projectId);
    S.db.areas.forEach((a) => { if (a.ownerTeamId === t.id) a.ownerTeamId = f.id; });   /* BR-M1-18: its areas pass to the first team */
    t.status = 'Deleted'; t.defaultAreaId = null;

    closeDialog(onItsPage ? 'tl-' + f.id : 'ta-' + f.id);

  },
  newArea(d){
    const parent = getArea(d.id), name = d.name.trim();

    const a = {id:newId('area'), projectId:parent.projectId, parentId:parent.id, name, ownerTeamId:d.owner || null};
    S.db.areas.push(a);
    let up = parent; while (up) { S.tree.expanded[up.id] = true; up = getArea(up.parentId); }
    S.tree.selected = S.tree.focused = a.id;   /* § 11.7 */
    closeDialog('row-' + a.id);
    notice('Область «' + name + '» создана.');
    render();
  },
  renameArea(d){
    const a = getArea(d.id), name = d.name.trim();

    render();

  moveArea(d){

    if (childrenOf(target.id).some((x) => same(x.name, a.name))) return {field:'target', text:AREA_TAKEN};

    let x = getArea(target.parentId); while (x) { S.tree.expanded[x.id] = true; x = getArea(x.parentId); }
    S.tree.selected = S.tree.focused = a.id;
    closeDialog('row-' + a.id);

  areaOwner(d){

function submitDialog(){
  const d = S.dialog; if (!d || d.busy) return;
  const errors = {};
  if ('name' in d && !['deactivateOrg','deactivateProject','deleteTeam','deleteArea','defaultArea','areaOwner','moveArea'].includes(d.type)) { const e = checkName(d.name); if (e) errors.name = e; }
  if (d.type === 'newProject') { const e = checkKey(d.key); if (e) errors.key = e; }
  if (d.type === 'moveArea' && !d.target) return;
  d.errors = errors; d.top = null;
  if (Object.keys(errors).length) { S.pendingFocus = 'dlg-' + Object.keys(errors)[0]; render(); return; }
  d.busy = true; d.listOpen = false; render();
  setTimeout(() => {
    if (S.dialog !== d) return;
    d.busy = false;
    const res = SERVER[d.type](d);
    if (res && res.field) { d.errors = {[res.field]:res.text}; S.pendingFocus = 'dlg-' + res.field; render(); }
    else if (res && res.top) { d.top = res.top; S.pendingFocus = CONFIRMS.includes(d.type) ? 'dlg-cancel' : FIRST[d.type] || 'dlg-name'; render(); }
  }, 600);
}

/* ---------- notices (design.md § 4.5) ---------- */
let snackTimer = null;
function notice(text, kind){ S.snack = {text, kind}; clearTimeout(snackTimer); snackTimer = setTimeout(() => { S.snack = null; render(); }, 6000); }
function snackHtml(){

}

/* ---------- render ---------- */
function render(){
  const ae = document.activeElement;
  const fkEl = ae && ae.closest ? ae.closest('[data-fk]') : null;
  const prevFk = fkEl ? fkEl.dataset.fk : null;
  const sel = ae && ae.tagName === 'INPUT' ? [ae.selectionStart, ae.selectionEnd] : null;
  ROUTE = resolveRoute();
  if (ROUTE.name !== 'areas') S.tree.prj = null;   /* the expanded set lasts for the page visit (§ 11.2) */
  const pg = pageFor(ROUTE);
  pg.trail = pg.noHeader ? null : deriveTrail(ROUTE);   /* a full-page frame mounts no PageHeader, so it has no trail */
  document.getElementById('app').innerHTML = shell(ROUTE, pg);
  document.title = pg.title + ' — Mustask';
  fitCommands();
  document.getElementById('layer').innerHTML = menuHtml() + dialogHtml() + snackHtml();
  positionMenu();
  protoPanel();
  hideTip();
  const want = S.pendingFocus; S.pendingFocus = null;
  if (S.focusMain) { S.focusMain = false; const m = document.getElementById('main-content'); if (m) m.focus(); return; }
  if (want === 'menu-first') { focusMenuItem(); return; }
  const target = want ? document.querySelector('[data-fk="' + want + '"]') : prevFk ? document.querySelector('[data-fk="' + prevFk + '"]') : null;
  if (target && !target.disabled) {
    target.focus({preventScroll:true});
    if (want && S.dialog && S.dialog.selectAll && target.select) { target.select(); S.dialog.selectAll = false; }
    else if (!want && sel && target.setSelectionRange) { try { target.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } }
  }
}
function focusMenuItem(){
  const m = document.getElementById('open-menu'); if (!m) return;
  const items = Array.from(m.querySelectorAll('.mi:not(:disabled)'));
  const cur = items.find((x) => x.getAttribute('aria-checked') === 'true') || items[0];
  if (cur) cur.focus();
}
function openMenu(id, fk){ S.menu = {id, fk}; S.pendingFocus = 'menu-first'; render(); }
function closeMenu(returnFocus){ if (!S.menu) return; const fk = S.menu.fk; S.menu = null; if (returnFocus) S.pendingFocus = fk; render(); }

/* ---------- actions ---------- */
let lastMenuFk = null;
const ACT = {
  go(arg){ go(arg); },
  skip(){ const m = document.getElementById('main-content'); if (m) m.focus(); },
  overlay(){ S.overlay = !S.overlay; S.pendingFocus = S.overlay ? 'nav-home' : 'menu-btn'; render(); },
  closeOverlay(){ S.overlay = false; S.pendingFocus = 'menu-btn'; render(); },
  toggleNav(){ const nowRail = document.querySelector('.mainnav.rail') !== null; S.kept = nowRail ? 'expanded' : 'rail'; storeSet(NAV_KEY, S.kept); S.pendingFocus = 'nav-toggle'; render(); },
  openMenu(arg, el){ if (S.menu && S.menu.id === arg) { closeMenu(true); return; } openMenu(arg, el.dataset.fk); },
  /* mod-015 BR-18 and design.md § 2.2: a choice at a level the address carries opens the entry's landing page */
  swChoose(arg){
    const [level, id] = arg.split(':');
    if (level === 'org') S.ctx = {org:id, prj:null, team:null};
    if (level === 'prj') { S.ctx.prj = id; S.ctx.team = null; }
    if (level === 'team') S.ctx.team = id;
    fallback(false);   /* the levels below take their first entries */
    const r = ROUTE, rank = {org:1, prj:2, team:3};
    if (r && r.carries && rank[level] <= rank[r.carries]) {
      const e = findEntry(r.entry);
      go(e && entryVisible(e) ? e.landing(S.ctx) : '/home');
      return;
    }
    S.pendingFocus = 'sw-' + level;
    render();
  },
  swRetry(){ const lv = S.sw.startsWith('prj') ? 'sw-prj' : S.sw.startsWith('team') ? 'sw-team' : 'sw-org'; S.sw = 'ready'; S.pendingFocus = lv; render(); },
  dialog(arg, el){ const [type, id] = arg.split(':'); openDialog(type, id, el && el.closest && el.closest('#open-menu') ? lastMenuFk : el && el.dataset ? el.dataset.fk : null); },
  newArea(arg, el){
    const id = arg === 'root' ? rootOf(S.ctx.prj).id : arg === 'selected' ? S.tree.selected : arg;
    if (id) openDialog('newArea', id, el && el.closest && el.closest('#open-menu') ? lastMenuFk : el && el.dataset ? el.dataset.fk : null);
  },
  dlgClose(){ if (!S.dialog || S.dialog.busy) return; closeDialog(); render(); },
  dlgBackdrop(){ ACT.dlgClose(); },
  moveToggle(){ const d = S.dialog; d.listOpen = !d.listOpen; d.active = -1; S.pendingFocus = 'dlg-target'; render(); },
  moveChoose(id){ const d = S.dialog, o = moveOptions(d).find((x) => x.id === id); d.target = id; d.query = o.path; d.listOpen = false; d.errors = {}; S.pendingFocus = 'dlg-target'; render(); },
  /* § 5.5: restore sends at once; the row's button spins */
  restore(arg){
    const [kind, id] = arg.split(':');
    if (S.restoring) return;
    S.restoring = id; render();
    setTimeout(() => {
      S.restoring = null;
      const x = kind === 'org' ? getOrg(id) : getPrj(id);
      const btns = Array.from(document.querySelectorAll('[data-fk^="rs-"]')), i = btns.findIndex((b) => b.dataset.fk === 'rs-' + id);
      const next = btns[i + 1] || btns[i - 1];   /* focus: the next row's «Восстановить», else the tab (design.md § 5.5) */

      x.status = 'Active';

      notice(kind === 'org' ? 'Организация «' + x.name + '» восстановлена.' : 'Проект «' + x.name + '» восстановлен.');
      S.pendingFocus = next ? next.dataset.fk : 'tab-1';

    }, 600);
  },
  treeToggle(id){ S.tree.expanded[id] = !S.tree.expanded[id]; S.tree.focused = id; S.pendingFocus = 'row-' + id; render(); },
  treeSelect(id){ S.tree.selected = S.tree.focused = id; S.pendingFocus = 'row-' + id; render(); },
  retry(){ S.lists = 'data'; render(); },
  proto(arg){ notice(arg, 'proto'); render(); },
  protoPanel(){ S.panelOpen = !S.panelOpen; S.pendingFocus = S.panelOpen ? 'pp-close' : 'pp-open'; render(); },
  protoReset(){ S.db = dataset(S.datasetKind); S.tree.prj = null; fallback(false); render(); },
  protoForget(){ storeSet(CTX_KEY, null); S.ctx = {org:null, prj:null, team:null}; fallback(false); render(); },
  /* US-8: a remembered selection that is gone falls back on a reload, with mod-015's notice */
  protoReload(kind){

    S.ctx = {org:'org-alfa', prj:'prj-prm', team:'team-plat'}; remember();
    if (kind === 'team') { S.db.areas.forEach((a) => { if (a.ownerTeamId === 'team-plat') a.ownerTeamId = 'team-prm'; }); getTeam('team-plat').status = 'Deleted'; }

const INPUT = {
  dlg(arg, v){ const d = S.dialog; d[arg] = v; delete d.errors[arg]; render(); },
  dlgValue(arg, v){ const d = S.dialog; d.value = v; d.errors = {}; d.top = null; render(); },
  moveQuery(arg, v){
    const d = S.dialog; d.query = v; d.errors = {}; d.listOpen = true; d.active = -1;

  proto(key, v){

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const inMenu = e.target.closest('#open-menu');
  const actEl = e.target.closest('[data-act]');
  if (S.menu && !inMenu && !(actEl && actEl.dataset.act === 'openMenu')) { S.menu = null; if (!actEl) { render(); return; } }
  const plain = e.target.closest('a[href]:not([data-act])');
  if (plain) {
    if (plain.dataset.menulink) { S.menu = null; S.focusMain = true; }
    if (plain.closest('.overlay')) { S.overlay = false; S.focusMain = true; }
    if (plain.getAttribute('href') === location.hash) { e.preventDefault(); render(); }
    return;
  }
  if (!actEl || actEl.disabled) return;
  const act = actEl.dataset.act;
  if (!ACT[act]) return;
  e.preventDefault();
  if (inMenu && act !== 'openMenu') { lastMenuFk = S.menu && S.menu.fk; S.menu = null; S.pendingFocus = lastMenuFk; }
  ACT[act](actEl.dataset.arg, actEl, e);
});
document.addEventListener('input', (e) => { const t = e.target.closest('[data-input]'); if (!t) return; const fn = INPUT[t.dataset.input]; if (fn) fn(t.dataset.arg, t.value, t); });
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); submitDialog(); });
/* § 11.6: the WAI-ARIA treegrid keyboard model, row focus */
function treeKey(e, tr){
  const id = tr.dataset.row, a = getArea(id), kids = childrenOf(id), T = S.tree;
  const rows = Array.from(document.querySelectorAll('[role=treegrid] tbody tr[data-row]'));
  const i = rows.indexOf(tr);
  const to = (rid) => { e.preventDefault(); T.focused = rid; S.pendingFocus = 'row-' + rid; render(); return true; };
  if (e.key === 'ArrowDown') return rows[i + 1] ? to(rows[i + 1].dataset.row) : (e.preventDefault(), true);
  if (e.key === 'ArrowUp') return rows[i - 1] ? to(rows[i - 1].dataset.row) : (e.preventDefault(), true);
  if (e.key === 'Home') return to(rows[0].dataset.row);
  if (e.key === 'End') return to(rows[rows.length - 1].dataset.row);
  if (e.key === 'ArrowRight') { if (kids.length && !T.expanded[id]) { T.expanded[id] = true; return to(id); } if (kids.length) return to(kids[0].id); e.preventDefault(); return true; }
  if (e.key === 'ArrowLeft') { if (kids.length && T.expanded[id]) { T.expanded[id] = false; return to(id); } if (a.parentId) return to(a.parentId); e.preventDefault(); return true; }
  if (e.key === 'Enter' || e.key === ' ') { T.selected = id; return to(id); }
  if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') { e.preventDefault(); openMenu('areaAct:' + id, 'ra-' + id); return true; }
  return false;
}
function comboKey(e){
  const d = S.dialog; if (!d || d.type !== 'moveArea') return false;
  const opts = filteredMoveOptions(d);
  if (e.key === 'ArrowDown') { e.preventDefault(); d.listOpen = true; d.active = Math.min(opts.length - 1, d.active + 1); render(); return true; }
  if (e.key === 'ArrowUp') { e.preventDefault(); d.listOpen = true; d.active = Math.max(0, d.active - 1); render(); return true; }
  if (e.key === 'Enter' && d.listOpen && opts[d.active]) { e.preventDefault(); ACT.moveChoose(opts[d.active].id); return true; }
  if (e.key === 'Escape' && d.listOpen) { e.preventDefault(); d.listOpen = false; render(); return true; }
  return false;
}
document.addEventListener('keydown', (e) => {
  const m = document.getElementById('open-menu');
  if (m && S.menu) {
    const items = Array.from(m.querySelectorAll('.mi:not(:disabled)'));
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); (items[(i + 1) % items.length] || items[0]).focus(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); (items[(i - 1 + items.length) % items.length] || items[0]).focus(); return; }
    if (e.key === 'Home') { e.preventDefault(); if (items[0]) items[0].focus(); return; }
    if (e.key === 'End') { e.preventDefault(); if (items.length) items[items.length - 1].focus(); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return; }
    if (e.key === 'Tab') { closeMenu(false); return; }
  }
  if (e.target.id === 'f-dlg-target' && comboKey(e)) return;
  const tr = e.target.matches && e.target.matches('tr[data-row]') ? e.target : null;
  if (tr && treeKey(e, tr)) return;
  if (e.key === 'ArrowDown' && e.target.getAttribute && e.target.getAttribute('aria-haspopup') === 'menu' && !S.menu) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') {
    if (S.dialog) { e.preventDefault(); ACT.dlgClose(); return; }
    if (S.overlay) { e.preventDefault(); ACT.closeOverlay(); return; }
  }
  if (e.key === 'Tab') {
    const box = S.dialog ? document.getElementById('dialog') : S.overlay ? document.getElementById('overlay-nav') : null;
    if (box) {
      const f = Array.from(box.querySelectorAll('a[href],button:not(:disabled):not([tabindex="-1"]),input:not(:disabled),select:not(:disabled)'));
      if (f.length) {
        const first = f[0], last = f[f.length - 1];
        if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute && e.target.getAttribute('role') === 'tab') {
    const tabs = Array.from(e.target.parentNode.querySelectorAll('[role=tab]'));
    const i = tabs.indexOf(e.target);
    tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length].focus();
  }
});
/* roving tabindex: the focused row and its «Действия» are the treegrid's only tab stops */
document.addEventListener('focusin', (e) => {
  const tr = e.target.closest && e.target.closest('tr[data-row]');
  if (tr) {
    S.tree.focused = tr.dataset.row;
    document.querySelectorAll('[role=treegrid] tr[data-row]').forEach((r) => { const on = r === tr; r.tabIndex = on ? 0 : -1; const b = r.querySelector('[data-rowact]'); if (b) b.tabIndex = on ? 0 : -1; });
  }
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t && t.matches(':focus-visible')) showTip(t); else hideTip();
});
let tipTimer = null;
function showTip(el){
  const tip = document.getElementById('tip');
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  const r = el.getBoundingClientRect();
  let left, top;
  if (el.dataset.tipPos === 'right') { left = r.right + 8; top = r.top + r.height / 2 - tip.offsetHeight / 2; }
  else { left = r.left + r.width / 2 - tip.offsetWidth / 2; top = r.bottom + 6; }
  left = Math.max(4, Math.min(left, window.innerWidth - tip.offsetWidth - 4));
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip(){ clearTimeout(tipTimer); const t = document.getElementById('tip'); if (t) t.style.display = 'none'; }
document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (!t) return; clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(t), 500); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });
let lastBand = null;
window.addEventListener('resize', () => {
  const band = window.innerWidth < 1024 ? 'n' : window.innerWidth < 1280 ? 'm' : 'w';
  if (band !== lastBand) { lastBand = band; if (band !== 'n') S.overlay = false; render(); }
  else { fitCommands(); positionMenu(); }
});
window.addEventListener('hashchange', () => { S.menu = null; S.overlay = false; render(); window.scrollTo(0, 0); });
lastBand = window.innerWidth < 1024 ? 'n' : window.innerWidth < 1280 ? 'm' : 'w';
if (!location.hash) history.replaceState(null, '', '#/home');
/* optional start state after "?", e.g. #/organizations?panel=0&user=nocreate&dataset=noOrgs&lists=loading&switcher=prjFailed&seed=fail */
(function start(){
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  if (q.get('panel') === '0') S.panelOpen = false;
  if (q.get('user') === 'nocreate') S.canCreate = false;
  if (q.get('dataset')) { S.datasetKind = q.get('dataset'); S.db = dataset(S.datasetKind); }
  if (q.get('lists')) S.lists = q.get('lists');
  if (q.get('switcher')) S.sw = q.get('switcher');
  if (q.get('seed') === 'fail') S.seedFails = true;
  const rem = readRemembered();
  if (rem) S.ctx = rem;
  const r = resolveRoute();   /* design.md § 3.4: the address first, then the remembered selection, then the first entries */
  fallback(!!rem && !(r.ctx && r.name !== 'notFound'));
  render();
  if (q.get('dialog')) { const [type, id] = q.get('dialog').split(':'); openDialog(type, id, null); }
  if (q.get('open')) { const [id, fk] = q.get('open').split('|'); openMenu(id, fk || id); }
})();
</script>

<style>

  .menu [role=menuitem] { padding:6px 16px; cursor:pointer; } .menu [role=menuitem]:hover, .menu [role=menuitem]:focus { background:var(--hover); outline:none; }

<script>
(function () {
try {
var $ = function (s, r) { return (r || document).querySelector(s); };
var ed = $('#ed'), tb = $('#tb'), card = $('#card'), noticeEl = $('#notice'), layer = $('#layer');
var T = {
  fmt: 'Можно вставить только изображения PNG, JPEG, GIF или WebP.',
  big20: 'Файл больше 20 МБ. Уменьшите изображение в другой программе и вставьте снова.',
  anim: 'Анимация больше 5 МБ. Уменьшите её в другой программе и вставьте снова.',
  n50: 'В описании может быть не больше 50 изображений.',
  fail: 'Не удалось загрузить изображение. Попробуйте ещё раз.',
  foreign: 'Изображение с другого сайта не вставлено. Сохраните его как файл и вставьте снова.',
  hint: 'Enter — открыть в полном размере, Delete — удалить, Shift+F10 — меню.'
};
var state = { mode: 'edit', pending: 0, waiting: false, undo: [], busy: false, run: 0 };
var MB = 1048576;

/* ---------- demo pictures (canvas) ---------- */
function pic(w, h, label, hue) {
  var c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d');
  var gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, 'hsl(' + hue + ',60%,88%)'); gr.addColorStop(1, 'hsl(' + (hue + 40) + ',55%,70%)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, w, Math.min(40, h / 6));
  g.fillStyle = '#333'; for (var i = 0; i < 6; i++) { g.fillRect(24, 70 + i * 28, w * (0.3 + (i * 37 % 50) / 100), 10); }
  g.fillStyle = '#111'; g.font = 'bold ' + Math.max(16, Math.round(h / 9)) + 'px Arial'; g.fillText(label + '  ' + w + ' × ' + h, 24, h - 24);
  return c.toDataURL('image/png');
}
var PICS = { shot: pic(640, 360, 'Скриншот', 200), wide: pic(3000, 800, 'Широкий снимок', 30), photo: pic(1200, 900, 'Фото', 110), small: pic(320, 200, 'Малое', 280), reduced: pic(1600, 1200, 'Уменьшенное', 110) };

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function mbs(x) { return x.toFixed(1).replace('.', ',') + ' МБ'; }
function blocks() { return Array.prototype.slice.call(ed.children); }
function imgCount() { return ed.querySelectorAll('.imgblock,.slot').length; }
function altOf(name) { return name ? name.replace(/\.[^.]+$/, '') : 'Изображение'; }

/* ---------- notices ---------- */
var noticeTimer;
function notify(list) {
  noticeEl.textContent = '';
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(function () { list.forEach(function (t) { var d = document.createElement('div'); d.textContent = t; noticeEl.appendChild(d); }); }, 30);
}
function clearNotice() { clearTimeout(noticeTimer); noticeEl.textContent = ''; }
ed.addEventListener('input', clearNotice);
card.addEventListener('focusout', function (e) { if (!card.contains(e.relatedTarget)) clearNotice(); });

/* ---------- undo (image operations only; sketch) ---------- */
function snap() { state.undo.push(ed.innerHTML); state.imgOp = true; }
function undo() { if (!state.undo.length) return; ed.innerHTML = state.undo.pop(); clearNotice(); sync(); }

/* ---------- toolbar ---------- */
var BTN = [
  { id: 'undo', t: '↶', n: 'Отменить', tip: 'Отменить (Ctrl+Z)' }, { sep: 1 },
  { id: 'b', t: 'B', n: 'Полужирный', tip: 'Полужирный (Ctrl+B)' }, { id: 'i', t: 'I', n: 'Курсив', tip: 'Курсив (Ctrl+I)' },
  { id: 'ul', t: '•≡', n: 'Маркированный список', tip: 'Маркированный список' }, { sep: 1 },
  { id: 'emoji', t: '☺', n: 'Эмодзи', tip: 'Эмодзи' },
  { id: 'image', t: '🖼', n: 'Изображение', tip: 'Вставить изображение' }
];
function buildToolbar() {
  tb.innerHTML = '';
  BTN.forEach(function (b) {
    if (b.sep) { var s = document.createElement('span'); s.className = 'sep'; tb.appendChild(s); return; }
    if (b.id === 'image' && state.mode === 'ro') return; /* no control without the right to edit */
    var e = document.createElement('button'); e.type = 'button'; e.textContent = b.t; e.setAttribute('aria-label', b.n); e.title = b.tip; e.dataset.id = b.id; e.tabIndex = -1;
    e.disabled = state.mode !== 'edit'; tb.appendChild(e);
  });
  var f = tb.querySelector('button:not(:disabled)'); if (f) f.tabIndex = 0;
}
tb.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
tb.addEventListener('keydown', function (e) {
  var bs = Array.prototype.slice.call(tb.querySelectorAll('button:not(:disabled)')), i = bs.indexOf(document.activeElement);
  if (i < 0) return; var n = -1;
  if (e.key === 'ArrowRight') n = (i + 1) % bs.length; else if (e.key === 'ArrowLeft') n = (i - 1 + bs.length) % bs.length; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = bs.length - 1;
  if (n >= 0) { e.preventDefault(); bs.forEach(function (b) { b.tabIndex = -1; }); bs[n].tabIndex = 0; bs[n].focus(); }
});
tb.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || b.disabled) return; var id = b.dataset.id;
  if (id === 'image') { $('#file').click(); return; }
  if (id === 'undo') { if (state.undo.length) undo(); else document.execCommand('undo'); return; }
  ed.focus();
  if (id === 'b') document.execCommand('bold'); if (id === 'i') document.execCommand('italic'); if (id === 'ul') document.execCommand('insertUnorderedList'); if (id === 'emoji') document.execCommand('insertText', false, '🙂');
});

/* ---------- caret anchor ---------- */
var saved = null;
document.addEventListener('selectionchange', function () { var s = getSelection(); if (s.rangeCount && ed.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange(); });
function anchorAfter() {
  /* the block after which an insert lands; a paragraph is split at the caret; a heading is not split */
  var node = saved ? saved.startContainer : null;
  if (!node || !ed.contains(node)) return blocks().length ? blocks()[blocks().length - 1] : null;
  var top = node.nodeType === 1 && node === ed ? null : node; while (top && top.parentNode !== ed) top = top.parentNode;
  if (!top) return blocks().length ? blocks()[blocks().length - 1] : null;
  if (top.tagName === 'P' && saved.startContainer.nodeType === 3) {
    var r = document.createRange(); r.setStart(saved.startContainer, saved.startOffset); r.setEndAfter(top.lastChild);
    if (r.toString().length > 0 && saved.startOffset > 0 || (saved.startOffset === 0 && top.firstChild !== saved.startContainer)) {
      var rest = document.createElement('p'); rest.appendChild(r.extractContents()); if (rest.textContent) top.parentNode.insertBefore(rest, top.nextSibling);
    }
  }
  return top;
}

/* ---------- insert flow ---------- */
function handleFiles(entries) {
  var notes = [], accepted = [], total = imgCount();
  entries.forEach(function (f) {
    var ok = /^image\/(png|jpeg|gif|webp)$/.test(f.type);
    if (!ok) { if (notes.indexOf(T.fmt) < 0) notes.push(T.fmt); return; }
    if (f.size > 20 * MB) { if (notes.indexOf(T.big20) < 0) notes.push(T.big20); return; }
    if (f.animated && f.size > 5 * MB) { if (notes.indexOf(T.anim) < 0) notes.push(T.anim); return; }
    if (total + accepted.length >= 50) { if (notes.indexOf(T.n50) < 0) notes.push(T.n50); return; }
    accepted.push(f);
  });
  if (notes.length) notify(notes);
  if (!accepted.length) return;
  snap();
  var anchor = anchorAfter(), prev = anchor, queue = [];
  accepted.forEach(function (f) {
    var el = document.createElement('div');
    if (f.size > 5 * MB) { el.className = 'slot'; el.contentEditable = 'false'; queue.push({ f: f, slot: el }); }
    else { makePh(el); }
    if (prev) prev.parentNode.insertBefore(el, prev.nextSibling); else ed.appendChild(el);
    prev = el;
    if (f.size <= 5 * MB) upload(el, f, f.url || PICS.small, false);
  });
  ensureTrailing(); sync();
  runQueue(queue);
}
function makePh(el) { el.className = 'imgblock ph-wrap'; el.contentEditable = 'false'; el.innerHTML = '<div class="ph" role="status" aria-busy="true" aria-label="Загрузка изображения…"><span>Загрузка изображения…</span><span class="lin"><i></i></span></div>'; }
function ensureTrailing() { /* the real editor keeps a gap cursor; the sketch keeps one empty paragraph after a final image */
  var l = ed.lastElementChild; if (l && (l.classList.contains('imgblock') || l.classList.contains('slot'))) { var p = document.createElement('p'); p.innerHTML = '<br>'; ed.appendChild(p); }
}
function upload(el, f, url, retry) {
  state.pending++; sync();
  setTimeout(function () {
    state.pending--;
    if (!el.isConnected) { sync(); return; }
    if (f.fail === 'net') { el.remove(); notify([T.fail]); sync(); return; }
    fillImg(el, url, altOf(f.name), false); notify(['Изображение вставлено.']); sync(); checkWaiting();
  }, f.fail === 'net' ? 900 : 1400);
}
function fillImg(el, url, alt, slow) {
  el.className = 'imgblock' + (slow ? ' loading' : ''); el.contentEditable = 'false'; el.dataset.alt = alt; el.dataset.ref = Math.random().toString(16).slice(2, 10);
  el.innerHTML = '<img alt="">'; var img = el.firstChild; img.alt = alt;
  el.setAttribute('role', state.mode === 'ro' ? 'button' : 'img'); el.tabIndex = state.mode === 'ro' ? 0 : -1;
  el.setAttribute('aria-label', (state.mode === 'ro' ? 'Открыть в полном размере: ' : '') + alt);
  el.insertAdjacentHTML('beforeend', '<span class="tools"><button type="button" tabindex="-1" aria-label="Открыть в полном размере" title="Открыть в полном размере">⤢</button><button type="button" tabindex="-1" aria-label="Удалить изображение" title="Удалить изображение">✕</button></span>');
  var done = function () { el.classList.remove('loading'); };
  img.onload = done; img.onerror = function () { unavailable(el); };
  if (slow) setTimeout(function () { img.src = url; }, 1800); else img.src = url;
}
function unavailable(el) {
  var alt = el.dataset.alt; el.className = 'imgblock'; el.dataset.dead = '1';
  el.innerHTML = '<div class="unavail" role="img" aria-label="Изображение недоступно">🖼 <span>Изображение недоступно</span></div>';
}

/* ---------- the offer to reduce (US-6) ---------- */
function runQueue(queue) {
  var i = 0, total = queue.length;
  (function next() {
    if (i >= total) { return; }
    var q = queue[i++];
    offer(q.f, i, total, function (res) {
      if (res === 'insert') { makePh(q.slot); q.slot.className = 'imgblock ph-wrap'; upload(q.slot, { name: q.f.name, size: 1 }, q.f.preview || q.f.url || PICS.reduced, false); }
      else { q.slot.remove(); sync(); }
      setTimeout(next, 0);
    });
  })();
}
function offer(f, n, total, done) {
  var runId = ++state.run, tmr;
  var queueCap = total > 1 ? 'Файл ' + n + ' из ' + total + ' · ' : '';
  var d = dialog({
    title: 'Изображение больше 5 МБ',
    onEsc: function () { cancel(); },
    render: function (ui) { offerView(ui); }
  });
  function cancel() { clearTimeout(tmr); runId = -1; d.close(); done('cancel'); }
  function offerView(ui) {
    ui.body('<div class="cap">' + esc(queueCap + f.name) + '</div><p>Размер файла — ' + mbs(f.size / MB) + ', а в описание можно вставить изображение не больше 5 МБ. Система может уменьшить его: файл станет легче, изображение может стать немного менее чётким.</p>');
    ui.acts([{ l: 'Отмена', f: cancel }, { l: 'Уменьшить', pri: 1, f: reduce }]);
  }
  function reduce() {
    var me = runId;
    d.body('<div class="cap">' + esc(queueCap + f.name) + '</div><p role="status">Уменьшаем изображение…</p><div class="lin2"><i></i></div>');
    d.acts([{ l: 'Отмена', f: cancel }], true);
    tmr = setTimeout(function () {
      if (me !== runId) return;
      if (f.reduce === 'fail' && !f.retried) { f.retried = 1; return failView(); }
      if (f.reduce === 'cannot') return cannotView();
      var a = f.after || { mb: 4.6, w: Math.round(f.w * 0.9), h: Math.round(f.h * 0.9) };
      d.body('<div class="cap">' + esc(queueCap + f.name) + '</div><div class="lines" id="res"><div>Было: ' + mbs(f.size / MB) + ', ' + (f.w || '—') + ' × ' + (f.h || '—') + '</div><div>Стало: ' + mbs(a.mb) + ', ' + a.w + ' × ' + a.h + '</div></div><img class="prev" alt="Уменьшённое изображение" src="' + (f.url || PICS.reduced) + '">');
      d.acts([{ l: 'Отмена', f: cancel }, { l: 'Вставить', pri: 1, f: function () { d.close(); done('insert'); } }]);
      d.root.querySelector('.prev').onerror = function () { this.outerHTML = '<div class="unavail">🖼 <span>Изображение недоступно</span></div>'; d.root.querySelector('.btn.pri').setAttribute('aria-disabled', 'true'); };
    }, 1800);
  }
  function failView() {
    d.body('<div class="cap">' + esc(queueCap + f.name) + '</div><div class="alert e" role="alert">Не удалось уменьшить изображение. Попробуйте ещё раз.</div>');
    d.acts([{ l: 'Отмена', f: cancel }, { l: 'Повторить', pri: 1, f: reduce }]);
  }
  function cannotView() {
    d.body('<div class="cap">' + esc(queueCap + f.name) + '</div><div class="alert w" role="alert">Не удалось уменьшить изображение до 5 МБ без сильной потери качества. Уменьшите его в другой программе и вставьте снова.</div>');
    d.acts([{ l: 'Закрыть', pri: 1, f: cancel }]);

}

/* ---------- dialog (MUI Dialog stand-in) ---------- */
function dialog(o) {

  scrim.innerHTML = '<div class="dlg' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="dt"><h3 id="dt"></h3><div class="body"></div><div class="acts"></div></div>';
  var root = scrim.firstChild; root.querySelector('h3').textContent = o.title; layer.appendChild(scrim);
  var self = {
    root: root,
    body: function (h) { root.querySelector('.body').innerHTML = h; },
    acts: function (a, keep) {
      var box = root.querySelector('.acts'); box.innerHTML = '';
      a.forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (x.pri ? ' pri' : ''); b.textContent = x.l; b.onclick = function () { if (b.getAttribute('aria-disabled') !== 'true') x.f(); }; box.appendChild(b); });
      var p = box.querySelector('.pri') || box.querySelector('button'); if (p && !keep) p.focus(); else if (p) p.focus();
    },
    close: function () { scrim.remove(); if (o.returnFocus) o.returnFocus(); else if (opener && opener.focus && opener.isConnected) opener.focus(); else ed.focus(); }
  };
  scrim.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.stopPropagation(); o.onEsc ? o.onEsc() : self.close(); }
    if (e.key === 'Tab') { var f = root.querySelectorAll('button,[tabindex="0"]'); if (!f.length) return; var first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  });
  scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) { o.onEsc ? o.onEsc() : self.close(); } });
  o.render && o.render(self);
  return self;
}

/* ---------- full-size view ---------- */
function openFull(block) {
  var alt = block.dataset.alt, src = block.querySelector('img') && block.querySelector('img').src;
  var d = dialog({ title: 'Просмотр изображения', wide: true, returnFocus: function () { selectBlock(block, true); } });
  d.body('<div class="cap">' + esc(alt) + '</div><div class="full" tabindex="0" aria-label="Изображение, полный размер"><img alt="' + esc(alt) + '" src="' + src + '"></div>');
  d.acts([{ l: 'Закрыть', pri: 1, f: function () { d.close(); } }]);
}

/* ---------- selection, keys, menu ---------- */
function selectBlock(b, quiet) {
  clearSel(); b.classList.add('sel'); b.focus();
  if (!quiet && state.kb) notify([T.hint]);
}
function clearSel() { ed.querySelectorAll('.imgblock.sel').forEach(function (x) { x.classList.remove('sel'); }); }
function isImg(n) { return n && n.classList && n.classList.contains('imgblock') && !n.querySelector('.ph'); }
function removeBlock(b) {
  snap(); var next = b.nextElementSibling || b.previousElementSibling; b.remove(); sync();
  if (next && next.tagName === 'P') { var r = document.createRange(); r.setStart(next, 0); r.collapse(true); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  ed.focus(); notify(['Изображение удалено.']);
}
ed.addEventListener('click', function (e) {
  var b = e.target.closest('.imgblock'); if (!b) { clearSel(); return; }
  state.kb = false;
  if (e.target.closest('.tools button')) { var which = e.target.closest('button').getAttribute('aria-label'); if (which === 'Удалить изображение') removeBlock(b); else openFull(b); return; }
  if (state.mode === 'ro') { openFull(b); return; }
  if (b.querySelector('.ph') || b.dataset.dead) { selectBlock(b, true); return; }
  selectBlock(b, true);
});
ed.addEventListener('dblclick', function (e) { var b = e.target.closest('.imgblock'); if (b && isImg(b) && !b.dataset.dead) openFull(b); });
ed.addEventListener('keydown', function (e) {
  var b = e.target.closest && e.target.closest('.imgblock');
  if (b && ed.contains(b) && document.activeElement === b) {
    state.kb = true;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!b.dataset.dead && !b.querySelector('.ph')) openFull(b); return; }
    if (state.mode !== 'edit') return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeBlock(b); return; }
    if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') { e.preventDefault(); imgMenu(b); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault(); var fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight', nx = fwd ? b.nextElementSibling : b.previousElementSibling;
      if (!nx) return; if (nx.classList.contains('imgblock')) { selectBlock(nx); } else { clearSel(); var r = document.createRange(); r.selectNodeContents(nx); r.collapse(fwd); var s = getSelection(); s.removeAllRanges(); s.addRange(r); ed.focus(); }
      return;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { e.preventDefault(); } /* typing never replaces a selected image */
    return;
  }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey) && state.undo.length && state.imgOp) { e.preventDefault(); undo(); return; }
  if (['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'].indexOf(e.key) >= 0) { /* from a paragraph edge into an adjacent image */
    var s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return; var p = s.anchorNode; while (p && p.parentNode !== ed) p = p.parentNode; if (!p) return;
    var fw = e.key === 'ArrowDown' || e.key === 'ArrowRight', nb = fw ? p.nextElementSibling : p.previousElementSibling;
    if (!nb || !nb.classList.contains('imgblock') || nb.querySelector('.ph')) return;
    var rg = document.createRange(); rg.selectNodeContents(p); rg.collapse(!fw);
    var edge = fw ? (s.anchorOffset === (s.anchorNode.nodeType === 3 ? s.anchorNode.length : 0) || e.key === 'ArrowDown') : (s.anchorOffset === 0 || e.key === 'ArrowUp');
    if (edge) { e.preventDefault(); state.kb = true; selectBlock(nb); }
  }
});
ed.addEventListener('keydown', function (e) { if (e.key === 'Delete' || e.key === 'Backspace') { /* placeholder: remove and stop the upload */ } });
function imgMenu(b) {
  var m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', 'Меню изображения');
  m.innerHTML = '<div role="menuitem" tabindex="0">Открыть в полном размере</div><div role="menuitem" tabindex="-1">Удалить изображение</div>';
  var r = b.getBoundingClientRect(); m.style.left = (r.left + window.scrollX + 16) + 'px'; m.style.top = (r.top + window.scrollY + 16) + 'px'; document.body.appendChild(m);
  var items = m.querySelectorAll('[role=menuitem]'), i = 0; items[0].focus();
  function close() { m.remove(); selectBlock(b, true); }
  m.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); i = (i + 1) % 2; items[i].tabIndex = 0; items[i].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); i = (i + 1) % 2; items[i].focus(); }
    else if (e.key === 'Enter') { e.preventDefault(); m.remove(); if (i === 0) openFull(b); else removeBlock(b); }
  });
  items[0].onclick = function () { m.remove(); openFull(b); }; items[1].onclick = function () { m.remove(); removeBlock(b); };
  m.addEventListener('focusout', function (e) { if (!m.contains(e.relatedTarget)) m.remove(); });
}

/* ---------- paste and drop ---------- */
function toEntries(files) { return Array.prototype.map.call(files, function (f) { return { name: f.name && f.name !== 'image.png' ? f.name : '', type: f.type, size: f.size, url: URL.createObjectURL(f), w: 0, h: 0 }; }); }
ed.addEventListener('paste', function (e) {
  if (state.mode !== 'edit') return;
  var files = e.clipboardData && e.clipboardData.files; if (files && files.length) { e.preventDefault(); handleFiles(toEntries(files)); }
});
['dragenter', 'dragover'].forEach(function (n) { card.addEventListener(n, function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); if (state.mode === 'edit') card.classList.add('drag'); } }); });
card.addEventListener('dragleave', function (e) { if (!card.contains(e.relatedTarget)) card.classList.remove('drag'); });
card.addEventListener('drop', function (e) {
  card.classList.remove('drag'); if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); /* the browser never navigates to the file */
  if (state.mode !== 'edit') return;
  var rg = document.caretRangeFromPoint && document.caretRangeFromPoint(e.clientX, e.clientY); if (rg && ed.contains(rg.startContainer)) saved = rg;
  handleFiles(toEntries(e.dataTransfer.files));
});
$('#file').addEventListener('change', function () { var f = this.files; if (f.length) { handleFiles(toEntries(f)); } this.value = ''; ed.focus(); });

/* ---------- save, modes, sync ---------- */
function sync() {
  var n = ed.querySelectorAll('.imgblock:not(.ph-wrap)').length;
  $('#helper').textContent = state.waiting ? 'Дожидаемся загрузки изображений…' : 'До 100 000 символов';
}
function stored() {
  var c = ed.cloneNode(true); var out = [];
  c.querySelectorAll('.tools,.slot,.ph-wrap,.unavail').forEach(function (x) { x.remove(); });
  Array.prototype.forEach.call(c.children, function (el) {
    if (el.dataset.dead) return; if (el.classList.contains('imgblock')) out.push('<img data-ref="' + el.dataset.ref + '" alt="' + esc(el.dataset.alt) + '">');
    else if (el.textContent.trim()) out.push('<' + el.tagName.toLowerCase() + '>' + esc(el.textContent) + '</' + el.tagName.toLowerCase() + '>');
  });
  return out.join('\n');
}
function doSave() { $('#stored').textContent = 'Сохранённое значение (эскиз; ссылка — непрозрачный идентификатор):\n' + stored(); state.waiting = false; setMode('edit'); $('#saveinfo').textContent = 'Сохранено'; sync(); }
function checkWaiting() { if (state.waiting && state.pending === 0) doSave(); }
$('#save').addEventListener('click', function () {
  $('#saveinfo').textContent = '';
  if (state.pending > 0) { state.waiting = true; setMode('saving'); sync(); return; } /* BR-IM-14: the save waits for running uploads */
  doSave();
});
function setMode(m) {
  state.mode = m; ed.contentEditable = m === 'edit' ? 'true' : 'false'; ed.classList.toggle('off', m !== 'edit'); card.classList.toggle('off', m !== 'edit');
  $('#main').classList.toggle('ro', m === 'ro'); ed.setAttribute('aria-disabled', m === 'saving' ? 'true' : 'false');
  buildToolbar(); $('#save').setAttribute('aria-disabled', m === 'edit' ? 'false' : 'true');
  ed.querySelectorAll('.imgblock').forEach(function (b) { if (b.dataset.alt) { b.setAttribute('role', m === 'ro' ? 'button' : 'img'); b.tabIndex = m === 'ro' ? 0 : -1; b.setAttribute('aria-label', (m === 'ro' ? 'Открыть в полном размере: ' : '') + b.dataset.alt); } });
  document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === m || (m === 'saving' && b.dataset.mode === 'saving') ? 'true' : 'false'); });
}

/* ---------- initial content ---------- */
function seed() {
  ed.innerHTML = '<h3>Шаги воспроизведения</h3><p>Открыть форму заказа и нажать «Сохранить». Ниже — снимок экрана с ошибкой и фото экрана.</p>';
  [[PICS.shot, 'Скриншот ошибки', 1], [PICS.wide, 'Широкий снимок экрана', 1], ['x://unreachable', 'Удалённый снимок', 0]].forEach(function (a) {
    var el = document.createElement('div'); fillImg(el, a[0], a[1], true); ed.appendChild(el);
  });
  var p = document.createElement('p'); p.textContent = 'Ожидаемый результат: форма сохраняется без ошибки.'; ed.appendChild(p);
  state.undo = []; state.pending = 0; state.waiting = false; state.imgOp = false; clearNotice(); $('#stored').textContent = ''; $('#saveinfo').textContent; sync();
}

var SIM = {

  pdf: [{ name: 'отчёт.pdf', type: 'application/pdf', size: MB }], svg: [{ name: 'схема.svg', type: 'image/svg+xml', size: 20000 }],

document.querySelectorAll('[data-sim]').forEach(function (b) {

$('[data-host]').addEventListener('click', function () { var on = $('#main').classList.toggle('host'); this.setAttribute('aria-pressed', on ? 'true' : 'false'); });

setMode('edit'); seed();
document.documentElement.setAttribute('data-ready', '1');
} catch (err) { var f = document.getElementById('fatal'); f.style.display = 'block'; f.textContent = 'Ошибка прототипа: ' + err.message; }
})();

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип: конструктор импорта (mod-024)</title>
<style>
:root{--bg:#F8F8F8;--nav:#EBEBEB;--paper:#fff;--text:#242424;--text2:#616161;--accent:#0F6CBD;--div:#E0E0E0;--head:#F3F3F3;--hover:#F0F0F0;--err:#C42B1C;--warn:#9D5D00;--ok:#107C10;--info:#01579B;--err-bg:#FDEDED;--warn-bg:#FFF4E5;--info-bg:#E5F6FD;--ok-bg:#EAF6EA}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/20px Roboto,"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.proto{background:#FFF8D6;border-bottom:1px solid #E5D58A;padding:6px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px}
.proto b{font-weight:500}
.top{height:48px;background:var(--paper);border-bottom:1px solid var(--div);display:flex;align-items:center;gap:12px;padding:0 16px}
.top .mark{font-weight:500;font-size:16px}.top .sw{color:var(--text2)}
.shell{display:flex;min-height:calc(100vh - 100px)}
.snav{width:220px;flex:none;background:var(--nav);padding:12px 0}
.snav p{margin:0 16px 8px;font-size:16px;font-weight:500}
.snav h4{margin:12px 16px 4px;font-size:12px;color:var(--text2);font-weight:500}
.snav a{display:block;padding:6px 16px 6px 24px;color:var(--text);text-decoration:none}
.snav a.cur{background:#DCDCDC;font-weight:500}
main{flex:1;min-width:0;padding:16px 24px 48px}
.trail{color:var(--text2);font-size:12px;margin-bottom:4px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:24px;line-height:32px;font-weight:500;margin:0;flex:1 1 auto}
.btn{border:1px solid transparent;background:none;border-radius:4px;padding:5px 12px;cursor:pointer;color:var(--text);display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--accent);color:#fff}.btn.p:hover{background:#0C5598}
.btn.o{border-color:#8A8A8A}.btn.d{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{border:0;background:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px}.ib:hover{background:var(--hover)}
.paper{background:var(--paper);border:1px solid var(--div);border-radius:4px}
.fb{display:flex;gap:8px;align-items:center;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.in,.sel{height:32px;border:1px solid #8A8A8A;border-radius:4px;padding:0 8px;background:#fff;max-width:100%}
.in.err,.sel.err{border-color:var(--err)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:var(--head);text-align:left;font-weight:500;padding:6px 12px;white-space:nowrap}
td{padding:6px 12px;border-top:1px solid var(--div);vertical-align:middle}
tr.click:hover td{background:var(--hover)}
.pg{padding:8px 12px;text-align:right;color:var(--text2);border-top:1px solid var(--div)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #BDBDBD;border-radius:12px;padding:0 8px;font-size:12px;line-height:22px;background:#fff;white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.in2{border-color:var(--info);color:var(--info)}.chip.er{border-color:var(--err);color:var(--err)}.chip.wa{border-color:var(--warn);color:var(--warn)}.chip.gr{background:#EBEBEB}
.al{border-radius:4px;padding:10px 14px;margin:0 0 12px;display:flex;gap:10px;align-items:flex-start}
.al.error{background:var(--err-bg);color:#5F2120}.al.warning{background:var(--warn-bg);color:#663C00}.al.info{background:var(--info-bg);color:#014361}
.al strong{display:block}.al .grow{flex:1}
.frame{text-align:center;padding:48px 16px;color:var(--text2)}
.frame h2{color:var(--text);font-size:20px;font-weight:500;margin:8px 0}
.frame .ic{font-size:32px}
.sk{background:linear-gradient(90deg,#eee,#f7f7f7,#eee);height:16px;border-radius:4px;margin:10px 12px}
.tabs{display:flex;border-bottom:1px solid var(--div);margin:12px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.cur{border-color:var(--accent);color:var(--accent);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-left:6px}
.f{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;max-width:420px}
.f label{font-size:12px;color:var(--text2)}
.help{font-size:12px;color:var(--text2)}.help.err{color:var(--err)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.drop{border:1px dashed #8A8A8A;border-radius:4px;padding:20px;text-align:center;margin-bottom:12px}
.bar{height:4px;background:#D9E8F5;border-radius:2px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:mv 1s linear infinite}
@keyframes mv{from{margin-left:-30%}to{margin-left:100%}}
.snack{position:fixed;left:24px;bottom:24px;background:#323232;color:#fff;padding:10px 16px;border-radius:4px;z-index:50;max-width:520px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:4px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14)}
.dlg.md{max-width:880px}
.dlg h3{margin:0;padding:16px 24px;font-size:18px;font-weight:500;display:flex;justify-content:space-between}
.dlg .b{padding:0 24px 16px}.dlg .a{padding:8px 16px 16px;display:flex;justify-content:flex-end;gap:8px}
.acc{border:1px solid var(--div);border-radius:4px;margin-bottom:8px;background:#fff}
.acc>button{width:100%;text-align:left;border:0;background:none;padding:12px 16px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acc .body{padding:0 16px 16px}
.tg{display:inline-flex;border:1px solid #BDBDBD;border-radius:4px;overflow:hidden;flex-wrap:wrap}
.tg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;border-right:1px solid #BDBDBD}
.tg button.cur{background:#E5F0FA;font-weight:500}
.tg button:last-child{border-right:0}
.pill{list-style:none;margin:0;padding:0}
.pill li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--div)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--text2)}.cap{font-size:12px;color:var(--text2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1023px){.two{grid-template-columns:1fr}.snav{width:150px}}
.det{background:#FAFAFA}
code{background:#f0f0f0;padding:0 4px;border-radius:3px}
.ann{border:1px dashed #9C9C9C;color:#616161;font-size:12px;padding:4px 8px;border-radius:4px;display:inline-block}
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<div class="top"><span class="mark">MUSTASK</span><span class="sw">Организация «Альфа» ▾</span><span class="grow muted">· Настройки / Импорт</span></div>
<div class="shell">
<nav class="snav" aria-label="Меню настроек"><p>Настройки</p><h4>Организация</h4><a href="#" data-act="go" data-v="list" id="navimp">Импорт</a><a href="#" data-act="noop">Процесс</a><h4>Справочники</h4><a href="#" data-act="noop">Языки</a></nav>
<main id="app"></main>
</div>
<div id="layer"></div>
<script>
"use strict";
(function () {
  var HEADERS = ["Номер", "Проект", "Заголовок", "Вид", "Статус", "Ответственный", "Важность", "Срок", "Ссылка"];
  var SAMPLE = [
    ["T-1", "Платформа", " Отчёт по продажам ", "Story", "Открыта", "user.a@example.com", "1", "46023", "Документ"],
    ["T-2", "Платформа", "Сбой формы входа", "Defect", "В работе", "Пользователь Б", "2", "46030", ""],
    ["T-3", "Финансы", "Исследовать импорт", "Spike", "Проверено", "", "7", "", ""],
    ["T-4", "Финансы", "Обновить справочник", "Задача", "В анализе", "user.a@example.com", "3", "46040", ""],
    ["T-5", "Платформа", "Экран профиля", "Story", "На проверке", "Пользователь А", "2", "", ""]
  ];
  var FIELDS = {main: ["Проект", "Тип", "Заголовок", "Описание", "Статус", "Исполнитель", "Приоритет", "Команда-владелец", "Родитель", "Идентификатор MUSTASK"],
    typed: ["Целевая дата (Эпик, Фича)", "Исходная оценка (Баг, Задача)", "Оценка в пунктах (Пользовательская история)", "Серьёзность (Баг)"]};
  var REQ = ["Проект", "Тип", "Заголовок"];
  var RECODE = {"Проект": 1, "Тип": 1, "Статус": 1, "Приоритет": 1, "Исполнитель": 1, "Команда-владелец": 1};
  var NOEMPTY = {"Проект": 1, "Тип": 1, "Приоритет": 1};
  var TARGETS = {
    "Проект": ["Платформа", "Финансы", "Архив (неактивен)"], "Тип": ["Эпик", "Фича", "Пользовательская история", "Задача", "Баг"],
    "Статус": ["Новая", "Активна", "Разрешена", "Закрыта"], "Приоритет": ["1", "2", "3", "4"],
    "Исполнитель": ["Пользователь А (user.a@example.com)", "Пользователь Б (user.b@example.com)"], "Команда-владелец": ["Команда 1", "Команда 2"]
  };
  var CONV = {
    "Текст": ["Обрезать пробелы", "Обрезать до длины"], "Числа": ["Число"],
    "Даты": ["Дата из числа Excel", "Дата по формату", "Дата из ISO 8601"], "Списки": ["Разделить"], "Ссылки": ["URL из гиперссылки"],
    "Таблицы значений": ["По таблице"], "Шаблоны": ["Извлечь по шаблону", "Объединить"], "Константы": ["Константа"]
  };
  var ME = "Менеджер В (вы)";
  var state, uid = 100;

  function init() {
    state = {role: "admin", listState: "normal", view: "list", filterName: "", filterMine: false, snack: "", dlg: null,
      templates: [
        {id: 1, name: "Реестр — задачи", src: ".xlsx · лист «Задачи»", author: "Администратор Г", upd: "12.11.2026 10:15"},
        {id: 2, name: "Трекер — CSV", src: ".csv · UTF-8, «;»", author: ME, upd: "10.11.2026 16:40"},
        {id: 3, name: "План квартала", src: ".xlsx · лист «План»", author: "Пользователь Е", upd: "03.11.2026 09:02"}
      ],
      ed: null, chk: {tpl: 1, file: "Реестр.xlsx", phase: "idle", filter: "all", open: null, stale: false}};
  }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function isAdmin() { return state.role === "admin"; }
  function isMgr() { return state.role === "manager"; }
  function canCreate() { return isAdmin() || isMgr(); }
  function canRun() { return isAdmin() || isMgr(); }
  function canEdit(t) { return isAdmin() || (isMgr() && t.author === ME); }
  function tpl(id) { for (var i = 0; i < state.templates.length; i++) { if (state.templates[i].id === id) { return state.templates[i]; } } return null; }

  function sel(cls, name, opts, cur, extra) {
    var h = '<select class="sel ' + cls + '" data-f="' + name + '" ' + (extra || "") + '>';
    for (var i = 0; i < opts.length; i++) { h += '<option' + (opts[i] === cur ? " selected" : "") + '>' + esc(opts[i]) + '</option>'; }
    return h + "</select>";
  }
  function alertBox(kind, title, text, act) {
    return '<div class="al ' + kind + '" role="' + (kind === "error" ? "alert" : "status") + '"><div class="grow">' + (title ? "<strong>" + esc(title) + "</strong>" : "") + esc(text) + "</div>" + (act || "") + "</div>";
  }
  function frame(icon, h, hint, action) {
    return '<div class="frame"><div class="ic" aria-hidden="true">' + icon + "</div><h2>" + esc(h) + "</h2><p>" + esc(hint) + "</p>" + (action || "") + "</div>";
  }
  function head(trail, title, cmds) { return '<div class="trail">' + esc(trail) + '</div><div class="ph"><h1>' + esc(title) + "</h1>" + (cmds || "") + "</div>"; }

  /* ---------- S1 list ---------- */
  function renderList() {
    var h = head("Настройки / Импорт", "Импорт",
      (canRun() ? '<button class="btn" data-act="chk">✔ Проверить файл</button>' : "") +
      (canCreate() ? '<button class="btn p" data-act="new">+ Создать шаблон</button>' : ""));
    h += '<div class="paper fb" role="group" aria-label="Фильтры"><span aria-hidden="true">⚲</span><input class="in" data-f="fname" placeholder="Название" aria-label="Название" value="' + esc(state.filterName) + '">' +
      sel("", "fmine", ["Автор: все", "Только мои"], state.filterMine ? "Только мои" : "Автор: все") +
      ((state.filterName || state.filterMine) ? '<button class="btn" data-act="clr">⊘ Очистить фильтры</button>' : "") + "</div>";
    if (state.listState === "error") { return h + alertBox("error", "Не удалось загрузить шаблоны", "Сервер недоступен.", '<button class="btn" data-act="retry">Повторить</button>'); }
    var head2 = "<thead><tr><th>Название ↑</th><th>Источник</th><th>Автор</th><th>Изменён</th><th><span class='vh'></span></th></tr></thead>";
    if (state.listState === "loading") {
      var s = ""; for (var k = 0; k < 5; k++) { s += '<div class="sk"></div>'; }
      return h + '<div class="paper tw"><table>' + head2 + '</table><div role="status" aria-label="Загрузка данных">' + s + "</div></div>";
    }
    var rows = state.listState === "empty" ? [] : state.templates.filter(function (t) {
      return (!state.filterName || t.name.toLowerCase().indexOf(state.filterName.toLowerCase()) >= 0) && (!state.filterMine || t.author === ME);
    });
    if (!rows.length) {
      if (state.listState === "empty") {
        return h + frame("▢", "Шаблонов пока нет", canCreate() ? "Шаблон описывает, как столбцы вашей таблицы попадают в поля рабочих элементов. Создайте первый." : "Шаблоны ещё не созданы. Их создаёт администратор организации или менеджер проекта.",
          canCreate() ? '<button class="btn o" data-act="new">+ Создать шаблон</button>' : "");
      }
      return h + frame("⊘", "Ничего не найдено", "Ни один шаблон не подходит под заданные условия фильтра.", '<button class="btn o" data-act="clr">Сбросить фильтр</button>');
    }
    var b = "";
    rows.forEach(function (t) {
      var act = "";
      if (state.role === "member" || state.role === "viewer") {
        act = '<button class="btn" data-act="cols" data-id="' + t.id + '">Столбцы</button>';
      } else {
        act = (canEdit(t) ? '<button class="ib" title="Редактировать ' + esc(t.name) + '" aria-label="Редактировать ' + esc(t.name) + '" data-act="edit" data-id="' + t.id + '">✎</button>'
          : '<button class="ib" title="Открыть ' + esc(t.name) + '" aria-label="Открыть ' + esc(t.name) + '" data-act="edit" data-id="' + t.id + '">👁</button>') +
          '<button class="ib" title="Копировать ' + esc(t.name) + '" aria-label="Копировать ' + esc(t.name) + '" data-act="copy" data-id="' + t.id + '">⧉</button>' +
          (canEdit(t) ? '<button class="ib" title="Удалить ' + esc(t.name) + '" aria-label="Удалить ' + esc(t.name) + '" data-act="del" data-id="' + t.id + '">🗑</button>' : "") +
          '<button class="ib" title="Проверить файл по этому шаблону" aria-label="Проверить файл по шаблону ' + esc(t.name) + '" data-act="chk" data-id="' + t.id + '">✔</button>';
      }
      b += '<tr class="click"><td>' + esc(t.name) + "</td><td>" + esc(t.src) + "</td><td>" + esc(t.author) + "</td><td>" + esc(t.upd) + '</td><td style="text-align:right;white-space:nowrap">' + act + "</td></tr>";
    });
    var rn = state.role === "member" || state.role === "viewer";
    return h + '<div class="paper tw"><table aria-label="Шаблоны импорта">' + head2 + "<tbody>" + b + '</tbody></table><div class="pg">1–' + rows.length + " из " + rows.length + "</div></div>" +
      (rn ? '<p class="cap">Вы видите шаблоны организации. Создавать и менять их могут администратор организации и менеджеры проектов.</p>' : "") +
      '<p><span class="ann">Прототип: здесь добавятся вкладка «Партии» и кнопка «Экспорт по шаблону» (feat-067, feat-069) — в этой задаче их нет.</span></p>';
  }

  /* ---------- S2 editor ---------- */
  function newEditor() {
    return {id: 0, name: "", tab: "src", file: null, fileErr: "", sheet: "Задачи", hdr: 2, first: 3, enc: "UTF-8", delim: ";", fmt: "xlsx", maps: [], recode: {}, openAcc: "", idCol: "Нет", idEmpty: "Создавать",
      dirty: false, tried: false, errs: {}, readonly: false, author: ME, sampleLive: false};
  }
  function autoMaps() {
    var m = [];
    HEADERS.forEach(function (c) {
      var f = "Не переносить";
      if (c === "Проект" || c === "Заголовок" || c === "Статус") { f = c; }
      m.push(mkMap("col", c, f));
    });
    return m;
  }
  function mkMap(type, col, field) { return {id: ++uid, type: type, col: col, value: "", field: field, chain: [], empty: "Не менять", typeless: "Ошибка строки"}; }
  function openEditor(id, readonly) {
    var e = newEditor();
    if (id) {
      var t = tpl(id); e.id = id; e.name = t.name; e.author = t.author; e.file = {name: "Реестр.xlsx"}; e.sampleLive = true;
      e.maps = autoMaps();
      e.maps[3].field = "Тип"; e.maps[6].field = "Приоритет"; e.maps[5].field = "Исполнитель"; e.maps[7].field = "Целевая дата (Эпик, Фича)";
      e.maps[7].chain = [{k: "Дата из числа Excel", p: "1900"}]; e.maps[7].typeless = "Не переносить для типов без поля";
      e.maps[2].chain = [{k: "Обрезать пробелы", p: ""}, {k: "Обрезать до длины", p: "255"}];
      e.recode = {"Тип": {pol: "Ошибка строки", def: "", rows: [{v: "Story", n: 2, t: "Пользовательская история"}, {v: "Defect", n: 1, t: ""}, {v: "Задача", n: 1, t: "", sug: "Задача"}, {v: "Spike", n: 1, t: "", fresh: true}]}};
      e.recodeFor = {};
    }
    e.readonly = !!readonly;
    state.ed = e; state.view = "editor";
  }
  function recodeFields(e) {
    var out = [];
    e.maps.forEach(function (m) { if (RECODE[m.field] && out.indexOf(m.field) < 0) { out.push(m.field); } });
    return out;
  }
  function ensureRecode(e) {
    recodeFields(e).forEach(function (f) {
      if (!e.recode[f]) {
        var col = null; e.maps.forEach(function (m) { if (m.field === f) { col = m.col; } });
        var idx = HEADERS.indexOf(col), seen = {}, rows = [];
        SAMPLE.forEach(function (r) { var v = (r[idx] || "").trim(); if (v && !seen[v]) { seen[v] = 1; rows.push({v: v, n: 1, t: TARGETS[f] && TARGETS[f].indexOf(v) >= 0 ? "" : "", sug: TARGETS[f] && TARGETS[f].indexOf(v) >= 0 ? v : "", fresh: true}); } });
        e.recode[f] = {pol: "Ошибка строки", def: "", rows: rows};
      }
    });
  }
  function validate(e) {
    var er = {}, any = false;
    if (!e.name.trim()) { er.name = "Укажите название."; }
    else if (e.name.length > 100) { er.name = "Название — не больше 100 символов."; }
    else { state.templates.forEach(function (t) { if (t.id !== e.id && t.name.toLowerCase() === e.name.trim().toLowerCase()) { er.name = "Шаблон с таким названием уже есть."; } }); }
    if (e.fmt === "xlsx") {
      if (!(e.hdr >= 1 && e.hdr <= 50)) { er.hdr = "Строка заголовков — число от 1 до 50."; }
      else if (!(e.first > e.hdr)) { er.first = "Первая строка данных должна быть ниже строки заголовков."; }
    }

  var RES = {create: ["Будет создан", "ok", "⊕"], update: ["Будет обновлён", "in2", "✎"], same: ["Без изменений", "gr", "="], skip: ["Пропущен", "gr", "⤼"], err: ["Ошибка", "er", "⚠"]};

  function chkRows() { return REPORT.filter(function (r) { return !r.mgr || state.role === "manager"; }); }
  function renderCheck() {
    var c = state.chk, h = head("Настройки / Импорт / Проверка файла", "Проверка файла", "");

      '<div class="f"><label>Файл (прототип: какой файл выбрать)</label>' + sel("", "cfile", ["Реестр.xlsx", "Реестр.xls", "Большой.xlsx", "Без столбца.xlsx", "Нет листа.xlsx", "Пустой.xlsx", "Одни ошибки.xlsx", "Макросы.xlsx"], c.file) + "</div>" +
      '<div class="f"><button class="btn p" data-act="run"' + (c.phase === "running" ? " disabled" : "") + ">Проверить</button></div></div>";
    if (c.phase === "running") { h += '<div role="status"><div class="bar"><i></i></div>Проверяем файл… Это может занять до минуты. <button class="btn" data-act="cancelrun">Отменить</button></div>'; }

  function repTable(c, allerr) {

        if (r.fields) { h += "<b>Поле → значение</b><ul>" + r.fields.map(function (f) { return "<li>" + esc(f[0]) + ": " + esc(f[1]) + "</li>"; }).join("") + "</ul>"; }
        if (r.ch) { h += "<b>Изменения</b><ul>" + r.ch.map(function (f) { return "<li>" + esc(f[0]) + ": " + esc(f[1]) + " → " + esc(f[2]) + "</li>"; }).join("") + "</ul>"; }
        if (r.reasons.length) { h += "<b>Причины</b><ul>" + r.reasons.map(function (f) { return "<li>⚠ " + esc(f) + "</li>"; }).join("") + "</ul>"; }

        if (!r.fields && !r.ch && !r.reasons.length) { h += "Изменений нет."; }

    return h + '</tbody></table><div class="pg">Показаны первые 50 строк. Полный отчёт — в файле.</div></div>' +
      (allerr ? "" : '<p><span class="ann">Прототип: здесь будет «Импортировать» (feat-067) — в этой задаче его нет. Оно не появится и при устаревшей проверке, и когда все строки с ошибками.</span></p>');
  }

  /* ---------- dialogs & render ---------- */
  function renderDlg() {
    var d = state.dlg;
    if (!d) { return ""; }

    if (d.k === "del") {
      return '<div class="scrim"><div class="dlg" role="alertdialog" aria-modal="true" aria-label="Удалить шаблон?"><h3>Удалить шаблон?</h3><div class="b">Шаблон «' + esc(tpl(d.id).name) + '» будет удалён безвозвратно. Уже выполненные по нему импорты не изменятся.</div><div class="a"><button class="btn" data-act="dlgclose">Отмена</button><button class="btn p d" style="background:var(--err);color:#fff" data-act="delok">Удалить</button></div></div></div>';
    }

      return '<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="Столбцы шаблона"><h3>Столбцы шаблона «' + esc(tpl(d.id).name) + '»<button class="ib" aria-label="Закрыть" data-act="dlgclose">✕</button></h3><div class="b"><ul>' +
        ["Номер", "Проект", "Заголовок", "Тип", "Статус", "Исполнитель", "Приоритет", "Идентификатор"].map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul><p class="cap">Эти столбцы попадут в файл при экспорте по шаблону.</p></div><div class="a"><button class="btn" data-act="dlgclose">Закрыть</button></div></div></div>';
    }
    return "";
  }
  function render() {
    var h = "";
    if (state.view === "list") { h = renderList(); } else if (state.view === "editor") { h = renderEditor(); } else { h = renderCheck(); }
    document.getElementById("app").innerHTML = h;
    document.getElementById("layer").innerHTML = renderDlg() + (state.snack ? '<div class="snack" role="status">' + esc(state.snack) + "</div>" : "");
    var p = document.getElementById("proto");
    p.innerHTML = "<b>Прототип · данные вымышленные</b><span>Роль: " + roleSel() + "</span><span>Список: " + sel("", "lstate", ["normal", "loading", "empty", "error"], state.listState) + '</span><button class="btn" data-act="reset">Сбросить прототип</button><span class="muted">Роли: администратор организации; менеджер проекта (автор шаблона «Трекер — CSV»); участник; читатель.</span>';
  }
  function roleSel() {
    var L = {admin: "Администратор организации", manager: "Менеджер проекта", member: "Участник", viewer: "Читатель"}, h = '<select class="sel" data-f="role" aria-label="Роль">';
    for (var k in L) { if (L.hasOwnProperty(k)) { h += '<option value="' + k + '"' + (state.role === k ? " selected" : "") + ">" + L[k] + "</option>"; } }
    return h + "</select>";
  }
  function snack(t) { state.snack = t; render(); setTimeout(function () { if (state.snack === t) { state.snack = ""; render(); } }, 6000); }
  function mapById(id) { var r = null; state.ed.maps.forEach(function (m) { if (String(m.id) === String(id)) { r = m; } }); return r; }

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) { return; }
    ev.preventDefault();
    var a = t.getAttribute("data-act"), id = parseInt(t.getAttribute("data-id"), 10), v = t.getAttribute("data-v"), e = state.ed, i = parseInt(t.getAttribute("data-i"), 10);
    if (a === "noop") { return; }
    if (a === "go") { state.view = "list"; render(); return; }
    if (a === "new") { state.ed = newEditor(); state.view = "editor"; render(); return; }

    if (a === "copy") { var src = tpl(id), nm = "Копия " + src.name, k = 1; while (state.templates.some(function (x) { return x.name === nm; })) { k++; nm = "Копия " + src.name + " " + k; } state.templates.push({id: ++uid, name: nm, src: src.src, author: state.role === "admin" ? "Администратор Г" : ME, upd: "13.11.2026 12:00"}); snack("Создан шаблон «" + nm + "»."); return; }

    if (a === "delok") { state.templates = state.templates.filter(function (x) { return x.id !== state.dlg.id; }); state.dlg = null; snack("Шаблон удалён."); return; }

    if (a === "chk") { state.chk = {tpl: id || (state.ed && state.ed.id) || 1, file: "Реестр.xlsx", phase: "idle", filter: "all", open: null, stale: false}; state.view = "check"; render(); return; }
    if (a === "tab") { e.tab = v; render(); return; }
    if (a === "pick") {

    }
    if (a === "run") {
      var c = state.chk; c.phase = "running"; c.stale = false; c.open = null; c.filter = "all"; render();

        else if (f === "Без столбца.xlsx") { c.phase = "refused"; c.reason = "В файле нет столбцов, которые указаны в шаблоне: Ответственный."; }
        else if (f === "Нет листа.xlsx") { c.phase = "refused"; c.reason = "В файле нет листа «Задачи», указанного в шаблоне."; }
        else if (f === "Пустой.xlsx") { c.phase = "empty"; }
        else if (f === "Одни ошибки.xlsx") { c.phase = "allerr"; }
        else { c.phase = "done"; }
        render();
      }, 1200);
      return;
    }
    if (a === "cancelrun") { clearTimeout(state.chk.timer); state.chk.phase = "idle"; render(); return; }
    if (a === "flt") { state.chk.filter = v; state.chk.open = null; render(); return; }
    if (a === "row") { state.chk.open = state.chk.open === parseInt(v, 10) ? null : parseInt(v, 10); render(); return; }
    if (a === "dl") { snack("Отчёт скачивается (в прототипе — без файла)."); return; }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target, f = t.getAttribute("data-f");
    if (!f) { return; }
    var e = state.ed, p = f.split(":"), m;

    if (f === "sheet") { e.sheet = t.value; e.dirty = true; return; }
    if (f === "hdr") { e.hdr = parseInt(t.value, 10); e.dirty = true; validate(e); e.tried = true; render(); return; }

    if (p[0] === "mval") { mapById(p[1]).value = t.value; e.dirty = true; return; }
    if (p[0] === "mfld") { m = mapById(p[1]); m.field = t.value.replace(" — уже сопоставлено", ""); e.dirty = true; if (e.tried) { validate(e); } render(); return; }

    if (p[0] === "rv") { e.recode[p[1]].rows[parseInt(p[2], 10)].t = t.value === "—" ? "" : t.value; e.dirty = true; render(); return; }
    if (f === "cadd") {
      if (t.value.indexOf("Добавить") !== 0) { state.dlg.chain.push({k: t.value, p: t.value === "Обрезать до длины" ? "255" : (t.value === "Разделить" ? ";" : "")}); render(); }
      return;
    }
    if (p[0] === "cp") { state.dlg.chain[parseInt(p[1], 10)].p = t.value; return; }
    if (p[0] === "cpsel") { state.dlg.chain[parseInt(p[1], 10)].p = t.value; return; }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && state.dlg) { state.dlg = null; render(); } });

  init();
  render();
})();

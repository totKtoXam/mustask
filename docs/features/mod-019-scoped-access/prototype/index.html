  writePlat: () => admin() || pMgr() || (role('log') === 'manage' && st.inh.A && st.inh.plat),
  switchA: () => C.writeNodeA() && dMgr(), switchD: () => admin(), switchPlat: () => C.writePlat() && C.writeNodeA(),
  places: () => (admin() ? ['top', 'log', 'fin'] : role('log') === 'manage' ? ['log'] : []),

const sig = () => JSON.stringify([C.grantDept(), C.grantProj(), C.grantTeam(), C.writeNodeA(), C.writePlat(), C.switchA(), C.switchPlat(), C.places()]);
function notice(t) { const n = $('#notice'); n.textContent = t; n.style.display = 'block'; clearTimeout(notice.t); notice.t = setTimeout(() => (n.style.display = 'none'), 4200); }

const goEntry = { 'dept|Проекты': 'deptP', 'deptP|Участники': 'dept', 'dept|Участники': 'dept', 'deptP|Проекты': 'deptP', 'proj|Структура': 'nodeA', 'nodeA|Участники и доступ': 'proj', 'proj|Участники и доступ': 'proj', 'nodeA|Структура': 'nodeA', 'sub|Участники и доступ': 'proj', 'sub|Структура': 'nodeA', 'nodeD|Структура': 'nodeD' };

  },
  team() {
    const mem = st.members.VENUS.map((u) => { const g = st.grants.VENUS.find((x) => x.u === u); return '<tr><td>' + userCell(u) + '</td><td>' + (g ? label('team', g.r) : '—') + '</td><td class="act">' + (C.grantTeam() ? '<button class="ghost" aria-label="Ещё действия: ' + esc(nm(u)) + '">⋮</button>' : '') + '</td></tr>'; }).join('');
    return '<div class="head"><h1>Участники и доступ</h1>' + (C.grantTeam() ? '<button class="primary">Добавить участника</button>' : '') + '</div>' +
      '<section class="sec"><div class="head"><h2>Участники команды</h2></div><div class="card"><table aria-label="Участники команды"><thead><tr><th>Участник</th><th>Роль в команде</th><th></th></tr></thead><tbody>' + mem + '</tbody></table></div></section>' +
      '<section class="sec"><div class="head"><h2>Доступ к команде</h2>' + cmd(C.grantTeam(), '+ Выдать доступ', 'grant', 'VENUS', false) + '</div>' + body('VENUS', C.grantTeam()) + '</section>';
  },
  deptP() {
    const rows = st.projects.filter((p) => p[2] === 'Логистика').map((p) => '<tr><td><a class="l">' + p[0] + '</a></td><td>' + p[1] + '</td></tr>').join('');
    return '<div class="head"><h1>Проекты</h1>' + (C.places().includes('log') ? '<button class="primary" data-act="create" data-place="log">Создать проект</button>' : '') + '</div>' +
      '<div class="card"><table aria-label="Проекты департамента"><thead><tr><th>Проект</th><th>Ключ</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  },
  projects() {
    const rows = st.projects.map((p) => '<tr><td><a class="l">' + p[0] + '</a></td><td>' + p[1] + '</td><td>' + (p[2] || '—') + '</td></tr>').join('');
    return '<div class="head"><h1>Проекты</h1>' + (C.places().length ? '<button class="primary" data-act="create" data-place="">Создать проект</button>' : '') + '</div>' +
      (C.places().length ? '' : '<p class="proto">Команда «Создать проект» отсутствует: у вас нет места для проекта (не отключена, а убрана).</p>') +
      '<div class="card"><table aria-label="Проекты"><thead><tr><th>Название</th><th>Ключ</th><th>Расположение</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  },
};
function accessSection(nodeKey) {
  const n = NODES[nodeKey], isArea = n.type === 'area', parent = n.parent ? NODES[n.parent] || { name: 'Логистика' } : null;
  const canSw = { A: C.switchA, D: C.switchD, plat: C.switchPlat }[nodeKey]();
  const on = st.inh[nodeKey];
  let txt;
  if (!isArea && !parent) txt = 'Над проектом нет департамента, поэтому выбор пока ни на что не влияет. Он начнёт действовать, когда проект переместят в департамент.';
  else if (!isArea) txt = on ? 'Доступ департамента «Логистика» действует в проекте «A», его рабочих элементах и областях.' : 'Доступ департамента «Логистика» в проекте «A» не действует. Действует только доступ, выданный в самом проекте.';
  else txt = on ? 'Права на управление областями, действующие в «A», действуют и здесь. На рабочие элементы это не влияет.' : 'Права на управление областями из «A» здесь не действуют. На рабочие элементы это не влияет: их определяет проект.';
  const ctl = canSw
    ? '<label class="sw"><input type="checkbox" role="switch" data-act="toggle" data-key="' + nodeKey + '" ' + (on ? 'checked' : '') + ' aria-describedby="swtxt"><span class="trk"></span>Наследовать доступ</label>'
    : '<dl class="facts" style="padding:0;margin:0"><dt>Наследовать доступ</dt><dd>' + (on ? 'Включено' : 'Выключено') + '</dd></dl>';
  return '<section class="sec"><div class="head"><h2>Доступ</h2></div><div class="card" style="padding:12px 16px">' + ctl + '<div class="state" id="swtxt"' + (canSw ? '' : ' style="margin-left:0"') + '>' + txt + '</div></div></section>';
}
page.nodeA = () => '<div class="head"><h1>Структура: A</h1><button data-go="proj">Открыть проект</button></div><dl class="card facts"><dt>Тип</dt><dd>Проект</dd><dt>Расположение</dt><dd><a class="l">Логистика</a></dd><dt>Описание</dt><dd>Складской учёт</dd></dl>' + accessSection('A') +
  '<section class="sec"><div class="head"><h2>Вложенные области</h2>' + (C.writeNodeA() ? '<button data-act="noop">Добавить область</button>' : '') + '</div><div class="card"><table aria-label="Вложенные области"><thead><tr><th>Область</th><th>Описание</th></tr></thead><tbody><tr><td><a class="l" data-go="sub">Платформа</a></td><td>Складское ПО</td></tr></tbody></table></div></section>';
page.nodeD = () => '<div class="head"><h1>Структура: D</h1></div><dl class="card facts"><dt>Тип</dt><dd>Проект</dd><dt>Расположение</dt><dd>Верхний уровень</dd></dl>' + accessSection('D');
page.sub = () => '<div class="head"><h1>Область: Платформа</h1></div><dl class="card facts"><dt>Родительская область</dt><dd><a class="l" data-go="nodeA">A</a></dd><dt>Проект</dt><dd><a class="l" data-go="proj">A</a></dd><dt>Описание</dt><dd>Складское ПО</dd></dl>' + accessSection('plat');

function render() {
  document.body.classList.toggle('narrow', st.narrow);
  $('#meBtns').innerHTML = Object.keys(U).filter((u) => u !== 'denis' && u !== 'lena').map((u) => '<button data-me="' + u + '" aria-pressed="' + (st.me === u) + '">' + U[u].n.split(' ')[0] + (U[u].admin ? ' (адм.)' : u === 'pavel' ? ' (деп.)' : u === 'kirill' ? ' (проект)' : '') + '</button>').join('');
  $('#pageBtns').innerHTML = Object.keys(PAGES).map((p) => '<button data-page="' + p + '" aria-pressed="' + (st.page === p) + '">' + PAGES[p] + '</button>').join('');
  $('#dataBtns').innerHTML = [['ok', 'Обычные'], ['empty', 'Пусто'], ['loading', 'Загрузка'], ['error', 'Ошибка']].map((d) => '<button data-data="' + d[0] + '" aria-pressed="' + (st.data === d[0]) + '">' + d[1] + '</button>').join('');
  $('#wBtn').setAttribute('aria-pressed', st.narrow);
  renderNav();
  const f = document.activeElement && document.activeElement.id === 'flt' ? document.activeElement.selectionStart : null;
  $('#main').innerHTML = page[st.page]();
  if (f !== null) { const i = $('#flt'); if (i) { i.focus(); i.setSelectionRange(f, f); } }
  renderDlg();
}

/* ---- dialogs ---- */
const dlgShell = (title, inner, foot) => '<div class="layer"><div class="dlg" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2>' + inner + '<div class="foot">' + foot + '</div></div></div>';
function candidates(key) {
  const q = st.dlg.q.trim().toLowerCase();
  if (q.length < 2) return { hint: 'Введите не менее 2 символов имени или почты', list: [] };
  const taken = st.grants[key].map((g) => g.u);
  const list = Object.keys(U).filter((u) => !U[u].inactive && !taken.includes(u) && u !== st.me && (U[u].n + U[u].e).toLowerCase().includes(q));
  return list.length ? { list } : { hint: 'Пользователи не найдены. Себе доступ выдать нельзя; у кого он уже есть, тому роль меняется в списке.', list: [] };
}
function renderDlg() {
  const d = st.dlg, L = $('#layer');
  if (!d) { L.innerHTML = ''; return; }
  const key = d.key, scope = SCOPE[key];
  const roleSel = (cur) => '<div class="fld"><label for="rl">Роль *</label><select id="rl" data-f="role">' + ROLES[scope].map((r) => '<option value="' + r[0] + '"' + (r[0] === cur ? ' selected' : '') + '>' + r[1] + '</option>').join('') + '</select><div class="hint">' + ROLES[scope].find((r) => r[0] === cur)[2] + '</div></div>';
  let h = '';
  if (d.kind === 'forbidden') h = dlgShell(d.title, '<div class="note err" role="alert">Недостаточно прав</div>', '<button data-act="close">Закрыть</button>');
  else if (d.kind === 'grant') {
    const c = candidates(key);
    const pick = d.u ? '<div class="note info" style="margin:4px 0">' + esc(nm(d.u)) + ' <button class="ghost" data-act="unpick">×</button></div>' : '';
    h = dlgShell('Выдача доступа', '<div class="fld' + (d.err ? ' bad' : '') + '"><label for="usr">Участник организации *</label>' + pick +
      (d.u ? '' : '<input type="text" id="usr" data-f="q" autocomplete="off" value="' + esc(d.q) + '">' + '<ul class="opts" role="listbox">' + (c.hint ? '<li class="hintrow">' + c.hint + '</li>' : c.list.map((u) => '<li role="option" data-act="pick" data-u="' + u + '">' + esc(nm(u)) + ' <span class="sub">' + U[u].e + '</span></li>').join('')) + '</ul>') +
      (d.err ? '<div class="e">' + d.err + '</div>' : '') + '</div>' + roleSel(d.role),
      '<button data-act="close">Отмена</button><button class="primary" data-act="submitGrant"' + (d.u ? '' : ' disabled') + '>Выдать</button>');
  } else if (d.kind === 'role') {
    h = dlgShell('Изменение роли', '<p class="sub">Пользователь: ' + esc(nm(d.u)) + '</p>' + roleSel(d.role) + (d.err ? '<div class="note warn" role="alert">' + d.err + '</div>' : ''),
      '<button data-act="close">Отмена</button><button class="primary" data-act="submitRole"' + (d.role === d.orig ? ' disabled' : '') + '>Сохранить</button>');
  } else if (d.kind === 'revoke') {
    const own = d.u === st.me, g = st.grants[key].find((x) => x.u === d.u), o = key === 'log' ? 'Логистика' : key;
    h = dlgShell(own ? 'Отозвать свой доступ?' : 'Отозвать доступ?', '<p>' + (own ? 'Вы потеряете роль «' + label(scope, g.r) + '» на объекте «' + o + '». Вернуть её сможет другой менеджер или администратор организации.' : 'Пользователь ' + esc(nm(d.u)) + ' потеряет роль «' + label(scope, g.r) + '» на объекте «' + o + '». Доступ, который он получает по роли в организации или от департамента, сохранится.') + '</p>',
      '<button data-act="close" autofocus>Отмена</button><button class="danger" data-act="doRevoke">Отозвать</button>');
  } else if (d.kind === 'off') h = switchOff(d);
  else if (d.kind === 'create') {
    const names = { top: 'Верхний уровень', log: 'Логистика', fin: 'Финансы' };
    const pl = C.places();
    h = dlgShell('Новый проект', '<div class="fld"><label for="pn">Название *</label><input type="text" id="pn" data-f="pname" value="' + esc(d.name) + '"></div><div class="fld"><label for="pk">Ключ *</label><input type="text" id="pk" data-f="pkey" value="' + esc(d.pkey) + '"></div>' +
      '<div class="fld"><label for="pp">Расположение *</label><select id="pp" data-f="place">' + pl.map((p) => '<option value="' + p + '"' + (p === d.place ? ' selected' : '') + '>' + names[p] + '</option>').join('') + '</select></div>' + (d.err ? '<div class="note err" role="alert">' + d.err + '</div>' : ''),
      '<button data-act="close">Отмена</button><button class="primary" data-act="submitCreate"' + (d.name.trim() && d.pkey.trim() ? '' : ' disabled') + '>Создать</button>');
  }
  const keepF = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  const pos = document.activeElement && document.activeElement.selectionStart;
  L.innerHTML = h;
  const f = keepF && L.querySelector('[data-f="' + keepF + '"]');
  if (f) { f.focus(); if (pos != null && f.setSelectionRange) try { f.setSelectionRange(pos, pos); } catch (e) {} } else { const a = L.querySelector('[autofocus]') || L.querySelector('input[type=text]') || L.querySelector('button'); if (a) a.focus(); }
}
/* ---- switch-off confirmation ---- */
function impact(nodeKey) {
  const proj = st.grants.A.map((g) => g.u);
  const stops = nodeKey === 'D' ? [] : [...new Set(st.grants.log.map((g) => g.u))].filter((u) => !U[u].admin && !proj.includes(u));
  const given = st.grants.A.filter((g) => stops.includes(g.by));
  return { stops, given, self: stops.includes(st.me) };
}
function switchOff(d) {
  const isArea = d.key === 'plat', title = 'Отключить наследование доступа?';
  const lead = d.key === 'D' ? 'Проект «D» стоит на верхнем уровне: сейчас наследовать нечего. Выбор начнёт действовать, когда проект переместят в департамент.' : isArea ? 'Права на управление областями из «A» перестанут действовать в области «Платформа» и её вложенных областях. На рабочие элементы это не влияет.' : 'Доступ департамента «Логистика» перестанет действовать в проекте «A», его рабочих элементах и областях. Доступ, выданный в самом проекте, сохранится.';
  let inner = '<p>' + lead + '</p>', ok = false;
  if (d.loading) inner += '<div role="status" aria-label="Загрузка данных">' + '<div class="skel"></div>'.repeat(3) + '</div>';
  else if (d.failed) inner += '<div class="note err" role="alert">Не удалось узнать, кого это затронет. Попробуйте ещё раз. <button data-act="retryOff">Повторить</button></div>';
  else {
    ok = true; const im = d.im;
    inner += im.stops.length ? '<p><b>' + (isArea ? 'Потеряют право управлять областью: ' : 'Потеряют доступ через департамент: ') + plural(im.stops.length, 'пользователь', 'пользователя', 'пользователей') + '.</b><br><span class="sub">Не учитываются администраторы организации и те, у кого есть доступ в самом проекте.</span></p>' : '<p><b>Это не отнимет доступ ни у кого.</b></p>';
    if (im.self) inner += '<div class="note warn" role="alert">Вы входите в их число. После отключения вы потеряете управление этим узлом и не сможете включить наследование обратно: это сможет сделать ' + (isArea ? 'менеджер проекта или администратор организации.' : 'только администратор организации.') + '</div>';
    if (im.given.length) inner += '<p style="margin-bottom:0"><b>Доступ в проекте, выданный этими пользователями (' + im.given.length + ')</b></p><div class="given"><table aria-label="Выданный доступ"><thead><tr><th>Кому</th><th>Роль</th><th>Кто выдал</th></tr></thead><tbody>' + im.given.map((g) => '<tr><td>' + esc(nm(g.u)) + '</td><td>' + label('proj', g.r) + '</td><td>' + esc(nm(g.by)) + '</td></tr>').join('') + '</tbody></table></div><p class="sub">Он не прекратится при отключении. Отозвать его можно вручную в «Участники и доступ» проекта.</p>';
  }
  return dlgShell(title, inner, '<button data-act="close" autofocus>Отмена</button><button class="danger" data-act="confirmOff"' + (ok ? '' : ' disabled') + '>Отключить</button>');
}
function openOff(key) {
  st.dlg = { kind: 'off', key, loading: true }; render();
  setTimeout(() => { if (!st.dlg || st.dlg.kind !== 'off') return; if ($('#sim').value === 'impact') { st.dlg.loading = false; st.dlg.failed = true; } else { st.dlg.loading = false; st.dlg.failed = false; st.dlg.im = impact(key); } render(); }, 500);
}

/* ---- events ---- */
const sim = () => { const v = $('#sim').value; if (v === '403' || v === '404') { $('#sim').value = ''; return v; } return ''; };
function forbid(key, title) {
  const before = sig();
  const hit = (key === 'A' ? ['A', 'log'] : [key]).find((c) => st.grants[c].some((g) => g.u === st.me && !st.lost[st.me + ':' + c]));
  if (hit) st.lost[st.me + ':' + hit] = true;
  st.dlg = { kind: 'forbidden', title }; render(); reread(before);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-me],[data-page],[data-data],[data-act],[data-go],[data-entry],#loseBtn,#resetBtn,#wBtn');
  if (!t) { if (st.menu) { st.menu = null; render(); } return; }
  const D = t.dataset;
  if (D.me) { const before = sig(); st.me = D.me; st.menu = null; st.dlg = null; render(); if (before !== sig()) { /* another person, not a re-read */ } return; }
  if (D.page) { st.page = D.page; st.filter = ''; st.menu = null; st.dlg = null; return render(); }
  if (D.data) { st.data = D.data; return render(); }
  if (D.go) { st.page = D.go; st.filter = ''; return render(); }
  if (D.entry) { const nxt = goEntry[st.page + '|' + D.entry]; if (nxt) { st.page = nxt; st.filter = ''; render(); } return; }
  if (t.id === 'wBtn') { st.narrow = !st.narrow; return render(); }
  if (t.id === 'resetBtn') { Object.assign(st, seed(), { me: st.me }); return render(); }
  if (t.id === 'loseBtn') {
    const before = sig(), k = { dept: 'log', deptP: 'log', proj: 'A', nodeA: 'A', nodeD: 'A', sub: 'A', team: 'VENUS', projects: 'log' }[st.page];
    if (admin()) return notice('Администратор не теряет доступ: он действует на всех объектах.');
    const chain = k === 'A' ? ['A', 'log'] : [k];
    const hit = chain.find((c) => st.grants[c].some((g) => g.u === st.me && !st.lost[st.me + ':' + c]));
    if (hit) st.lost[st.me + ':' + hit] = true;
    render(); if (before === sig()) notice('Ваши права на этой странице не изменились.'); else reread(before); return;
  }
  switch (D.act) {
    case 'menu': st.menu = st.menu === D.id ? null : D.id; return render();
    case 'clearFilter': st.filter = ''; return render();
    case 'retry': st.data = 'loading'; render(); return setTimeout(() => { st.data = 'ok'; render(); }, 500);
    case 'grant': st.dlg = { kind: 'grant', key: D.key, q: '', u: null, role: ROLES[SCOPE[D.key]][0][0], err: '' }; return render();
    case 'role': { st.menu = null; const g = st.grants[D.key].find((x) => x.u === D.u); st.dlg = { kind: 'role', key: D.key, u: D.u, role: g.r, orig: g.r, err: '' }; return render(); }
    case 'revoke': st.menu = null; st.dlg = { kind: 'revoke', key: D.key, u: D.u }; return render();
    case 'close': st.dlg = null; return render();
    case 'pick': st.dlg.u = D.u; st.dlg.err = ''; return render();
    case 'unpick': st.dlg.u = null; st.dlg.q = ''; return render();
    case 'submitGrant': { const s = sim(); if (s === '403') return forbid(st.dlg.key, 'Выдача доступа'); if (s === '404') { st.dlg.err = 'Участник не найден.'; st.dlg.u = null; return render(); }
      st.grants[st.dlg.key].push({ u: st.dlg.u, r: st.dlg.role, by: st.me, at: '06.11.2026 12:00' }); notice('Пользователю «' + nm(st.dlg.u) + '» выдан доступ.'); st.dlg = null; return render(); }
    case 'submitRole': { const s = sim(); if (s === '403') return forbid(st.dlg.key, 'Изменение роли'); if (s === '404') { st.dlg.err = 'Доступ уже изменён или отозван. Список обновлён.'; return render(); }
      st.grants[st.dlg.key].find((x) => x.u === st.dlg.u).r = st.dlg.role; notice('Роль пользователя «' + nm(st.dlg.u) + '» изменена.'); st.dlg = null; return render(); }
    case 'doRevoke': { const s = sim(); if (s === '403') return forbid(st.dlg.key, 'Отзыв доступа'); const own = st.dlg.u === st.me, who = nm(st.dlg.u); st.grants[st.dlg.key] = st.grants[st.dlg.key].filter((x) => x.u !== st.dlg.u); notice(own ? 'Ваш доступ отозван.' : 'Доступ пользователя «' + who + '» отозван.'); st.dlg = null; return render(); }
    case 'toggle': { e.preventDefault(); const key = D.key; if (st.inh[key]) return openOff(key); st.inh[key] = true; notice('Наследование доступа включено.'); return render(); }
    case 'retryOff': return openOff(st.dlg.key);
    case 'confirmOff': { const s = sim(); const key = st.dlg.key, before = sig(); if (s === '403') return forbid('A', 'Отключение наследования'); st.inh[key] = false; st.dlg = null; render(); notice('Наследование доступа отключено.'); return; }
    case 'create': st.dlg = { kind: 'create', name: '', pkey: '', place: D.place || C.places()[0], err: '' }; return render();
    case 'submitCreate': { const s = sim(); if (s === '403') { st.dlg.err = 'Недостаточно прав'; return render(); } st.projects.push([st.dlg.name, st.dlg.pkey, { top: null, log: 'Логистика', fin: 'Финансы' }[st.dlg.place]]); notice('Проект «' + st.dlg.name + '» создан.'); st.dlg = null; return render(); }
  }
});
document.addEventListener('input', (e) => {
  const f = e.target.dataset.f;
  if (e.target.id === 'flt') { st.filter = e.target.value; return render(); }
  if (!f || !st.dlg) return;
  const map = { q: 'q', role: 'role', pname: 'name', pkey: 'pkey', place: 'place' };
  st.dlg[map[f]] = e.target.value; renderDlg();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.dlg) { st.dlg = null; render(); } });
render();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mod-018: рабочее пространство областей (прототип)</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/20px "Segoe UI", Arial, sans-serif; background: #f3f2f1; margin: 0; color: #201f1e; }
  header.top { background: #fff; border-bottom: 1px solid #e1dfdd; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  header.top b { margin-right: 6px; } header.top span { color: #605e5c; margin-left: 10px; }
  .shell { display: flex; align-items: flex-start; }
  nav { width: 200px; flex: none; padding: 16px 8px 16px 16px; font-size: 13px; }
  nav h4 { margin: 8px 0 4px; font-size: 11px; color: #605e5c; text-transform: uppercase; }
  nav a { display: block; padding: 4px 8px; border-radius: 4px; color: inherit; text-decoration: none; }
  nav a.cur { background: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #0078d4; }
  main { flex: 1; min-width: 0; padding: 16px 24px 80px; }
  main.narrow { max-width: 640px; }
  button { font: inherit; color: inherit; background: #edebe9; border: 0; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #e1dfdd; }
  button.primary { background: #0078d4; color: #fff; }
  button.danger { background: #a4262c; color: #fff; }
  button.ghost { background: none; padding: 2px 6px; }
  button[aria-pressed="true"] { background: #fff; box-shadow: inset 0 -2px 0 #0078d4; }
  button[aria-disabled="true"], button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid #0078d4; outline-offset: -1px; }
  a.l { color: #0f5fb0; text-decoration: none; cursor: pointer; } a.l:hover { text-decoration: underline; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; } h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; } .head h1 { flex: 1; min-width: 160px; }
  .card { background: #fff; border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  table { border-collapse: collapse; width: 100%; } th { text-align: left; font-weight: 400; font-size: 12px; color: #605e5c; padding: 6px 12px; }
  td { padding: 4px 12px; height: 36px; } tbody tr:hover { background: #f8f7f6; } tbody tr.sel { background: #e8f0fb; }
  tbody tr[tabindex] { cursor: default; } td.act { width: 48px; text-align: right; } td.muted, .muted { color: #605e5c; }
  .nm { display: flex; align-items: center; gap: 2px; min-width: 0; } .tg { width: 24px; flex: none; text-align: center; cursor: pointer; border: 0; background: none; padding: 0; }
  .tag { display: inline-block; background: #edebe9; border-radius: 10px; padding: 0 8px; font-size: 12px; margin-left: 8px; }
  .facts { display: grid; grid-template-columns: 180px 1fr; gap: 6px 12px; padding: 12px 16px; margin-bottom: 24px; } .facts dt { color: #605e5c; font-size: 12px; } .facts dd { margin: 0; white-space: pre-wrap; }
  section.sec { margin-bottom: 24px; } section.sec > .head { border-bottom: 1px solid #e1dfdd; padding-bottom: 6px; } .count { color: #605e5c; font-weight: 400; margin-left: 6px; }
  .empty { text-align: center; padding: 40px 16px; } .empty p { color: #605e5c; margin: 4px 0 12px; } .inl { padding: 10px 12px; color: #605e5c; }
  .skel { height: 14px; margin: 12px; border-radius: 4px; background: linear-gradient(90deg,#edebe9,#f8f7f6,#edebe9); }
  .note { padding: 8px 12px; border-radius: 4px; margin: 8px 0; } .note.err { background: #fde7e9; } .note.warn { background: #fff4ce; } .note.info { background: #e8f0fb; }
  .layer { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding-top: 6vh; z-index: 20; }
  .dlg { background: #fff; border-radius: 6px; width: min(560px, calc(100vw - 24px)); max-height: 86vh; overflow: auto; padding: 16px 20px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .dlg h2 { font-size: 17px; margin-bottom: 10px; } .dlg .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .fld { margin: 10px 0; } .fld label { display: block; font-size: 12px; color: #605e5c; margin-bottom: 2px; } .fld .hint { font-size: 12px; color: #605e5c; margin-top: 2px; } .fld .e { font-size: 12px; color: #a4262c; margin-top: 2px; }
  .fld input[type=text], .fld textarea, .fld select { width: 100%; font: inherit; padding: 4px 8px; border: 1px solid #8a8886; border-radius: 4px; background: #fff; }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: #a4262c; }
  .chosen { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; } .chosen .tag { margin: 0; background: #e1dfdd; }
  ul.opts { list-style: none; margin: 2px 0 0; padding: 4px 0; border: 1px solid #c8c6c4; border-radius: 4px; max-height: 150px; overflow: auto; }
  ul.opts li { padding: 3px 10px; cursor: pointer; display: flex; gap: 8px; } ul.opts li:hover { background: #f3f2f1; } ul.opts li.hintrow { color: #605e5c; cursor: default; }
  ul.lst { margin: 4px 0 8px; padding-left: 20px; max-height: 120px; overflow: auto; }
  .menu { position: absolute; z-index: 10; background: #fff; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.3); padding: 4px 0; min-width: 210px; }
  .menu button { display: block; width: 100%; text-align: left; border-radius: 0; background: none; padding: 5px 14px; } .menu button:hover { background: #f3f2f1; } .menu .d { color: #a4262c; }
  #notice { position: fixed; left: 16px; bottom: 16px; background: #323130; color: #fff; padding: 8px 14px; border-radius: 4px; display: none; z-index: 30; }
  .proto { font-size: 12px; color: #605e5c; margin: 0 0 12px; max-width: 720px; }
</style>
</head>
<body>
<header class="top">
  <b>mod-018</b> Роль:
  <button data-set="role=admin">Администратор</button><button data-set="role=member">Участник</button>
  <span>Данные «Областей»:</span>
  <button data-set="data=ok">Обычные</button><button data-set="data=empty">Пусто</button><button data-set="data=loading">Загрузка</button><button data-set="data=error">Ошибка</button>
  <span>Ширина:</span><button data-set="width=wide">Обычная</button><button data-set="width=narrow">640 px</button>
</header>
<div class="shell">
  <nav aria-label="Настройки">
    <h4>Организация</h4>
    <a href="#">Общие</a><a href="#">Проекты</a><a href="#">Команды</a><a href="#" id="navAreas" class="cur" data-go="tree">Области</a><a href="#">Участники</a><a href="#">Процесс</a>
    <h4>Проект</h4><a href="#">Общие</a><a href="#">Команды</a>
  </nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="notice" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TOP = '__top__';
const EXPAND_ALL_LIMIT = 100, PICKER_LIMIT = 50, MAX_DEPTH = 10;

const areas = {
  inf: { id: 'inf', name: 'Инфраструктура', parent: null, desc: '' },
  log: { id: 'log', name: 'Логистика', parent: null, desc: 'Склады и перевозки' },
  skl: { id: 'skl', name: 'Складские системы', parent: 'log', desc: 'Складское ПО и интеграции' },
  trn: { id: 'trn', name: 'Транспортные системы', parent: 'log', desc: '' },
  fin: { id: 'fin', name: 'Финансы', parent: null, desc: '' },
};
const projects = {
  alpha: { id: 'alpha', name: 'Alpha', key: 'ALP', active: true },
  beta: { id: 'beta', name: 'Beta', key: 'BET', active: true },
  gamma: { id: 'gamma', name: 'Gamma', key: 'GAM', active: false },
};
const teams = { mars: { id: 'mars', name: 'MARS' }, venus: { id: 'venus', name: 'VENUS' }, jupiter: { id: 'jupiter', name: 'JUPITER' } };
const links = { pa: [['skl', 'alpha'], ['skl', 'gamma'], ['log', 'beta']], ta: [['skl', 'mars']] };
let seq = 0;

const st = { role: 'admin', data: 'ok', width: 'wide', view: { kind: 'tree' }, expanded: null, selected: null, dlg: null, menu: null };
const admin = () => st.role === 'admin';
const byName = (a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase(), 'ru');
const kids = (id) => Object.values(areas).filter((a) => a.parent === id).sort(byName);
const path = (id) => (id === null ? '' : (areas[id].parent ? path(areas[id].parent) + ' / ' : '') + areas[id].name);
const descendants = (id) => kids(id).flatMap((k) => [k.id, ...descendants(k.id)]);
const level = (id) => (areas[id].parent ? 1 + level(areas[id].parent) : 1);
const height = (id) => 1 + Math.max(0, ...kids(id).map((k) => height(k.id)));
const notice = (t) => { const n = $('#notice'); n.textContent = t; n.style.display = 'block'; clearTimeout(n.t); n.t = setTimeout(() => (n.style.display = 'none'), 4000); };
const linkedProjects = (a) => links.pa.filter((l) => l[0] === a).map((l) => projects[l[1]]);
const linkedTeams = (a) => links.ta.filter((l) => l[0] === a).map((l) => teams[l[1]]);
const areaLink = (id) => `<a class="l" data-go="area:${id}" href="#">${esc(path(id))}</a>`;

function expandedSet() {
  if (st.expanded) return st.expanded;
  const all = Object.keys(areas);
  return new Set(all.length <= EXPAND_ALL_LIMIT ? all.filter((id) => kids(id).length) : []);
}
function menuBtn(label, key) { return `<button class="ghost" data-menu="${key}" aria-label="${esc(label)}" aria-haspopup="menu">⋮</button>`; }
function skeleton(n = 4) { return `<div class="card" role="status" aria-label="Загрузка данных">${'<div class="skel"></div>'.repeat(n)}</div>`; }

/* ---------- views ---------- */
function treeView() {
  const set = expandedSet();
  const head = (cmds) => `<div class="head"><h1>Области</h1>${cmds}</div>`;
  if (st.data === 'loading') return head('') + skeleton(5);
  if (st.data === 'error') return head('') + `<div class="note err">Не удалось загрузить данные. <button data-act="retry">Повторить</button></div>`;
  if (st.data === 'empty') {
    return head(admin() ? `<button class="primary" data-act="create:${TOP}">+ Новая область</button>` : '') +
      `<div class="card empty"><h2>В организации пока нет областей</h2><p>${admin() ? 'Область объединяет проекты и команды организации. Создайте первую кнопкой «Новая область».' : 'Области создаёт администратор организации.'}</p>${admin() ? `<button class="primary" data-act="create:${TOP}">+ Новая область</button>` : ''}</div>`;
  }
  const hasParents = Object.keys(areas).some((id) => kids(id).length);
  const allOpen = Object.keys(areas).filter((id) => kids(id).length).every((id) => set.has(id));
  const cmds = (hasParents ? `<button data-act="toggleAll">${allOpen ? 'Свернуть всё' : 'Развернуть всё'}</button>` : '') +
    (admin() ? `<button class="primary" data-act="create:${TOP}">+ Новая область</button>` : '');
  const rows = [];
  const walk = (parent, lvl) => kids(parent).forEach((a) => {
    const has = kids(a.id).length > 0, open = set.has(a.id);
    rows.push(`<tr role="row" tabindex="0" data-row="${a.id}" aria-level="${lvl}" ${has ? `aria-expanded="${open}"` : ''} class="${st.selected === a.id ? 'sel' : ''}">
      <td><div class="nm" style="padding-left:${(lvl - 1) * 24}px">${has ? `<button class="tg" data-toggle="${a.id}" tabindex="-1" aria-label="${open ? 'Свернуть' : 'Развернуть'} «${esc(a.name)}»">${open ? '▾' : '▸'}</button>` : '<span class="tg"></span>'}<a class="l" tabindex="-1" data-go="area:${a.id}" href="#">${esc(a.name)}</a></div></td>
      <td class="muted">${esc(a.desc)}</td>${admin() ? `<td class="act">${menuBtn('Действия: ' + a.name, 'row:' + a.id)}</td>` : ''}</tr>`);
    if (has && open) walk(a.id, lvl + 1);
  });
  walk(null, 1);
  return head(cmds) + `<div class="card"><table role="treegrid" aria-label="Области"><thead><tr><th>Область</th><th>Описание</th>${admin() ? '<th></th>' : ''}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <p class="proto">Прототип: клик по названию или Enter на строке открывает страницу области; ←/→ сворачивают и разворачивают; в таблице ниже 100 областей дерево раскрыто целиком (D-3).</p>`;
}

function section(title, count, addLabel, addAct, body) {
  return `<section class="sec"><div class="head"><h2>${title}<span class="count">${count === null ? '' : '(' + count + ')'}</span></h2>${admin() && addLabel ? `<button data-act="${addAct}">+ ${addLabel}</button>` : ''}</div>${body}</section>`;
}
function areaView(id) {
  const a = areas[id];
  if (!a) return `<div class="card empty"><h2>Область не найдена</h2><p>Проверьте адрес или вернитесь на главную.</p></div>`;
  const cmds = admin() ? ['rename:Переименовать', 'describe:Изменить описание', 'move:Переместить', 'delete:Удалить область'].map((c) => `<button data-act="${c.split(':')[0]}:${id}">${c.split(':')[1]}</button>`).join('') : '';
  const ch = kids(id), pr = linkedProjects(id).filter((p) => p.active), tm = linkedTeams(id);
  const tbl = (hdr, rows) => `<div class="card"><table><thead><tr>${hdr.map((h) => `<th>${h}</th>`).join('')}${admin() ? '<th></th>' : ''}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  return `<div class="head"><h1>Область: ${esc(a.name)}</h1>${cmds}</div>
  <dl class="facts card"><dt>Название</dt><dd>${esc(a.name)}</dd><dt>Родительская область</dt><dd>${a.parent ? areaLink(a.parent) : '<span class="muted">Верхний уровень</span>'}</dd>
    <dt>Описание</dt><dd>${a.desc ? esc(a.desc) : '<span class="muted">Описание не задано</span>'}</dd></dl>
  ${section('Вложенные области', ch.length, 'Новая дочерняя область', 'create:' + id, ch.length ? tbl(['Область', 'Описание'], ch.map((k) => `<tr><td>${areaLink(k.id)}</td><td class="muted">${esc(k.desc)}</td>${admin() ? '<td></td>' : ''}</tr>`)) : '<div class="card inl">Вложенных областей пока нет.</div>')}
  ${section('Проекты', pr.length, 'Добавить проект', 'link:p:' + id, pr.length ? tbl(['Проект', 'Ключ'], pr.map((p) => `<tr><td><a class="l" data-go="project:${p.id}" href="#">${esc(p.name)}</a></td><td>${p.key}</td>${admin() ? `<td class="act">${menuBtn('Ещё действия: ' + p.name, 'unl:p:' + id + ':' + p.id)}</td>` : ''}</tr>`)) : '<div class="card inl">К области не привязаны проекты</div>')}
  ${section('Команды', tm.length, 'Добавить команду', 'link:t:' + id, tm.length ? tbl(['Команда'], tm.map((t) => `<tr><td>${esc(t.name)}</td>${admin() ? `<td class="act">${menuBtn('Ещё действия: ' + t.name, 'unl:t:' + id + ':' + t.id)}</td>` : ''}</tr>`)) : '<div class="card inl">К области не привязаны команды</div>')}
  <p class="proto">Деактивированный проект (Gamma) связан с областью, но в списке не показан; в подтверждении удаления он назван «деактивирован».</p>`;
}
function projectView(id) {
  const p = projects[id], mine = links.pa.filter((l) => l[1] === id).map((l) => l[0]);
  return `<div class="head"><h1>Общие</h1></div>
  <dl class="facts card"><dt>Название</dt><dd>${esc(p.name)}</dd><dt>Описание</dt><dd class="muted">Описание не задано</dd><dt>Ключ</dt><dd>${p.key}</dd></dl>
  ${section('Области', mine.length, 'Добавить область', 'link:a:' + id, mine.length ? `<div class="card"><table><thead><tr><th>Область</th>${admin() ? '<th></th>' : ''}</tr></thead><tbody>${mine.map((a) => `<tr><td>${areaLink(a)}</td>${admin() ? `<td class="act">${menuBtn('Ещё действия: ' + path(a), 'unl:a:' + id + ':' + a)}</td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="card inl">Проект не входит ни в одну область</div>')}
  <p class="proto">Проект ${esc(p.name)}: страница «Общие», куда ведёт строка проекта на странице области (D-4 A). <a class="l" data-go="tree" href="#">← к областям</a></p>`;
}

/* ---------- dialogs ---------- */
function field(name, label, control, hint, err) {
  return `<div class="fld ${err ? 'bad' : ''}"><label for="f-${name}">${label}</label>${control}${err ? `<div class="e">${err}</div>` : hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function multi(name, label, options, hint, d) {
  const chosen = d.pick[name] || new Set(), q = (d.q[name] || '').toLowerCase();
  const m = options.filter((o) => (o.label + ' ' + (o.sub || '')).toLowerCase().includes(q));
  const shown = m.slice(0, PICKER_LIMIT);
  const li = shown.map((o) => `<li data-pick="${name}:${o.id}" role="option" aria-selected="${chosen.has(o.id)}"><span aria-hidden="true">${chosen.has(o.id) ? '☑' : '☐'}</span>${esc(o.label)}${o.sub ? `<span class="muted">${esc(o.sub)}</span>` : ''}</li>`).join('') +
    (m.length > shown.length ? `<li class="hintrow">Показаны первые ${PICKER_LIMIT} из ${m.length}. Уточните запрос.</li>` : '') + (m.length ? '' : '<li class="hintrow">Ничего не найдено</li>');
  const tags = [...chosen].map((id) => `<span class="tag">${esc(options.find((o) => o.id === id)?.label || id)} <button class="ghost" data-pick="${name}:${id}" aria-label="Убрать «${esc(options.find((o) => o.id === id)?.label || id)}»">×</button></span>`).join('');
  return `<div class="fld"><label for="f-${name}">${label}</label><div class="chosen" id="ch-${name}">${tags}</div><input type="text" id="f-${name}" data-q="${name}" value="${esc(d.q[name] || '')}" placeholder="Начните вводить название" autocomplete="off"><ul class="opts" id="ul-${name}" role="listbox" aria-multiselectable="true" aria-label="${label}">${li}</ul>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
const parentOptions = (exclude = new Set(), allowTop = true) =>
  (allowTop ? [`<option value="${TOP}">Верхний уровень</option>`] : []).concat(Object.keys(areas).filter((id) => !exclude.has(id)).sort((a, b) => path(a).localeCompare(path(b), 'ru')).map((id) => `<option value="${id}">${esc(path(id))}</option>`));
const projOptions = (skip = []) => Object.values(projects).filter((p) => p.active && !skip.includes(p.id)).map((p) => ({ id: p.id, label: p.name, sub: p.key }));
const teamOptions = (skip = []) => Object.values(teams).filter((t) => !skip.includes(t.id)).map((t) => ({ id: t.id, label: t.name }));
const areaOptions = (skip = []) => Object.keys(areas).filter((a) => !skip.includes(a)).map((a) => ({ id: a, label: path(a) }));

function dialogHtml() {
  const d = st.dlg; if (!d) return '';
  const btn = (primary, label, act, disabled) => `<button class="${primary || ''}" data-act="${act}" ${disabled ? 'aria-disabled="true"' : ''}>${label}</button>`;
  const wrap = (title, body, foot) => `<div class="dlg" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${d.alert ? `<div class="note err">${d.alert}</div>` : ''}${body}<div class="foot">${foot}</div></div>`;
  if (d.kind === 'create') {
    const withLinks = admin();
    return wrap('Новая область',
      field('name', 'Название *', `<input type="text" id="f-name" value="${esc(d.name || '')}" autofocus>`, 'От 1 до 100 символов.', d.err.name) +
      field('parent', 'Родительская область', `<select id="f-parent">${parentOptions().join('').replace(`value="${d.parent}"`, `value="${d.parent}" selected`)}</select>`, 'Необязательно. По умолчанию область создаётся на верхнем уровне.', d.err.parent) +
      field('desc', 'Описание', `<textarea id="f-desc" rows="2">${esc(d.desc || '')}</textarea>`, 'Необязательно. Не более 2000 символов.', d.err.desc) +
      (withLinks ? multi('p', 'Проекты', projOptions(), 'Необязательно. Можно добавить позже.', d) + multi('t', 'Команды', teamOptions(), 'Необязательно. Можно добавить позже.', d) : ''),
      btn('', 'Отмена', 'close') + btn('primary', 'Создать', 'submit'));
  }
  if (d.kind === 'rename') return wrap('Переименование области', field('name', 'Название *', `<input type="text" id="f-name" value="${esc(d.name)}" autofocus>`, 'От 1 до 100 символов.', d.err.name), btn('', 'Отмена', 'close') + btn('primary', 'Сохранить', 'submit'));
  if (d.kind === 'describe') return wrap('Описание области', field('desc', 'Описание', `<textarea id="f-desc" rows="3" autofocus>${esc(d.desc)}</textarea>`, 'Не более 2000 символов.', d.err.desc), btn('', 'Отмена', 'close') + btn('primary', 'Сохранить', 'submit'));
  if (d.kind === 'move') {
    const a = areas[d.id], n = descendants(d.id).length;
    const ex = new Set([d.id, ...descendants(d.id), ...(a.parent ? [a.parent] : [])]);
    return wrap('Перемещение области',
      `<p>${n ? `Область «${esc(a.name)}» переместится вместе со всеми вложенными областями: ${n}.` : `Область «${esc(a.name)}» переместится.`}</p>` +
      field('parent', 'Новая родительская область *', `<select id="f-parent"><option value="">Выберите область</option>${parentOptions(ex, a.parent !== null).join('').replace(`value="${d.parent}"`, `value="${d.parent}" selected`)}</select>`, '', d.err.parent),
      btn('', 'Отмена', 'close') + btn('primary', 'Переместить', 'submit', !d.parent));
  }
  if (d.kind === 'delete') {
    const a = areas[d.id], kidsN = kids(d.id).length;
    const ps = linkedProjects(d.id), ts = linkedTeams(d.id);
    let body;
    if (kidsN) body = `<div class="note warn">Нельзя удалить область, в которой есть вложенные области</div>`;
    else if (d.counting) body = skeleton(2);
    else if (!ps.length && !ts.length) body = `<p>Удалить область «${esc(a.name)}»? Восстановить область будет нельзя.</p>`;
    else body = `<p>Удалить область «${esc(a.name)}»? Её связи будут удалены, сами проекты и команды не изменятся.</p>
      ${ts.length ? `<b>Команды (${ts.length})</b><ul class="lst" aria-label="Команды области">${ts.map((t) => `<li>${esc(t.name)}</li>`).join('')}</ul>` : ''}
      ${ps.length ? `<b>Проекты (${ps.length})</b><ul class="lst" aria-label="Проекты области">${ps.map((p) => `<li>${esc(p.name)}${p.active ? '' : '<span class="tag">деактивирован</span>'}</li>`).join('')}</ul>` : ''}
      <p>Восстановить область будет нельзя.</p>`;
    return wrap('Удаление области', body, btn('', 'Отмена', 'close') + btn('danger', 'Удалить область', 'submit', kidsN || d.counting));
  }
  if (d.kind === 'link') {
    const T = { p: ['Добавление проектов в область', 'Проекты', `Выбранные проекты войдут в область «${esc(areas[d.id]?.name)}». Их рабочие элементы и доступ к ним это не меняет.`],
      t: ['Добавление команд в область', 'Команды', `Выбранные команды войдут в область «${esc(areas[d.id]?.name)}». Работу команд и доступ их участников это не меняет.`],
      a: ['Добавление областей в проект', 'Области', `Проект «${esc(projects[d.id]?.name)}» войдёт в выбранные области. Его рабочие элементы и доступ к ним это не меняет.`] }[d.end];
    const opts = d.end === 'p' ? projOptions(links.pa.filter((l) => l[0] === d.id).map((l) => l[1])) : d.end === 't' ? teamOptions(links.ta.filter((l) => l[0] === d.id).map((l) => l[1])) : areaOptions(links.pa.filter((l) => l[1] === d.id).map((l) => l[0])).map((o) => o);
    const chosen = d.pick.x || new Set();
    return wrap(T[0], `<p>${T[2]}</p>` + (opts.length ? multi('x', T[1] + ' *', opts, '', d) : `<div class="note info">Все уже подключены.</div>`), btn('', 'Отмена', 'close') + btn('primary', 'Добавить', 'submit', !chosen.size));
  }
  if (d.kind === 'unlink') {
    const [k, owner, other] = [d.end, d.id, d.other];
    const txt = k === 'p' ? [`Отключение проекта от области`, `Отключить проект «${esc(projects[other].name)}» от области «${esc(areas[owner].name)}»? Сам проект и его рабочие элементы не изменятся.`]
      : k === 't' ? [`Отключение команды от области`, `Отключить команду «${esc(teams[other].name)}» от области «${esc(areas[owner].name)}»? Сама команда и её рабочие элементы не изменятся.`]
      : [`Отключение области от проекта`, `Отключить область «${esc(areas[other].name)}» от проекта «${esc(projects[owner].name)}»? Сама область и проект не изменятся.`];
    return wrap(txt[0], `<p>${txt[1]}</p>`, btn('', 'Отмена', 'close') + btn('danger', 'Отключить', 'submit'));
  }
}
function draw() {
  document.querySelectorAll('header.top button').forEach((b) => {
    const [k, v] = b.dataset.set.split('=');
    b.setAttribute('aria-pressed', String(st[k] === v));
  });
  $('main').className = st.width === 'narrow' ? 'narrow' : '';
  const v = st.view;
  $('main').innerHTML = v.kind === 'tree' ? treeView() : v.kind === 'area' ? areaView(v.id) : projectView(v.id);
  $('#layer').innerHTML = st.dlg ? `<div class="layer">${dialogHtml()}</div>` : '';
  $('#navAreas').className = v.kind === 'project' ? '' : 'cur';
  const f = $('#layer input[type=text]:not([data-q]), #layer textarea');
  if (f && st.dlg && st.dlg.focus !== false) f.focus();
}

/* ---------- actions ---------- */
function openDlg(kind, extra) {
  st.dlg = Object.assign({ kind, err: {}, pick: {}, q: {}, alert: '' }, extra);
  if (kind === 'delete') { st.dlg.counting = true; setTimeout(() => { if (st.dlg && st.dlg.kind === 'delete') { st.dlg.counting = false; draw(); } }, 600); }
  draw();
}
function readForm() {
  const d = st.dlg, g = (id) => $('#layer #' + id);
  if (g('f-name')) d.name = g('f-name').value; if (g('f-desc')) d.desc = g('f-desc').value; if (g('f-parent')) d.parent = g('f-parent').value;
}
const clash = (parent, name, self) => Object.values(areas).some((a) => a.parent === parent && a.id !== self && a.name.trim().toLowerCase() === name.trim().toLowerCase());
function submit() {
  const d = st.dlg; readForm(); d.err = {}; d.alert = '';
  if (d.kind === 'create' || d.kind === 'rename') {
    const n = d.name.trim(), parent = d.kind === 'create' ? (d.parent === TOP || !d.parent ? null : d.parent) : areas[d.id].parent;
    if (n.length < 1 || n.length > 100) d.err.name = 'Название должно содержать от 1 до 100 символов';
    else if (clash(parent, n, d.kind === 'rename' ? d.id : null)) d.err.name = 'Область с таким названием уже есть на этом уровне';
    if (d.kind === 'create' && parent && level(parent) >= MAX_DEPTH) d.err.parent = 'Дерево областей не может быть глубже 10 уровней';
    if (d.desc && d.desc.length > 2000) d.err.desc = 'Описание должно содержать не более 2000 символов';
    if (Object.keys(d.err).length) return draw();
    if (d.kind === 'rename') { areas[d.id].name = n; notice('Область переименована.'); }
    else {
      const id = 'n' + ++seq; areas[id] = { id, name: n, parent, desc: d.desc || '' };
      [...(d.pick.p || [])].forEach((p) => links.pa.push([id, p])); [...(d.pick.t || [])].forEach((t) => links.ta.push([id, t]));
      if (parent) { st.expanded = new Set([...expandedSet(), parent]); } st.selected = id; st.data = 'ok';
      notice(`Область «${n}» создана.`);
    }
  } else if (d.kind === 'describe') {
    if ((d.desc || '').length > 2000) { d.err.desc = 'Описание должно содержать не более 2000 символов'; return draw(); }
    areas[d.id].desc = d.desc || ''; notice('Описание области сохранено.');
  } else if (d.kind === 'move') {
    const np = d.parent === TOP ? null : d.parent, a = areas[d.id];
    if (clash(np, a.name, d.id)) { d.err.parent = 'Область с таким названием уже есть на этом уровне'; return draw(); }
    if ((np ? level(np) : 0) + height(d.id) > MAX_DEPTH) { d.err.parent = 'Дерево областей не может быть глубже 10 уровней'; return draw(); }
    a.parent = np; if (np) st.expanded = new Set([...expandedSet(), np]); st.selected = d.id; notice(`Область «${a.name}» перемещена.`);
  } else if (d.kind === 'delete') {
    if (kids(d.id).length) return;
    const nm = areas[d.id].name; delete areas[d.id]; links.pa = links.pa.filter((l) => l[0] !== d.id); links.ta = links.ta.filter((l) => l[0] !== d.id);
    st.view = { kind: 'tree' }; notice(`Область «${nm}» удалена.`);
  } else if (d.kind === 'link') {
    const ids = [...(d.pick.x || [])]; if (!ids.length) return;
    ids.forEach((o) => (d.end === 'p' ? links.pa.push([d.id, o]) : d.end === 't' ? links.ta.push([d.id, o]) : links.pa.push([o, d.id])));
    notice(d.end === 'a' ? (ids.length === 1 ? `Область «${areas[ids[0]].name}» добавлена.` : `Области добавлены: ${ids.length}.`)
      : d.end === 'p' ? (ids.length === 1 ? `Проект «${projects[ids[0]].name}» добавлен.` : `Проекты добавлены: ${ids.length}.`)
      : ids.length === 1 ? `Команда «${teams[ids[0]].name}» добавлена.` : `Команды добавлены: ${ids.length}.`);
  } else if (d.kind === 'unlink') {
    if (d.end === 'p') links.pa = links.pa.filter((l) => !(l[0] === d.id && l[1] === d.other));
    else if (d.end === 't') links.ta = links.ta.filter((l) => !(l[0] === d.id && l[1] === d.other));
    else links.pa = links.pa.filter((l) => !(l[1] === d.id && l[0] === d.other));
    notice(d.end === 'p' ? 'Проект отключён от области.' : d.end === 't' ? 'Команда отключена от области.' : 'Область отключена от проекта.');
  }
  st.dlg = null; draw();
}
function openMenu(btn, key) {
  closeMenu();
  const [kind, a, b, c] = key.split(':'); const items = [];
  if (kind === 'row') items.push(['create:' + a, 'Новая дочерняя область'], ['rename:' + a, 'Переименовать'], ['describe:' + a, 'Изменить описание'], ['move:' + a, 'Переместить'], ['delete:' + a, 'Удалить область', 1]);
  else items.push(['unlink:' + [a, b, c].join(':'), kind === 'unl' && a === 'a' ? 'Отключить от проекта' : 'Отключить от области', 1]);
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((i) => `<button role="menuitem" class="${i[2] ? 'd' : ''}" data-act="${i[0]}">${i[1]}</button>`).join('');
  const r = btn.getBoundingClientRect(); m.style.left = Math.max(8, r.right + scrollX - 210) + 'px'; m.style.top = r.bottom + scrollY + 'px';
  document.body.appendChild(m); st.menu = m; m.querySelector('button').focus();
}
function closeMenu() { if (st.menu) { st.menu.remove(); st.menu = null; } }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-set],[data-go],[data-act],[data-menu],[data-toggle],[data-pick],[data-row]');
  if (!t) return closeMenu();
  if (t.dataset.set) { const [k, v] = t.dataset.set.split('='); st[k] = v; if (k === 'role' || k === 'data') st.dlg = null; return draw(); }
  if (t.dataset.menu) { e.stopPropagation(); return openMenu(t, t.dataset.menu); }
  if (t.dataset.toggle) { const s = new Set(expandedSet()); s.has(t.dataset.toggle) ? s.delete(t.dataset.toggle) : s.add(t.dataset.toggle); st.expanded = s; return draw(); }
  if (t.dataset.pick) { const [n, id] = t.dataset.pick.split(':'); const s = (st.dlg.pick[n] = st.dlg.pick[n] || new Set()); s.has(id) ? s.delete(id) : s.add(id); readForm(); st.dlg.focus = false; draw(); const q = $('#layer [data-q="' + n + '"]'); if (q) q.focus(); return; }
  if (t.dataset.go) { e.preventDefault(); closeMenu(); const [k, id] = t.dataset.go.split(':'); st.view = k === 'tree' ? { kind: 'tree' } : { kind: k, id }; return draw(); }
  if (t.dataset.row && !e.target.closest('a,button')) { st.selected = t.dataset.row; return draw(); }
  if (t.dataset.act) {
    closeMenu(); const [act, a, b, c] = t.dataset.act.split(':');
    if (act === 'retry') { st.data = 'ok'; return draw(); }
    if (act === 'toggleAll') { const all = Object.keys(areas).filter((id) => kids(id).length); st.expanded = all.every((id) => expandedSet().has(id)) ? new Set() : new Set(all); return draw(); }
    if (act === 'close') { st.dlg = null; return draw(); }
    if (act === 'submit') { if (t.getAttribute('aria-disabled') === 'true') return; return submit(); }
    if (act === 'create') return openDlg('create', { parent: a === TOP || !a ? TOP : a });
    if (act === 'rename') return openDlg('rename', { id: a, name: areas[a].name });
    if (act === 'describe') return openDlg('describe', { id: a, desc: areas[a].desc });
    if (act === 'move') return openDlg('move', { id: a, parent: '' });
    if (act === 'delete') return openDlg('delete', { id: a });
    if (act === 'link') return openDlg('link', { end: a, id: b });
    if (act === 'unlink') return openDlg('unlink', { end: a, id: b, other: c });
  }
});
document.addEventListener('input', (e) => {
  const q = e.target.dataset && e.target.dataset.q; if (!q || !st.dlg) return;
  st.dlg.q[q] = e.target.value;
  const d = st.dlg; const keep = e.target.selectionStart;
  readForm(); st.dlg.focus = false; draw(); const n = $('#layer [data-q="' + q + '"]'); if (n) { n.focus(); n.setSelectionRange(keep, keep); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (st.menu) return closeMenu(); if (st.dlg) { st.dlg = null; draw(); } return; }
  const row = e.target.closest && e.target.closest('tr[data-row]');
  if (row && e.target === row) {
    const id = row.dataset.row, rows = [...document.querySelectorAll('tr[data-row]')], i = rows.indexOf(row);
    if (e.key === 'Enter') { st.view = { kind: 'area', id }; draw(); }
    else if (e.key === ' ') { e.preventDefault(); st.selected = id; draw(); document.querySelector(`tr[data-row="${id}"]`).focus(); }
    else if (e.key === 'ArrowDown' && rows[i + 1]) { e.preventDefault(); rows[i + 1].focus(); }
    else if (e.key === 'ArrowUp' && rows[i - 1]) { e.preventDefault(); rows[i - 1].focus(); }
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && kids(id).length) {
      e.preventDefault(); const s = new Set(expandedSet()); e.key === 'ArrowRight' ? s.add(id) : s.delete(id); st.expanded = s; draw(); document.querySelector(`tr[data-row="${id}"]`).focus();
    }
  }
});
draw();
</script>
</body>

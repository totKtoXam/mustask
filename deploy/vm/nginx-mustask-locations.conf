# MUSTASK under a path of someone else's server (docs/deploy/vm.md, section 7,
# the shared-host layout). `install.sh nginx --path @BASE_PATH@` fills
# @BASE_PATH@ and installs this file where the owner of the server can
# `include` it from inside that server's `server { ... }`. It holds locations
# only: no listen, server_name or certificate.
#
# nginx passes the path to the API unchanged (proxy_pass with no URI part):
# the API itself serves under @BASE_PATH@ (Hosting__PathBase, ADR-0037).

# The API: only @BASE_PATH@/api/ is exposed. /health and /alive stay internal.
location ^~ @BASE_PATH@/api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
    # The sign-in callback answers with the session cookie (the encrypted
    # ticket with the tokens, ~3.5 KB on a bare realm, more with every claim
    # the shared realm adds) plus the OIDC cookies it clears. The default
    # 4-8 KB header buffer is too small: nginx answers 502.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
}

# Without the trailing slash.
location = @BASE_PATH@ {
    return 301 @BASE_PATH@/;
}

# The panel: a single-page app, unknown paths fall back to index.html.
# Anything else under the prefix, /health included, is the panel's index.html.
location ^~ @BASE_PATH@/ {
    alias /opt/mustask/current/panel/;
    try_files $uri @BASE_PATH@/index.html;
}

# Тема входа Mustask. Наследуется от штатной `keycloak.v2` — она и
# есть тема Keycloak по умолчанию начиная с 24-й версии.
#
# `styles` у родителя — ровно `css/styles.css` (проверено распаковкой
# org.keycloak.keycloak-themes-26.4.7.jar), поэтому здесь оно повторено и
# дополнено нашим файлом: ключ переопределяется целиком, а не дописывается.
# `stylesCommon` (PatternFly) не трогаем — он наследуется как есть.
#
# Тема привязана к realm'у полем `loginTheme` в deploy/keycloak/realms/mustask-realm.json.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/mustask.css

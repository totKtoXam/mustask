name: Deploy
run-name: Deploy ${{ inputs.tag || github.ref_name }}

# CD for the one production VM (tech-066, docs/deploy/vm.md section 11).
#
# A release tag v* deploys itself; workflow_dispatch redeploys a tag by hand.
# Nothing else triggers this workflow, and it must stay that way: the deploy
# job runs on a self-hosted runner on the production VM, and this repository
# is public. A pull_request trigger here would let a fork's PR run its own
# code on that VM. CI (ci.yml) runs PRs on ubuntu-latest only.
#
# The build runs on a GitHub-hosted runner: the VM carries no .NET SDK, Node
# or npm cache, and no repository checkout. It gets one artifact, the release
# tarball deploy/vm/build-release.sh makes, and runs exactly two commands as
# root through sudoers: `mustask-cd deploy` (the tarball on stdin) and
# `mustask-cd smoke` (deploy/vm/mustask-cd.sh, installed by runner-setup.sh).
#
# The notes job (ubuntu-latest) writes what the release carries -- the merged
# PR titles since the previous tag, scripts/release-notes.sh -- into the run
# summary and the GitHub Release page of the tag (tech-069, ADR-0043). It runs
# before deploy on purpose: the approver reads the notes before approving.
# Its token may write contents; no other job's may.
#
# The deploy job waits for the `production` environment's required reviewer.
# The public address the release is built for is the repository variable
# MUSTASK_SITE_URL (https://<host> or https://<host>/<path>); it must equal
# Session__PanelUrl on the VM, or install.sh refuses the release.
#
# Actions are pinned by commit: a moved tag must not change what runs next to
# production.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (v*); run from main or from that tag'
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time, and a queued one never cancels the one that is
# running: install.sh deploy stopped halfway leaves the service mid-restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build the release
    # workflow_dispatch can be started from any branch; the kit (deploy/vm)
    # is taken from the ref the run starts from, so only main and tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then tag=$INPUT_TAG; else tag=$REF_NAME; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[A-Za-z0-9._-]+$' || printf '%s' "$tag" | grep -q '\.\.'; then
            echo "::error::'$tag' is not a release tag v<name>"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Site address
        env:
          SITE: ${{ vars.MUSTASK_SITE_URL }}
        run: |
          if [ -z "$SITE" ]; then
            echo "::error::the repository variable MUSTASK_SITE_URL is not set (docs/deploy/vm.md section 11)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build-release.sh checks the tag out into its own worktree
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version '10.*'
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SITE: ${{ vars.MUSTASK_SITE_URL }}
        run: bash deploy/vm/build-release.sh "$TAG" "$SITE" "$RUNNER_TEMP/out"

      - name: Checksum
        id: pack
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sum=$(sha256sum "$RUNNER_TEMP/out/mustask-$TAG.tar.gz" | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "mustask-$TAG.tar.gz sha256 $sum"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/out/mustask-${{ steps.tag.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  notes:
    name: Release notes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub Release of the tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-notes.sh reads the merge commits and the tags
          persist-credentials: false

      - name: Notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: sh scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Run summary
        run: cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A redeploy (workflow_dispatch) finds the release already there:
        # only its notes are rewritten.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  deploy:
    name: Deploy to production
    needs: [build, notes]
    # The production VM. Only this job of only this workflow may target it.
    runs-on: [self-hosted, linux, mustask-prod]
    environment:
      name: production
      url: ${{ vars.MUSTASK_SITE_URL }}
    timeout-minutes: 15
    permissions:
      actions: read

    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Check the tarball
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        working-directory: ${{ runner.temp }}/release
        run: printf '%s  %s\n' "$SHA256" "mustask-$TAG.tar.gz" | sha256sum -c -

      - name: Deploy
        env:
          TAG: ${{ needs.build.outputs.tag }}
        # The runner user reads the tarball and root gets it on stdin: that is
        # the point (the sudoers rule takes no path).
        run: |
          # shellcheck disable=SC2024
          sudo -n /usr/local/sbin/mustask-cd deploy < "$RUNNER_TEMP/release/mustask-$TAG.tar.gz"

      - name: Smoke
        run: sudo -n /usr/local/sbin/mustask-cd smoke
